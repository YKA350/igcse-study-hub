ected in the x-axis. Write the equation of the new graph.", "ms": ["y = -f(x)"]}], "27": [{"t": "calc", "m": 1, "q": "a = (2, 3) and b = (-1, 4). Find 2a + b.", "ms": ["(3, 10)"]}, {"t": "calc", "m": 1, "q": "Find the magnitude of the vector (6, 8).", "ms": ["10"]}, {"t": "calc", "m": 1, "q": "OA = a and OB = b. M is the midpoint of AB. Write OM in terms of a and b.", "ms": ["1/2 (a + b)"]}, {"t": "short", "m": 3, "q": "Explain how to show that three points A, B and C lie on a straight line using vectors.", "ms": ["find AB and BC", "show one is a multiple of the other", "they share the common point B so are collinear"]}, {"t": "calc", "m": 1, "q": "a = (3, 1) and b = (2, 5). Find a + b.", "ms": ["(5, 6)"]}, {"t": "calc", "m": 1, "q": "Find the magnitude of the vector (5, 12).", "ms": ["13"]}], "28": [{"t": "calc", "m": 1, "q": "Differentiate y = 3x cubed - 5x + 2.", "ms": ["9x squared - 5"]}, {"t": "calc", "m": 1, "q": "Find the gradient of y = x squared + 4x at x = 3 and the equation of the tangent there.", "ms": ["gradient 10 and tangent y = 10x - 9"]}, {"t": "calc", "m": 1, "q": "Find the stationary point of y = x squared - 6x + 5 and state whether it is a maximum or a minimum.", "ms": ["minimum at (3, -4)"]}, {"t": "calc", "m": 1, "q": "A particle has displacement s = 2t cubed - 9t squared + 12t. Find the velocity and the time when it is at rest.", "ms": ["v = 6t squared - 18t + 12, at rest when t = 1 or t = 2"]}, {"t": "calc", "m": 1, "q": "Differentiate y = 5x^3 - 2x.", "ms": ["dy/dx = 15x^2 - 2"]}, {"t": "calc", "m": 1, "q": "Differentiate y = x^2 + 4x + 1 and find the gradient when x = 3.", "ms": ["10"]}]}, "biology": {"1": [{"t": "short", "m": 2, "q": "State two characteristics of living organisms, other than nutrition and respiration.", "ms": ["excretion (removal of waste from metabolism)", "movement", "reproduction", "growth and development", "sensitivity or response to surroundings", "control of internal conditions (any two)"]}, {"t": "explain", "m": 3, "q": "A student places a plant cell and an animal cell in distilled water. Explain why the animal cell bursts but the plant cell does not.", "ms": ["water enters by osmosis (from high to low water potential)", "animal cell has no cell wall so the membrane stretches and bursts", "plant cell wall is strong and stops it bursting, so the cell becomes turgid"]}, {"t": "short", "m": 3, "q": "Describe how the shape of an enzyme is linked to its function.", "ms": ["enzyme has an active site", "of a specific shape that is complementary to the substrate", "only that substrate fits, so enzymes are specific"]}, {"t": "calc", "m": 1, "q": "A potato cylinder has mass 4.0 g before and 4.6 g after being left in a sucrose solution. Calculate the percentage change in mass.", "ms": ["15 % (increase)"]}, {"t": "extended", "m": 6, "q": "Describe an investigation to find the effect of temperature on the rate of an enzyme-catalysed reaction. Include how you would make it a fair test and how you would use your results.", "ms": ["use a range of at least five temperatures with a water bath and thermometer", "same volume and concentration of enzyme and substrate each time", "same pH using a buffer", "allow solutions to reach each temperature before mixing", "measure time taken or rate for a product to form or substrate to disappear", "repeat and calculate a mean", "plot rate against temperature and find the optimum"]}, {"t": "short", "m": 2, "q": "Name two things that all living organisms do and give one example of each.", "ms": ["any two of movement, respiration, sensitivity, growth, reproduction, excretion, nutrition", "a correct example for each"]}, {"t": "short", "m": 1, "q": "State the name of the process by which water moves across a partially permeable membrane.", "ms": ["osmosis"]}], "2": [{"t": "short", "m": 2, "q": "Give two differences between prokaryotic and eukaryotic cells.", "ms": ["prokaryotes have no nucleus and DNA is free in the cytoplasm, eukaryotes have a nucleus", "prokaryotes have no membrane-bound organelles", "prokaryotes are much smaller", "prokaryote DNA is a single loop and may have plasmids (any two)"]}, {"t": "short", "m": 3, "q": "Name the kingdom of each organism and give one feature that supports your choice: yeast, a moss and a tapeworm.", "ms": ["yeast is a fungus (chitin cell wall, no chlorophyll, hyphae or single cell)", "moss is a plant (chlorophyll, cellulose wall, makes starch)", "tapeworm is an animal (no cell walls, feeds on other organisms or multicellular)"]}, {"t": "explain", "m": 3, "q": "Explain why viruses are not classed as living organisms.", "ms": ["they do not carry out life processes on their own", "they can only reproduce inside a host cell", "they have no cell structure, only a protein coat and genetic material"]}, {"t": "short", "m": 4, "q": "Describe the features of mammals and the features of birds that make them different classes of vertebrate.", "ms": ["mammals have fur or hair and mammary glands", "mammals have a diaphragm and give live birth (most)", "birds have feathers and a beak", "birds lay eggs with a shell and have wings"]}, {"t": "explain", "m": 6, "q": "Bacteria can be both harmful and useful. Explain how bacteria can cause disease and describe two ways in which they are useful to humans.", "ms": ["bacteria reproduce rapidly inside the body", "they release toxins that damage cells or tissues", "they may damage cells directly", "useful: making yoghurt or cheese from milk using lactic acid bacteria", "useful: producing human insulin by genetically modified bacteria or decomposing waste in sewage"]}, {"t": "short", "m": 2, "q": "State two features of all arthropods.", "ms": ["jointed legs", "exoskeleton or segmented body"]}, {"t": "short", "m": 1, "q": "Name the group of vertebrates that has dry scaly skin and lays eggs with leathery shells.", "ms": ["reptiles"]}], "3": [{"t": "short", "m": 2, "q": "Name the structures that air passes through from the mouth to the alveoli.", "ms": ["trachea", "bronchus", "bronchioles"]}, {"t": "explain", "m": 4, "q": "Explain how the alveoli are adapted for efficient gas exchange.", "ms": ["large surface area from many alveoli", "thin walls, one cell thick, so short diffusion distance", "good blood supply from capillaries maintains a concentration gradient", "moist lining lets gases dissolve and ventilation keeps oxygen high"]}, {"t": "explain", "m": 4, "q": "Explain how the ribs, intercostal muscles and diaphragm cause air to enter the lungs.", "ms": ["intercostal muscles contract, raising the ribs up and out", "diaphragm contracts and flattens", "volume of the thorax increases", "pressure decreases below atmospheric pressure so air moves in"]}, {"t": "calc", "m": 1, "q": "A person breathes 15 times per minute and each breath moves 0.5 dm3 of air. Calculate the volume of air breathed in during one hour.", "ms": ["450 dm3"]}, {"t": "extended", "m": 6, "q": "Describe the effects of smoking on the gas exchange system and explain how these effects can lead to health problems.", "ms": ["tar damages or paralyses cilia and mucus builds up", "bacteria and dirt are not removed so infections or bronchitis are more likely", "smoke damages alveoli walls leading to emphysema, reducing surface area", "less oxygen is absorbed so breathlessness", "tar contains carcinogens that cause mutations and lung cancer", "carbon monoxide reduces oxygen carried by haemoglobin"]}, {"t": "short", "m": 2, "q": "State two ways in which inspired air differs from expired air.", "ms": ["inspired has more oxygen", "expired has more carbon dioxide or more water vapour"]}, {"t": "short", "m": 1, "q": "Name the muscle that contracts and flattens during inhalation.", "ms": ["diaphragm"]}], "4": [{"t": "short", "m": 2, "q": "State the names of the enzymes that digest starch and protein, and the products of each.", "ms": ["amylase digests starch to maltose or sugars", "protease digests protein to amino acids"]}, {"t": "explain", "m": 3, "q": "Explain why bile helps the digestion of fats.", "ms": ["bile is made in the liver and stored in the gall bladder", "it emulsifies fat into small droplets giving a large surface area for lipase", "bile also neutralises acid from the stomach giving the alkaline pH for enzymes"]}, {"t": "short", "m": 3, "q": "Describe the test for protein and state the positive result.", "ms": ["add biuret solution (or sodium hydroxide then copper sulfate)", "mix and observe", "positive result is a purple or lilac colour"]}, {"t": "explain", "m": 4, "q": "Explain how the small intestine is adapted for absorption of digested food.", "ms": ["villi give a large surface area", "thin walls, one cell thick, for short diffusion distance", "capillaries and lacteals take away food keeping a steep concentration gradient", "long length and muscle movement mixes food or supplies blood"]}, {"t": "extended", "m": 6, "q": "A student investigates the energy content of a food sample by burning it under a boiling tube of water. Describe the method and how the energy released is calculated.", "ms": ["measure a known mass of food and a known volume of water into a boiling tube", "record the starting temperature of the water", "burn the food and hold it under the tube until it stops burning", "record the final temperature", "energy = mass of water x 4.2 x temperature rise", "divide by mass of food for energy per gram, and repeat for accuracy or use insulation to reduce heat loss"]}, {"t": "short", "m": 2, "q": "Name two minerals or vitamins needed in the diet and state a deficiency disease for one.", "ms": ["e.g. iron and vitamin C", "iron gives anaemia or vitamin C gives scurvy"]}, {"t": "short", "m": 1, "q": "State the name of the process by which digested food moves into the blood.", "ms": ["absorption"]}], "5": [{"t": "short", "m": 2, "q": "Name the blood vessels that carry blood to and from the heart muscle itself.", "ms": ["coronary arteries carry blood to the heart muscle", "coronary veins carry blood away (or the cardiac vein)"]}, {"t": "explain", "m": 4, "q": "Describe the path of blood through the heart, starting at the vena cava.", "ms": ["vena cava to the right atrium", "right ventricle then to the lungs through the pulmonary artery", "pulmonary vein to the left atrium, then the left ventricle", "aorta carries blood to the body"]}, {"t": "explain", "m": 3, "q": "Explain why the wall of the left ventricle is thicker than the right ventricle.", "ms": ["left ventricle pumps blood around the whole body", "this needs a higher pressure", "the right ventricle only pumps to the nearby lungs so needs less force"]}, {"t": "calc", "m": 1, "q": "A heart beats 72 times per minute and pumps 70 cm3 of blood each beat. Calculate the cardiac output in dm3 per minute.", "ms": ["5.04 dm3 per minute"]}, {"t": "extended", "m": 6, "q": "Explain how a diet high in saturated fat and a lack of exercise can increase the risk of coronary heart disease.", "ms": ["saturated fat raises blood cholesterol", "fatty deposits build up in the coronary arteries", "the arteries narrow so less blood reaches the heart muscle", "less oxygen means less aerobic respiration, causing angina or a heart attack", "a blood clot may block the artery completely", "lack of exercise leads to obesity and higher blood pressure"]}, {"t": "short", "m": 2, "q": "State two differences between arteries and veins.", "ms": ["arteries have thick muscular walls and veins thinner walls", "veins have valves and arteries do not (or arteries carry blood away from heart)"]}, {"t": "short", "m": 1, "q": "Name the blood cell that fights pathogens by phagocytosis.", "ms": ["white blood cell (phagocyte)"]}], "6": [{"t": "short", "m": 2, "q": "Name the three types of neurone in a reflex arc in order.", "ms": ["sensory neurone", "relay neurone", "motor neurone"]}, {"t": "explain", "m": 4, "q": "Describe how a reflex action such as pulling your hand from a hot object happens.", "ms": ["receptor detects the stimulus", "sensory neurone sends impulses to the spinal cord", "relay neurone passes them to a motor neurone across synapses", "motor neurone sends impulses to the effector (muscle) which contracts"]}, {"t": "short", "m": 3, "q": "Describe what happens to the eye when moving from a dim room into bright light.", "ms": ["the circular muscles of the iris contract", "the pupil gets smaller", "less light enters the eye, protecting the retina"]}, {"t": "explain", "m": 4, "q": "Explain how the eye focuses on a close object.", "ms": ["ciliary muscles contract", "suspensory ligaments become slack", "the lens becomes thicker (more curved)", "light is refracted more so it focuses on the retina"]}, {"t": "explain", "m": 6, "q": "Compare the nervous system and the endocrine system as methods of coordination.", "ms": ["nervous: electrical impulses, hormones are chemical", "nervous: very fast, hormones slower", "nervous: short-lived effects, hormones long-lasting", "nervous: acts on specific effectors, hormones travel in the blood to target organs", "nervous: reflexes and voluntary actions, hormones: growth or blood sugar", "a clear comparison of at least three of these points"]}, {"t": "short", "m": 2, "q": "State what is meant by a stimulus and a receptor.", "ms": ["a stimulus is a change in the environment", "a receptor detects the stimulus"]}, {"t": "short", "m": 1, "q": "Name the part of the eye that contains the light-sensitive cells.", "ms": ["retina"]}], "7": [{"t": "short", "m": 2, "q": "Name the gland that produces insulin and the hormone that raises blood glucose.", "ms": ["pancreas", "glucagon"]}, {"t": "explain", "m": 4, "q": "Explain how insulin controls the blood glucose concentration after a meal.", "ms": ["blood glucose rises after eating", "the pancreas secretes insulin", "insulin makes the liver take up glucose and convert it to glycogen", "blood glucose falls back to normal, an example of negative feedback"]}, {"t": "short", "m": 3, "q": "State the effects of adrenaline on the body in a frightening situation.", "ms": ["heart rate increases", "breathing rate increases and pupils dilate", "more glucose released so more energy for respiration"]}, {"t": "explain", "m": 3, "q": "Explain why a person with type 1 diabetes needs insulin injections rather than tablets.", "ms": ["the pancreas does not make enough insulin", "insulin is a protein so it would be digested in the stomach if swallowed", "injection puts it into the blood"]}, {"t": "extended", "m": 6, "q": "Compare the nervous response with the hormonal response to a frightening situation.", "ms": ["nervous response is fast, hormones slower", "nervous impulses travel along neurones, adrenaline travels in the blood", "nervous effect lasts a short time, hormone effect lasts longer", "nervous acts on specific muscles, adrenaline acts on many target organs", "adrenaline prepares for fight or flight with increased heart rate and glucose", "a conclusion linking both working together"]}, {"t": "short", "m": 2, "q": "State two differences between nervous and hormonal control.", "ms": ["nervous is fast and hormonal is slow", "nervous effect is short-lived and hormonal is longer lasting"]}, {"t": "short", "m": 1, "q": "Name the hormone that controls the blood glucose level by being released when levels are low.", "ms": ["glucagon"]}], "8": [{"t": "short", "m": 2, "q": "State what is meant by homeostasis.", "ms": ["maintaining a constant internal environment", "within set limits, such as temperature or water content"]}, {"t": "explain", "m": 4, "q": "Explain how the body responds when its temperature rises above normal.", "ms": ["thermoreceptors in the skin and hypothalamus detect the rise", "sweat glands produce more sweat and evaporation cools the skin", "vasodilation: blood vessels near the skin widen, increasing heat loss", "hairs lie flat and shivering stops"]}, {"t": "explain", "m": 4, "q": "Explain how the kidneys control the water content of the blood when a person has not drunk enough.", "ms": ["the pituitary gland releases more ADH", "ADH makes the kidney tubules reabsorb more water", "a small volume of concentrated urine is produced", "less water is lost, so water content returns to normal"]}, {"t": "short", "m": 3, "q": "Describe the roles of the liver in removing nitrogenous waste.", "ms": ["amino acids are deaminated in the liver", "the nitrogen part is made into urea", "urea is carried by blood to the kidneys and excreted in urine"]}, {"t": "extended", "m": 6, "q": "Explain how the kidney produces urine, using the terms filtration and reabsorption.", "ms": ["blood is filtered in the glomerulus at high pressure", "water, glucose, urea and salts pass into the nephron", "blood cells and proteins are too large and stay in the blood", "all glucose is reabsorbed by active transport", "some water and salts are reabsorbed as needed", "urea and excess water and salts pass to the bladder as urine"]}, {"t": "short", "m": 2, "q": "State what happens to the water potential of the blood when a person is dehydrated and how ADH responds.", "ms": ["blood becomes more concentrated", "more ADH is released so more water is reabsorbed"]}, {"t": "short", "m": 1, "q": "Name the waste product made in the liver from excess amino acids.", "ms": ["urea"]}], "9": [{"t": "short", "m": 2, "q": "Name the male and female gametes in humans.", "ms": ["sperm cell (male)", "egg cell or ovum (female)"]}, {"t": "explain", "m": 4, "q": "Describe how a fetus is supplied with oxygen and nutrients and how waste is removed.", "ms": ["the placenta is attached to the uterus wall", "the umbilical cord carries blood between fetus and placenta", "oxygen, glucose and amino acids diffuse from mother's blood to the fetus", "carbon dioxide and urea diffuse the other way and mother removes them"]}, {"t": "short", "m": 3, "q": "State three changes that occur in girls at puberty.", "ms": ["breasts develop", "hips widen and pubic hair grows", "ovaries release eggs and periods begin"]}, {"t": "explain", "m": 3, "q": "Explain how a combined contraceptive pill prevents pregnancy.", "ms": ["it contains oestrogen and progesterone", "these hormones prevent FSH and LH release", "so no egg matures or is released (ovulation stops)"]}, {"t": "extended", "m": 6, "q": "Describe the menstrual cycle and the roles of the hormones oestrogen and progesterone.", "ms": ["cycle lasts about 28 days with menstruation in days 1 to 5", "the uterus lining thickens after menstruation", "oestrogen from the ovary causes repair of the lining", "ovulation around day 14, caused by LH", "progesterone maintains the lining", "if no fertilisation, progesterone falls and the lining breaks down"]}, {"t": "short", "m": 2, "q": "State two functions of the placenta.", "ms": ["passes oxygen and nutrients to the fetus", "removes carbon dioxide and waste from the fetus"]}, {"t": "short", "m": 1, "q": "Name the hormone that causes ovulation to occur.", "ms": ["LH (luteinising hormone)"]}], "10": [{"t": "short", "m": 2, "q": "Write the word equation for photosynthesis.", "ms": ["carbon dioxide + water", "gives glucose + oxygen in the presence of light and chlorophyll"]}, {"t": "explain", "m": 4, "q": "Explain how a leaf is adapted for photosynthesis.", "ms": ["broad flat blade gives a large surface area for light", "thin, so gases diffuse quickly and light reaches cells", "palisade cells packed with chloroplasts near the top", "stomata allow carbon dioxide in and air spaces allow diffusion"]}, {"t": "short", "m": 3, "q": "Describe how to test a leaf for starch, and give the positive result.", "ms": ["boil the leaf in water to kill it, then in ethanol to remove chlorophyll", "rinse in warm water to soften it", "add iodine solution, positive result is blue-black"]}, {"t": "explain", "m": 3, "q": "Explain why the rate of photosynthesis of an aquatic plant increases as a lamp is brought closer, then levels off.", "ms": ["more light gives more energy for photosynthesis, so the rate rises", "at high light intensity another factor becomes limiting", "such as carbon dioxide concentration or temperature"]}, {"t": "explain", "m": 6, "q": "Describe how plants use the glucose produced in photosynthesis and explain why nitrate and magnesium ions are needed.", "ms": ["used in respiration to release energy", "converted to starch for storage", "converted to cellulose for cell walls", "converted to proteins or fats with nitrates", "nitrate provides nitrogen to make amino acids and proteins", "magnesium is needed to make chlorophyll, and without it leaves turn yellow"]}, {"t": "short", "m": 2, "q": "State two factors that limit the rate of photosynthesis.", "ms": ["light intensity", "carbon dioxide concentration or temperature"]}, {"t": "short", "m": 1, "q": "Name the pigment in chloroplasts that absorbs light.", "ms": ["chlorophyll"]}], "11": [{"t": "short", "m": 2, "q": "Name the two types of vessel in the vascular bundle and what each transports.", "ms": ["xylem transports water and mineral ions", "phloem transports sucrose and amino acids"]}, {"t": "explain", "m": 4, "q": "Explain how water moves from the soil to the leaves of a plant.", "ms": ["root hair cells absorb water by osmosis", "water passes up the xylem", "water evaporates from the mesophyll cells through the stomata (transpiration)", "this pulls a continuous column of water upwards by cohesion"]}, {"t": "explain", "m": 3, "q": "Explain why the rate of transpiration increases on a warm, windy day.", "ms": ["higher temperature gives more kinetic energy so faster evaporation", "wind removes water vapour from around the leaf", "this keeps a steep concentration gradient so diffusion is faster"]}, {"t": "calc", "m": 1, "q": "A potometer shows an air bubble moving 36 mm in 12 minutes. Calculate the mean rate of movement in mm per minute.", "ms": ["3 mm per minute"]}, {"t": "extended", "m": 6, "q": "Describe an experiment using a potometer to compare the transpiration rate in light and in shade, and how to make it reliable.", "ms": ["cut a shoot underwater and set up in the potometer without air bubbles", "record starting position of the bubble", "measure distance in a set time in each condition", "same shoot, temperature and humidity or wind", "calculate rate for each condition", "repeat and find the mean"]}, {"t": "short", "m": 2, "q": "State two functions of the xylem vessels.", "ms": ["transport water and minerals", "support the plant"]}, {"t": "short", "m": 1, "q": "Name the tiny pores in the leaf surface through which water vapour escapes.", "ms": ["stomata"]}], "12": [{"t": "short", "m": 2, "q": "State what is meant by phototropism.", "ms": ["growth of a plant shoot", "in response to the direction of light (towards)"]}, {"t": "explain", "m": 4, "q": "Explain how auxin makes a shoot grow towards light.", "ms": ["auxin is made in the tip and moves down", "auxin moves to the shaded side", "this causes more cell elongation on the shaded side", "the shoot bends towards the light"]}, {"t": "short", "m": 3, "q": "Describe the role of auxin in gravitropism of roots.", "ms": ["auxin collects on the lower side of the root", "it inhibits cell elongation in roots", "the upper side grows more so the root bends downwards"]}, {"t": "explain", "m": 3, "q": "Explain why plant hormones are called plant growth substances rather than hormones from glands.", "ms": ["they are made in tissues, such as the shoot tip, not in glands", "they move by diffusion or through the phloem", "they affect specific cells and are chemicals regulating growth"]}, {"t": "extended", "m": 6, "q": "Describe an investigation into the effect of light direction on shoot growth and explain the results.", "ms": ["use seedlings of the same species and age", "put one set in a box with light from one side and a control with light from above or no light", "use identical temperature and water", "measure shoot angle or length after several days", "shoots bend towards the light because auxin moves to the shaded side", "shoots with the tip removed show no ", "ms": ["the lowest possible temperature or 0 K or -273 degrees C"]}], "20": [{"t": "short", "m": 2, "q": "Describe the magnetic field around a bar magnet.", "ms": ["field lines run from north to south outside the magnet", "closer lines show a stronger field near the poles"]}, {"t": "explain", "m": 3, "q": "Explain how to make a stronger electromagnet.", "ms": ["more turns on the coil", "a larger current", "a soft iron core"]}, {"t": "short", "m": 3, "q": "State the rule that gives the direction of the force on a current-carrying wire in a magnetic field.", "ms": ["Fleming's left-hand rule", "first finger field, second finger current", "thumb gives motion or force"]}, {"t": "explain", "m": 3, "q": "Explain why soft iron is used for the core of an electromagnet and steel for permanent magnets.", "ms": ["soft iron is magnetised easily and loses magnetism easily so the magnet can be switched off", "steel keeps its magnetism", "so it is suitable as a permanent magnet"]}, {"t": "short", "m": 1, "q": "State what happens to the field of a bar magnet at its poles.", "ms": ["field lines are closest together (the field is strongest)"]}, {"t": "short", "m": 1, "q": "State the name of the effect when a current-carrying wire in a magnetic field experiences a force.", "ms": ["motor effect"]}], "21": [{"t": "short", "m": 2, "q": "State what is needed to induce a voltage in a wire.", "ms": ["relative movement between the wire and a magnetic field", "the wire cuts through the field lines"]}, {"t": "explain", "m": 4, "q": "Explain how a simple d.c. motor works.", "ms": ["a coil carrying current is in a magnetic field", "forces on opposite sides of the coil act in opposite directions", "this makes the coil turn", "a split-ring commutator reverses the current every half turn so it keeps turning in one direction"]}, {"t": "calc", "m": 1, "q": "A transformer has 200 turns on the primary and 50 on the secondary. The primary voltage is 240 V. Calculate the secondary voltage.", "ms": ["60 V"]}, {"t": "explain", "m": 3, "q": "Explain why electricity is transmitted at high voltage.", "ms": ["high voltage means lower current for the same power", "power loss = I squared x R so less energy is lost as heat", "transformers raise and lower voltage"]}, {"t": "calc", "m": 1, "q": "A transformer has 100 primary turns and 500 secondary turns with 12 V input. Calculate the output voltage.", "ms": ["60 V"]}, {"t": "short", "m": 1, "q": "State the type of transformer that has more turns on the secondary coil than the primary.", "ms": ["step-up"]}], "22": [{"t": "short", "m": 2, "q": "State the composition of an alpha particle and a beta particle.", "ms": ["alpha is two protons and two neutrons (helium nucleus)", "beta is a fast moving electron"]}, {"t": "explain", "m": 3, "q": "Compare the penetrating powers of alpha, beta and gamma radiation.", "ms": ["alpha is stopped by paper", "beta by a few mm of aluminium", "gamma needs thick lead or concrete to reduce it"]}, {"t": "calc", "m": 1, "q": "An atom of uranium-238 (92 protons) decays by alpha emission. State the number of protons and the mass number of the new nucleus.", "ms": ["90 protons and mass number 234"]}, {"t": "short", "m": 3, "q": "Describe the Rutherford scattering experiment results and what they showed.", "ms": ["most alpha particles went straight through", "a few were deflected by large angles", "showing a small, dense, positively charged nucleus"]}, {"t": "short", "m": 1, "q": "State the charge on a beta particle.", "ms": ["negative"]}, {"t": "short", "m": 1, "q": "State what happens to the atomic number when an atom emits an alpha particle.", "ms": ["decreases by 2"]}], "23": [{"t": "short", "m": 2, "q": "Define half-life.", "ms": ["time taken for half of the radioactive nuclei in a sample to decay", "or time for the activity to halve"]}, {"t": "calc", "m": 1, "q": "A sample has activity 800 Bq and a half-life of 6 hours. Calculate the activity after 18 hours.", "ms": ["100 Bq"]}, {"t": "explain", "m": 3, "q": "Explain why the count rate from a radioactive source falls over time but never exactly reaches zero.", "ms": ["decay is random", "each nucleus has a chance of decaying", "the number of undecayed nuclei halves each half-life but never reaches zero"]}, {"t": "explain", "m": 4, "q": "Explain how background radiation is allowed for in an experiment.", "ms": ["measure count rate without the source", "sources include rocks, cosmic rays and food", "subtract the background from the measured count", "gives the corrected count rate"]}, {"t": "calc", "m": 1, "q": "A radioactive sample has a half-life of 6 hours. State the fraction remaining after 18 hours.", "ms": ["one eighth (1/8)"]}, {"t": "short", "m": 1, "q": "State the unit used for the activity of a radioactive source.", "ms": ["becquerel (Bq)"]}], "24": [{"t": "short", "m": 2, "q": "State one use of radioactive tracers in medicine.", "ms": ["a gamma-emitting tracer is injected", "a detector follows its movement to find blockages or diagnose problems"]}, {"t": "explain", "m": 3, "q": "Explain why a source with a short half-life is used as a medical tracer.", "ms": ["it does not stay radioactive in the body for long", "reducing the dose received by the patient", "it emits gamma that can pass out of the body"]}, {"t": "explain", "m": 3, "q": "Describe how a smoke detector uses radioactivity.", "ms": ["an alpha source ionises the air so a small current flows", "smoke absorbs alpha particles reducing the current", "the alarm sounds"]}, {"t": "short", "m": 3, "q": "Give three safety precautions when handling radioactive sources.", "ms": ["use tongs and do not touch", "store in lead-lined containers", "limit the time of exposure and keep a distance"]}, {"t": "short", "m": 1, "q": "Name the type of radiation used to monitor the thickness of paper.", "ms": ["beta radiation"]}, {"t": "short", "m": 1, "q": "State why gamma sources are used to sterilise medical equipment.", "ms": ["they penetrate and kill bacteria"]}], "25": [{"t": "short", "m": 2, "q": "State the difference between nuclear fission and fusion.", "ms": ["fission splits a large nucleus into smaller ones", "fusion joins small nuclei to form a larger one"]}, {"t": "explain", "m": 4, "q": "Explain how a chain reaction occurs in a nuclear reactor.", "ms": ["a neutron splits a uranium-235 nucleus", "releasing energy and more neutrons", "the neutrons split further nuclei", "control rods absorb neutrons to control the rate"]}, {"t": "explain", "m": 3, "q": "Explain why fusion requires very high temperatures.", "ms": ["nuclei are positively charged so they repel", "high temperature gives high kinetic energy", "to overcome repulsion and get close enough to fuse"]}, {"t": "short", "m": 3, "q": "Give three disadvantages of nuclear fission power.", "ms": ["produces radioactive waste that stays dangerous for a long time", "risk of accidents", "high decommissioning costs"]}, {"t": "short", "m": 1, "q": "State what is meant by nuclear fusion.", "ms": ["two light nuclei join to form a heavier nucleus"]}, {"t": "short", "m": 1, "q": "Name the process that powers the Sun.", "ms": ["nuclear fusion"]}], "26": [{"t": "short", "m": 2, "q": "State what is meant by the Doppler effect or red-shift.", "ms": ["wavelength of light from a receding source is increased", "shifted to the red end of the spectrum"]}, {"t": "explain", "m": 3, "q": "Explain why a planet stays in orbit around the Sun.", "ms": ["gravitational force acts towards the Sun", "it provides the centripetal force", "the planet's speed keeps it moving in a circle rather than falling in"]}, {"t": "calc", "m": 1, "q": "The orbital radius of a planet is 1.5 x 10^11 m and its orbital time is 3.15 x 10^7 s. Calculate its speed.", "ms": ["about 3.0 x 10^4 m/s"]}, {"t": "short", "m": 3, "q": "Describe the main differences between a comet and a planet orbit.", "ms": ["comets have elliptical orbits", "speed changes: fastest near the Sun", "planets have nearly circular orbits"]}, {"t": "short", "m": 1, "q": "State how the orbital speed of a planet changes as its distance from the Sun increases.", "ms": ["it decreases"]}, {"t": "short", "m": 1, "q": "State what is meant by a light-year.", "ms": ["the distance light travels in one year"]}], "27": [{"t": "short", "m": 2, "q": "Describe the main stages in the life cycle of the Sun.", "ms": ["nebula forms a protostar", "main sequence star, then red giant", "white dwarf at the end"]}, {"t": "explain", "m": 4, "q": "Explain what keeps a star stable during the main sequence.", "ms": ["gravity pulls matter inwards", "fusion of hydrogen releases energy and pressure outwards", "forces balance", "the star is stable until hydrogen runs out"]}, {"t": "explain", "m": 3, "q": "Explain why massive stars end as supernovae.", "ms": ["they fuse heavier elements up to iron", "the core collapses and then explodes", "leaving a neutron star or black hole"]}, {"t": "short", "m": 3, "q": "State how elements heavier than hydrogen were formed.", "ms": ["fusion in stars forms elements up to iron", "heavier elements form in supernovae", "scattered into space and made into new stars and planets"]}, {"t": "short", "m": 1, "q": "Name the stage of a star's life during which hydrogen is fused into helium.", "ms": ["main sequence"]}, {"t": "short", "m": 1, "q": "Name the object formed from the collapsed core of a very massive star.", "ms": ["black hole (or neutron star)"]}], "28": [{"t": "short", "m": 2, "q": "State what the Big Bang theory says about the origin of the universe.", "ms": ["the universe began from a very small, hot, dense point", "it has been expanding ever since"]}, {"t": "explain", "m": 4, "q": "Explain how red-shift provides evidence for the Big Bang.", "ms": ["light from distant galaxies is shifted to longer wavelengths", "this shows the galaxies are moving away", "more distant galaxies have greater red-shift so move faster", "universe is expanding from a point"]}, {"t": "short", "m": 3, "q": "Explain how cosmic microwave background radiation supports the Big Bang.", "ms": ["radiation left from the early hot universe", "stretched into microwaves as space expanded", "found in all directions"]}, {"t": "calc", "m": 1, "q": "A galaxy is moving away at 3 x 10^6 m/s. Use Hubble's law with a constant of 2.2 x 10^-18 per second to find its distance.", "ms": ["3 x 10^6 / 2.2 x 10^-18 = 1.4 x 10^24 m"]}, {"t": "short", "m": 1, "q": "State what happens to the wavelength of light from a galaxy moving away from us.", "ms": ["it increases (red-shift)"]}, {"t": "short", "m": 1, "q": "State the approximate age of the Universe in billions of years.", "ms": ["about 13.8 billion years"]}]}, "chemistry": {"1": [{"t": "short", "m": 2, "q": "Describe the arrangement and movement of particles in a liquid.", "ms": ["particles are close together but not in a regular pattern", "they can slide past each other (move randomly)"]}, {"t": "explain", "m": 3, "q": "Explain, using the particle model, why a gas can be compressed but a solid cannot.", "ms": ["gas particles are far apart with large gaps", "pushing makes them move closer", "solid particles are already touching so cannot be pushed closer"]}, {"t": "short", "m": 1, "q": "A white ring forms closer to the HCl end of a tube when ammonia and hydrogen chloride gases are released at opposite ends. Explain why.", "ms": ["ammonia has a lower relative mass so it diffuses faster"]}, {"t": "extended", "m": 6, "q": "Describe how you would use chromatography to find out which dyes are in a sample of ink, and how you would identify them.", "ms": ["draw a pencil line near the bottom of the paper", "put spots of the ink and known dyes on the line", "place in a solvent below the line", "let the solvent rise, then remove before it reaches the top", "dyes separate by different solubility", "compare spots or calculate Rf values (distance moved by dye / distance by solvent) to identify"]}, {"t": "short", "m": 2, "q": "State two differences between the particles of a solid and of a gas.", "ms": ["particles in a solid are close together and in a gas are far apart", "solid particles vibrate in fixed positions and gas particles move randomly and fast"]}, {"t": "calc", "m": 1, "q": "State the name for the change of state from gas to liquid.", "ms": ["condensation"]}], "2": [{"t": "short", "m": 2, "q": "State the difference between a mixture and a compound.", "ms": ["a compound has elements chemically bonded in a fixed ratio", "a mixture can be separated by physical methods and has no fixed composition"]}, {"t": "explain", "m": 3, "q": "Explain how you would separate a mixture of sand, salt and water.", "ms": ["filter to remove the sand (residue)", "evaporate the water from the filtrate to leave salt", "or crystallise by heating until crystals form"]}, {"t": "short", "m": 3, "q": "Describe how fractional distillation separates a mixture of ethanol and water.", "ms": ["heat the mixture so the ethanol (lower boiling point 78 degrees) evaporates first", "vapour rises up the fractionating column and condenses", "collect the ethanol while water stays behind"]}, {"t": "extended", "m": 6, "q": "Explain how you would obtain pure water from salty water and how you would test that it is pure.", "ms": ["heat the salty water in a flask", "water boils and the steam passes into a condenser", "cooled water is collected as distillate", "salt is left in the flask", "test purity by boiling point of exactly 100 degrees at standard pressure", "or freezing point 0 degrees"]}, {"t": "short", "m": 2, "q": "State what is meant by an element and a compound.", "ms": ["an element contains only one type of atom", "a compound has two or more elements chemically bonded"]}, {"t": "short", "m": 1, "q": "Name the technique used to separate an insoluble solid from a liquid.", "ms": ["filtration"]}], "3": [{"t": "short", "m": 3, "q": "State the relative mass, relative charge and location of a proton, neutron and electron.", "ms": ["proton 1, +1, in the nucleus", "neutron 1, 0, in the nucleus", "electron very small (1/1840), -1, in shells around the nucleus"]}, {"t": "calc", "m": 1, "q": "Chlorine has two isotopes, 75 % of 35Cl and 25 % of 37Cl. Calculate the relative atomic mass.", "ms": ["35.5"]}, {"t": "explain", "m": 3, "q": "Explain why isotopes of an element have the same chemical properties.", "ms": ["isotopes have the same number of electrons", "they have the same number of protons", "chemical properties depend on the electrons, so they react the same way"]}, {"t": "short", "m": 3, "q": "An atom has 17 protons, 18 neutrons and 17 electrons. State its mass number and electronic configuration, and name the element.", "ms": ["mass number is 35", "electronic configuration 2,8,7", "chlorine"]}, {"t": "calc", "m": 1, "q": "An atom has 11 protons, 12 neutrons and 11 electrons. State its mass number.", "ms": ["23"]}, {"t": "short", "m": 1, "q": "State the electronic configuration of an atom of calcium (atomic number 20).", "ms": ["2,8,8,2"]}], "4": [{"t": "short", "m": 2, "q": "State why elements in the same group have similar chemical properties.", "ms": ["same number of electrons in their outer shell", "so they react in similar ways"]}, {"t": "explain", "m": 3, "q": "Describe the trend in reactivity of the Group 1 metals and explain it.", "ms": ["reactivity increases down the group", "outer electron is further from the nucleus", "less attraction so it is lost more easily"]}, {"t": "explain", "m": 3, "q": "Explain why the Group 0 elements are unreactive.", "ms": ["they have full outer shells of electrons", "so they do not need to gain, lose or share electrons", "they exist as single atoms"]}, {"t": "extended", "m": 6, "q": "Describe the properties of the transition metals and compare them with Group 1 metals.", "ms": ["transition metals have high melting points and densities", "they are harder and stronger", "they form coloured compounds", "they act as catalysts and form ions with different charges", "Group 1 metals are soft, with low melting points and low density", "Group 1 metals are much more reactive"]}, {"t": "short", "m": 2, "q": "State two properties of the alkali metals.", "ms": ["soft or low density or low melting point", "react with water to give alkaline solutions"]}, {"t": "short", "m": 1, "q": "State the number of electrons in the outer shell of a Group 7 element.", "ms": ["seven"]}], "5": [{"t": "short", "m": 2, "q": "State the formula of calcium hydroxide and magnesium chloride.", "ms": ["Ca(OH)2", "MgCl2"]}, {"t": "calc", "m": 1, "q": "Calculate the relative formula mass of calcium carbonate CaCO3 (Ca = 40, C = 12, O = 16).", "ms": ["100"]}, {"t": "explain", "m": 3, "q": "Balance the equation and add state symbols: Mg + HCl gives MgCl2 + H2.", "ms": ["Mg + 2HCl gives MgCl2 + H2", "states: Mg (s), HCl (aq), MgCl2 (aq), H2 (g)", "equation balanced with the same atoms on each side"]}, {"t": "calc", "m": 1, "q": "Calculate the mass of oxygen needed to burn 12 g of carbon. C + O2 gives CO2 (C = 12, O = 16).", "ms": ["32 g"]}, {"t": "calc", "m": 1, "q": "Calculate the relative formula mass of magnesium hydroxide Mg(OH)2. (Mg = 24, O = 16, H = 1)", "ms": ["58"]}, {"t": "short", "m": 1, "q": "State the formula of aluminium oxide.", "ms": ["Al2O3"]}], "6": [{"t": "calc", "m": 1, "q": "Calculate the number of moles in 11 g of carbon dioxide (C = 12, O = 16).", "ms": ["11 / 44 = 0.25 mol"]}, {"t": "calc", "m": 1, "q": "Calculate the concentration in g/dm3 of a solution containing 5.0 g of sodium hydroxide in 250 cm3.", "ms": ["20 g/dm3"]}, {"t": "calc", "m": 1, "q": "Calculate the percentage yield when 8.0 g of product is obtained and the theoretical yield was 10.0 g.", "ms": ["80 %"]}, {"t": "calc", "m": 1, "q": "Calculate the volume of hydrogen at room temperature and pressure produced from 0.10 mol of magnesium reacting with excess acid. (1 mol of gas is 24 dm3)", "ms": ["2.4 dm3"]}, {"t": "calc", "m": 1, "q": "Calculate the number of moles in 4.0 g of sodium hydroxide NaOH. (Na = 23, O = 16, H = 1)", "ms": ["0.10 mol"]}, {"t": "calc", "m": 1, "q": "Calculate the mass of 0.50 mol of carbon dioxide CO2. (C = 12, O = 16)", "ms": ["22 g"]}], "7": [{"t": "explain", "m": 3, "q": "Explain how sodium and chlorine atoms form sodium chloride.", "ms": ["sodium transfers one electron to chlorine", "sodium becomes Na+ and chlorine becomes Cl-", "opposite charges attract forming an ionic bond"]}, {"t": "short", "m": 3, "q": "Give three properties of ionic compounds and explain one of them.", "ms": ["high melting points", "soluble in water", "conduct when molten or dissolved but not when solid, because ions can move only in a liquid"]}, {"t": "explain", "m": 3, "q": "Explain why sodium chloride conducts electricity when molten but not when solid.", "ms": ["in a solid the ions are fixed in a lattice", "when molten the ions are free to move", "moving charged ions carry the current"]}, {"t": "short", "m": 2, "q": "State what is meant by an ionic bond.", "ms": ["the electrostatic attraction", "between oppositely charged ions"]}, {"t": "short", "m": 1, "q": "State the charge on the ion formed by a magnesium atom.", "ms": ["2+"]}], "8": [{"t": "short", "m": 2, "q": "State what is meant by a covalent bond.", "ms": ["a shared pair of electrons", "between two non-metal atoms"]}, {"t": "explain", "m": 4, "q": "Explain why simple molecular substances such as methane have low melting points.", "ms": ["methane has weak intermolecular forces between molecules", "little energy is needed to overcome them", "covalent bonds are not broken", "so melting point is low"]}, {"t": "explain", "m": 4, "q": "Explain why diamond is hard but graphite is soft and conducts electricity.", "ms": ["diamond: each carbon bonded to four others in a giant lattice with strong covalent bonds", "graphite: layers with three bonds per carbon", "layers slide because forces between layers are weak", "the fourth electron per atom is delocalised so can carry charge"]}, {"t": "short", "m": 3, "q": "Describe the structure and bonding in silicon dioxide and give one property.", "ms": ["giant covalent structure", "each silicon bonded to four oxygen atoms, each oxygen to two silicon", "very high melting point, hard or does not conduct"]}, {"t": "short", "m": 2, "q": "State the number of shared pairs of electrons in an oxygen molecule, O2.", "ms": ["two (a double bond)"]}, {"t": "short", "m": 1, "q": "State how many covalent bonds a nitrogen atom forms in ammonia.", "ms": ["three"]}], "9": [{"t": "short", "m": 2, "q": "Describe the structure of a metal.", "ms": ["a lattice of positive ions", "surrounded by a sea of delocalised electrons"]}, {"t": "explain", "m": 3, "q": "Explain why metals conduct electricity.", "ms": ["metals contain delocalised electrons", "these are free to move through the structure", "carrying charge as an electric current"]}, {"t": "explain", "m": 3, "q": "Explain why metals are malleable.", "ms": ["layers of positive ions can slide over each other", "the delocalised electrons keep the bonding", "so the shape changes without breaking"]}, {"t": "explain", "m": 4, "q": "Explain why alloys are harder than pure metals.", "ms": ["an alloy has atoms of different sizes", "this distorts the regular layers", "making it harder for layers to slide", "so the alloy is harder and stronger"]}, {"t": "short", "m": 2, "q": "Explain why metals are good conductors of heat.", "ms": ["delocalised electrons", "move through the structure carrying energy"]}, {"t": "short", "m": 1, "q": "State what is meant by an alloy.", "ms": ["a mixture of a metal with another element"]}], "10": [{"t": "short", "m": 2, "q": "State what is meant by electrolysis.", "ms": ["breaking down an ionic compound", "using an electric current when molten or in solution"]}, {"t": "explain", "m": 4, "q": "Predict and explain the products at each electrode when molten lead bromide is electrolysed.", "ms": ["at the cathode (negative) lead ions gain electrons", "lead is formed (reduction)", "at the anode (positive) bromide ions lose electrons", "bromine forms (oxidation)"]}, {"t": "explain", "m": 4, "q": "State the products at each electrode when concentrated sodium chloride solution is electrolysed and explain why.", "ms": ["hydrogen at the cathode, because sodium is more reactive than hydrogen", "chlorine at the anode", "sodium hydroxide solution is left", "halide ions are discharged in preference to hydroxide in concentrated solution"]}, {"t": "extended", "m": 6, "q": "Describe how you would electroplate a copper object with silver, including the electrolyte and electrodes.", "ms": ["the object is the cathode", "the anode is a piece of silver", "the electrolyte is silver nitrate solution", "connect to a direct current supply", "silver ions gain electrons at the cathode and silver coats the object", "the anode dissolves keeping the concentration constant"]}, {"t": "short", "m": 2, "q": "State the products at the anode and cathode when molten lead bromide is electrolysed.", "ms": ["bromine at the anode", "lead at the cathode"]}, {"t": "short", "m": 1, "q": "State why an ionic solid does not conduct electricity but its solution does.", "ms": ["ions are free to move in solution"]}], "11": [{"t": "short", "m": 3, "q": "State three physical properties of the alkali metals.", "ms": ["soft and easily cut", "low density (lithium, sodium and potassium float)", "low melting points", "shiny when freshly cut but tarnish quickly (any three)"]}, {"t": "explain", "m": 4, "q": "Describe what you would see when sodium reacts with water and write the equation.", "ms": ["sodium floats, fizzes and moves about and melts into a ball", "hydrogen is produced", "2Na + 2H2O gives 2NaOH + H2", "the solution turns universal indicator purple (alkaline)"]}, {"t": "explain", "m": 3, "q": "Explain why potassium is more reactive than lithium.", "ms": ["potassium has more electron shells", "the outer electron is further from the nucleus", "it is held less strongly (more shielding) so is lost function matches(s, c, q) {
  if (!q) return true;
  const d = DATA[s];
  return c.title.toLowerCase().includes(q) || String(c.n) === q ||
    d.specmap[c.n].some(id => { const l = id.toLowerCase(); return l === q || l.replace(d.only.toLowerCase(), "") === q || (q.length > 3 && d.spectxt[id].toLowerCase().includes(q)); });
}

function bestOf(s, n) {
  const b = BEST[`${s}-${n}`];
  if (b == null) return null;
  if (typeof b === "object") return b;
  const t = (QUIZ[s][n] || []).length ? Math.min(10, QUIZ[s][n].length) : 10;
  return {s: Math.min(b, t), t};
}
function bestBadge(s, n) {
  const b = bestOf(s, n);

  return `<span class="badge ${b.s === b.t ? "good" : ""}">Quiz best ${b.s}/${b.t}</span>`;
}

function mastery(s, n) {
  const ids = DATA[s].specmap[n], sp = specDone(s, n) / ids.length;

function toast(msg) { const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 3500); }

    const blob = await (await fetch(path)).blob();
    if (dl) {
      try { await dl.save({filename, data: blob}); return; }
      catch (e) { if (e && e.code === "declined") return; if (e && e.code === "rate_limited") { toast("A download is already waiting for you to confirm."); return; } }
    }

}

const GENS = {

        () => { const n = rnd(2, 9) * 10; return mk(`A length is ${n} cm to the nearest 10 cm. What is the upper bound in cm?`, n + 5, [n + 10, n + 1, n - 5], `half the rounding unit is 5, so ${n} + 5`); }],

    3: [() => { const a = rnd(2, 5), m = rnd(2, 6), n = rnd(2, 6); return mk(`Simplify ${a}^${m} × ${a}^${n}. What is the index of ${a} in the answer?`, m + n, [m * n, Math.abs(m - n), m + n + 1], `add the indices: ${m} + ${n}`); },
        () => { const b = rnd(2, 5); return mk(`Work out ${b}⁻².`, 1 / (b * b), [-b * b, -2 * b, b * b], `a negative power means reciprocal: 1/${b}² = 1/${b * b}`); },
        () => { const a = rnd(2, 9), e = rnd(2, 6); return mk(`What is ${a * 1000} × 10^${e} in standard form? Give the power of 10.`, e + 3, [e, e + 4, e + 1], `${a * 1000} = ${a} × 10³, so the power is ${e} + 3`); },

    4: [() => { const a = rnd(2, 6), b = rnd(1, 9), x = rnd(2, 6); return mk(`Work out the value of ${a}x² + ${b} when x = ${x}.`, a * x * x + b, [(a * x) * (a * x) + b, a * x * 2 + b, a * x * x - b], `square first: ${x}² = ${x * x}, then × ${a}, then + ${b}`); },
        () => { const p = rnd(1, 6), q = rnd(1, 6); return mk(`Expand and simplify (x + ${p})(x + ${q}). What is the coefficient of x?`, p + q, [p * q, p - q, 2 * (p + q)], `x² + ${p + q}x + ${p * q}`); },
        () => { const p = rnd(1, 6), q = rnd(1, 6); return mk(`x² + ${p + q}x + ${p * q} factorises to (x + a)(x + b). What is a + b?`, p + q, [p * q, p - q, p + q + 1], `the numbers add to ${p + q} and multiply to ${p * q}`); },
        () => { const a = rnd(2, 6), b = rnd(1, 9); return mk(`Make x the subject of y = ${a}x + ${b}. What is x when y = ${a * 3 + b}?`, 3, [a * 3, 3 + b, a], `x = (y − ${b}) ÷ ${a}`); }],
    5: [() => { const a = rnd(2, 7), x = rnd(2, 9), b = rnd(1, 12); return mk(`Solve ${a}x + ${b} = ${a * x + b}.`, x, [x + 1, x - 1, (a * x + b) / a], `subtract ${b}, then divide by ${a}`); },
        () => { const a = rnd(2, 5), b = rnd(2, 5), x = rnd(2, 8), c = rnd(1, 9); return mk(`Solve ${a + b}x + ${c} = ${b}x + ${a * x + c}.`, x, [x + 1, x - 1, a * x], `collect x terms: ${a}x = ${a * x}`); },
        () => { const a = rnd(2, 5), x = rnd(3, 9), b = rnd(1, 6); return mk(`Solve ${a}(x − ${b}) = ${a * (x - b)}.`, x, [x - b, x + b, a * x], `divide by ${a}, then add ${b}`); }],
    6: [() => { const m = rnd(1, 6), c = rnd(1, 9), x1 = rnd(0, 3), x2 = x1 + rnd(1, 4); return mk(`A straight line passes through (${x1}, ${m * x1 + c}) and (${x2}, ${m * x2 + c}). What is its gradient?`, m, [m + 1, 1 / m, c], `rise ÷ run = ${m * (x2 - x1)} ÷ ${x2 - x1}`); },
        () => { const m = rnd(2, 6); return mk(`A line is perpendicular to y = ${m}x + 1. What is its gradient?`, -1 / m, [m, -m, 1 / m], `perpendicular gradients multiply to −1`); },
        () => { const a = rnd(1, 5), b = rnd(1, 5), c = rnd(6, 9), d = rnd(6, 9); return mk(`What is the midpoint of (${a}, ${b}) and (${c + (c - a) % 2}, ${d + (d - b) % 2})? Give the x-coordinate.`, (a + c + (c - a) % 2) / 2, [a + c, c - a, (c - a) / 2], `average the x values`); }],
    7: [() => { const x = rnd(1, 6), y = rnd(1, 6); return mk(`x + y = ${x + y} and x − y = ${x - y}. What is the value of x?`, x, [y, x + y, x - y], `add the equations: 2x = ${2 * x}`); },
        () => { const x = rnd(1, 6), y = rnd(1, 6), a = rnd(2, 4); return mk(`${a}x + y = ${a * x + y} and x + y = ${x + y}. What is x?`, x, [y, x + y, a * x], `subtract the equations: ${a - 1}x = ${(a - 1) * x}`); }],
    8: [() => { const a = rnd(2, 6), b = rnd(1, 9), x = rnd(2, 8); return mk(`Solve ${a}x + ${b} < ${a * x + b}. What must x be less than?`, x, [x + 1, -x, a * x], `subtract ${b}, divide by ${a}`); },
        () => { const a = rnd(-3, 0), b = a + rnd(3, 6); return mk(`How many integers satisfy ${a} < n ≤ ${b}?`, b - a, [b - a + 1, b - a - 1, b], `from ${a + 1} up to ${b} included`); },
        () => { const a = rnd(2, 5), c = rnd(2, 8); return mk(`Solve −${a}x > ${a * c}. What is x less than?`, -c, [c, -c - 1, a * c], `dividing by −${a} flips the sign`); }],
    9: [() => { const a = rnd(2, 9), d = rnd(2, 6), n = rnd(8, 15); return mk(`The nth term is ${d}n + ${a}. What is the ${n}th term?`, d * n + a, [d * n, d + n + a, (d + a) * n], `${d} × ${n} + ${a}`); },
        () => { const a = rnd(2, 9), d = rnd(2, 6); return mk(`Find the nth term coefficient of n in the sequence ${a}, ${a + d}, ${a + 2 * d}, ${a + 3 * d}.`, d, [a, a + d, a - d], `the common difference is ${d}`); },
        () => { const a = rnd(2, 9), d = rnd(2, 5), n = 10; return mk(`Find the sum of the first 10 terms of the sequence starting at ${a} with common difference ${d}.`, n / 2 * (2 * a + 9 * d), [n * (a + 9 * d), n / 2 * (a + 9 * d), n / 2 * (2 * a + 10 * d)], `S = n/2 × (2a + (n − 1)d)`); }],
    10: [() => { const v = rnd(2, 9) * 10, t = rnd(2, 6); return mk(`A distance-time graph rises ${v * t} km in ${t} hours. What is the speed in km/h?`, v, [v * t, t, v * t * t], `speed = gradient = ${v * t} ÷ ${t}`); },
        () => { const r = rnd(2, 6), t = rnd(3, 9); return mk(`Water fills a cylinder at ${r} cm of depth per minute. What is the depth after ${t} minutes?`, r * t, [r + t, t / r, r * t * 2], `${r} × ${t}`); }],
    11: [() => { const n = rnd(5, 12); return mk(`What is the sum of the interior angles of a polygon with ${n} sides?`, 180 * (n - 2), [180 * n, 360, 180 * (n - 1)], `180 × (${n} − 2)`); },
         () => { const n = [5, 6, 8, 9, 10, 12][rnd(0, 5)]; return mk(`What is each exterior angle of a regular polygon with ${n} sides?`, 360 / n, [180 / n, 180 - 360 / n, 360 * n], `360 ÷ ${n}`); },
         () => { const a = rnd(4, 12), b = rnd(14, 24), h = rnd(3, 9); return mk(`A trapezium has parallel sides ${a} cm and ${b} cm and height ${h} cm. What is its area in cm²?`, (a + b) * h / 2, [a * b * h, (a + b) * h, a * h + b], `½ × (${a} + ${b}) × ${h}`); }],
    12: [() => { const r = rnd(2, 12); return mk(`A circle has radius ${r} cm. What is its area in cm², to 1 decimal place? (Use π on your calculator.)`, (Math.PI * r * r).toFixed(1), [(2 * Math.PI * r).toFixed(1), (Math.PI * r).toFixed(1), (Math.PI * r * r * 2).toFixed(1)], `A = πr² = π × ${r}²`); },
         () => { const r = rnd(2, 9), h = rnd(3, 12); return mk(`A cylinder has radius ${r} cm and height ${h} cm. What is its volume in cm³ to the nearest whole number?`, Math.round(Math.PI * r * r * h), [Math.round(2 * Math.PI * r * h), Math.round(Math.PI * r * h), Math.round(Math.PI * r * r)], `πr²h`); },
         () => { const a = [60, 90, 120, 180][rnd(0, 3)], r = rnd(3, 9); return mk(`A sector has angle ${a}° and radius ${r} cm. What is its area in cm² to 1 d.p.?`, (a / 360 * Math.PI * r * r).toFixed(1), [(a / 360 * 2 * Math.PI * r).toFixed(1), (Math.PI * r * r).toFixed(1), (a / 180 * Math.PI * r * r).toFixed(1)], `${a}/360 of πr²`); }],
    13: [() => { const b = rnd(2, 17) * 10; return mk(`The bearing of B from A is ${b}°. What is the bearing of A from B?`, b < 180 ? b + 180 : b - 180, [b, 360 - b, b + 90], `back bearing: add or subtract 180°`); },
         () => { const a = rnd(2, 8) * 10; return mk(`In an isosceles triangle the apex angle is ${a}°. What is each base angle?`, (180 - a) / 2, [180 - a, a / 2, 90 - a], `(180 − ${a}) ÷ 2`); }],
    14: [() => { const k = rnd(2, 5); return mk(`Two similar shapes have lengths in the ratio 1 : ${k}. What is the ratio of their areas as 1 : ?`, k * k, [k, k * k * k, 2 * k], `area scale factor = ${k}²`); },
         () => { const k = rnd(2, 4), v = rnd(2, 9); return mk(`A solid has volume ${v} cm³. It is enlarged by scale factor ${k}. What is the new volume in cm³?`, v * k * k * k, [v * k, v * k * k, v + k * k * k], `volume scales by ${k}³`); },
         () => { const x = rnd(1, 6), y = rnd(1, 6), k = rnd(2, 4); return mk(`The point (${x}, ${y}) is enlarged by scale factor ${k} from the origin. What is the new x-coordinate?`, x * k, [x + k, x / k, y * k], `multiply by ${k}`); }],
    15: [() => { const t = [[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17], [9, 12, 15]][rnd(0, 4)]; return mk(`A right-angled triangle has shorter sides ${t[0]} cm and ${t[1]} cm. How long is the hypotenuse in cm?`, t[2], [t[0] + t[1], t[1] - t[0], t[2] + 1], `${t[0]}² + ${t[1]}² = ${t[2] * t[2]}, so √ = ${t[2]}`); },
         () => { const t = [[3, 4, 5], [5, 12, 13], [6, 8, 10], [8, 15, 17], [9, 12, 15]][rnd(0, 4)]; return mk(`The hypotenuse of a right-angled triangle is ${t[2]} cm and one side is ${t[0]} cm. How long is the other side in cm?`, t[1], [t[2] - t[0], t[2] + t[0], t[0] + 1], `${t[2]}² − ${t[0]}² = ${t[1] * t[1]}`); }],
    16: [() => { const h = rnd(4, 20); return mk(`In a right-angled triangle the hypotenuse is ${h} cm and an angle is 30°. What is the opposite side in cm?`, h / 2, [h * 2, h, h * 0.866], `sin 30° = 0.5, so opposite = 0.5 × ${h}`); },
         () => { const a = rnd(3, 12); return mk(`In a right-angled triangle tan θ = opposite ÷ adjacent. The adjacent side is ${a} cm and θ = 45°. What is the opposite side in cm?`, a, [a * 2, a / 2, a * 1.5], `tan 45° = 1`); },

    17: [() => { const a = rnd(3, 17) * 10; return mk(`The angle at the centre of a circle is ${a * 2}°. What is the angle at the circumference on the same arc?`, a, [a * 2, a * 4, 180 - a], `the angle at the centre is twice the angle at the circumference`); },

         () => { const a = rnd(2, 6), b = rnd(2, 9), c = rnd(2, 6); return mk(`Two chords cross. One is split into ${a} and ${b}. The other is split into ${c} and x. Find x to 1 d.p.`, (a * b / c).toFixed(1), [(a * b * c).toFixed(1), (a + b - c).toFixed(1), (a * c / b).toFixed(1)], `${a} × ${b} = ${c} × x`); }],
    18: [() => { const a = rnd(10, 20), b = rnd(8, 15), c = rnd(3, 7), n = a + b - c + rnd(2, 6); return mk(`In a class of ${n}, ${a} play football and ${b} play tennis; ${c} play both. How many play neither?`, n - (a + b - c), [n - a - b, c, n - a], `${a} + ${b} − ${c} play at least one sport`); },
         () => { const n = rnd(3, 8); return mk(`A = {1, 2, 3, ..., ${n}}. How many elements are in A?`, n, [n - 1, n + 1, n * 2], `count the elements`); }],
    19: [() => { const a = rnd(2, 9), b = rnd(10, 19), c = rnd(20, 29); return mk(`What is the mean of ${a}, ${b} and ${c}? Give it to 1 decimal place.`, ((a + b + c) / 3).toFixed(1), [b.toFixed(1), ((a + c) / 2).toFixed(1), ((a + b + c) / 4).toFixed(1)], `add them: ${a + b + c}, then ÷ 3`); },
         () => { const f = rnd(10, 40), w = [5, 10, 20][rnd(0, 2)]; return mk(`A histogram class has frequency ${f * w} and class width ${w}. What is its frequency density?`, f, [f * w * w, f + w, w], `frequency ÷ class width`); },
         () => { const q1 = rnd(3, 9), q3 = q1 + rnd(4, 12); return mk(`The lower quartile is ${q1} and the upper quartile is ${q3}. What is the interquartile range?`, q3 - q1, [q3 + q1, (q3 + q1) / 2, q3], `Q3 − Q1`); }],
    20: [() => { const r = rnd(2, 9), b = rnd(2, 9); return mk(`A bag has ${r} red and ${b} blue counters. One is picked at random. What is P(red) as a decimal to 2 d.p.?`, (r / (r + b)).toFixed(2), [(b / (r + b)).toFixed(2), (r / b).toFixed(2), (1 / (r + b)).toFixed(2)], `red ÷ total = ${r}/${r + b}`); },
         () => { const a = rnd(1, 4) / 10, b = rnd(1, 4) / 10; return mk(`Two independent events have P(A) = ${a} and P(B) = ${b}. What is P(A and B)?`, (a * b).toFixed(2), [(a + b).toFixed(2), (a * 2).toFixed(2), (1 - a * b).toFixed(2)], `multiply: ${a} × ${b}`); },
         () => { const r = rnd(2, 5), b = rnd(3, 6); return mk(`A bag has ${r} red and ${b} blue counters. Two are taken without replacement. What is P(both red) as a decimal to 3 d.p.?`, (r / (r + b) * (r - 1) / (r + b - 1)).toFixed(3), [(r / (r + b) * r / (r + b)).toFixed(3), (r / (r + b)).toFixed(3), ((r - 1) / (r + b - 1)).toFixed(3)], `${r}/${r + b} × ${r - 1}/${r + b - 1}`); }],
    21: [() => { const k = rnd(2, 9), x = rnd(2, 8); return mk(`y is directly proportional to x, and y = ${k * x} when x = ${x}. What is y when x = ${x + 3}?`, k * (x + 3), [k * x + 3, k * x, (k * x) / (x + 3)], `k = ${k}, so y = ${k} × ${x + 3}`); },

    22: [() => { const p = rnd(1, 5), q = rnd(1, 5); return mk(`Solve x² − ${p + q}x + ${p * q} = 0. What is the larger solution?`, Math.max(p, q), [-Math.max(p, q), p + q, p * q], `(x − ${p})(x − ${q}) = 0`); },
         () => { const a = rnd(1, 4), c = -rnd(1, 4); const b = rnd(2, 6); const d = (-b + Math.sqrt(b * b - 4 * a * c)) / (2 * a); return mk(`Use the formula to solve ${a}x² + ${b}x − ${-c} = 0. What is the positive solution to 2 d.p.?`, d.toFixed(2), [((-b - Math.sqrt(b * b - 4 * a * c)) / (2 * a)).toFixed(2), (b / (2 * a)).toFixed(2), Math.sqrt(b * b - 4 * a * c).toFixed(2)], `x = (−b ± √(b² − 4ac)) ÷ 2a`); },

    23: [() => { const a = [2, 3, 5, 6, 7][rnd(0, 4)], s = rnd(2, 5); return mk(`Simplify √${s * s * a}. Write the number outside the root.`, s, [s * s, a, s * 2], `√${s * s * a} = ${s}√${a}`); },
         () => { const a = rnd(2, 6), s = [2, 3, 5][rnd(0, 2)]; return mk(`Rationalise ${a * s}/√${s * s}. What is it?`, a, [a * s * s, s, a * s], `√${s * s} = ${s}`); }],
    24: [() => { const a = rnd(2, 6), b = rnd(1, 9), x = rnd(2, 8); return mk(`f(x) = ${a}x + ${b}. Find f(${x}).`, a * x + b, [a + x + b, a * (x + b), a * x - b], `${a} × ${x} + ${b}`); },

         () => { const a = rnd(2, 5), b = rnd(1, 9); return mk(`f(x) = ${a}x + ${b}. What is f⁻¹(${a * 4 + b})?`, 4, [a * 4, 4 + b, (a * 4 + b) * a], `f⁻¹(x) = (x − ${b}) ÷ ${a}`); }],
    25: [() => { const a = rnd(5, 12); return mk(`In a triangle A = 30°, B = 90° − 30° and a = ${a}. By the sine rule b/sin B = a/sin A. What is b to 1 d.p.?`, (a * Math.sin(Math.PI / 3) / Math.sin(Math.PI / 6)).toFixed(1), [(a * 0.5).toFixed(1), (a * 2).toFixed(1), a.toFixed(1)], `b = ${a} × sin 60° ÷ sin 30°`); },
         () => { const a = rnd(4, 9), b = rnd(4, 9); return mk(`A triangle has sides ${a} cm and ${b} cm with an angle of 30° between them. What is its area in cm² to 1 d.p.?`, (0.5 * a * b * 0.5).toFixed(1), [(a * b * 0.5).toFixed(1), (0.5 * a * b).toFixed(1), (0.5 * a * b * 0.866).toFixed(1)], `½ab sin C = ½ × ${a} × ${b} × 0.5`); }],
    26: [() => { const k = rnd(1, 6); return mk(`y = f(x) is translated to y = f(x) + ${k}. How many units up does it move?`, k, [-k, k * 2, 0], `adding outside the bracket moves it up`); },

    27: [() => { const a = rnd(1, 6), b = rnd(1, 6), c = rnd(1, 6), d = rnd(1, 6); return mk(`a = (${a}, ${b}) and b = (${c}, ${d}). What is the x-component of a + b?`, a + c, [a - c, a * c, b + d], `add the top numbers`); },

    28: [() => { const a = rnd(2, 6), n = rnd(2, 5); return mk(`Differentiate y = ${a}x^${n}. What is the coefficient of x^${n - 1} in dy/dx?`, a * n, [a, a + n, n], `multiply by the power: ${a} × ${n}`); },
         () => { const a = rnd(1, 4), b = rnd(2, 8) * a; return mk(`y = x² − ${2 * b}x + 5. At which x is the gradient zero?`, b, [2 * b, -b, b / 2], `dy/dx = 2x − ${2 * b} = 0`); },
         () => { const a = rnd(2, 5), t = rnd(2, 5); return mk(`s = ${a}t². Find the velocity when t = ${t}.`, 2 * a * t, [a * t * t, a * t, 2 * a], `v = ds/dt = ${2 * a}t`); }]

  biology: {
