<style>
/* Layout: soft, rounded study app. Sticky subject pills on top; home = blob hero + three subject cards;
   a subject = unit bands of rounded chapter cards; a reader panel opens a pack, deck, spec list or quiz in-page */
:root {
  --bg: #F5F3FF; --panel: #FFFFFF; --ink: #1E1B3A; --muted: #6B6788; --line: #E7E4F5; --soft: #F0EEFA;
  --accent: #6D5DD3; --ok: #12A150; --bad: #E5484D; --on-c: #FFFFFF;
  --shadow: 0 2px 4px rgba(40, 30, 110, .04), 0 10px 30px rgba(40, 30, 110, .08);
  --shadow-hi: 0 4px 8px rgba(40, 30, 110, .06), 0 18px 40px rgba(40, 30, 110, .14);
  --r-lg: 28px; --r-md: 20px; --r-sm: 14px;
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  --biology: #0F8A5F; --biology-u1: #0F8A5F; --biology-u2: #C0392B; --biology-u3: #2E8B2E; --biology-u4: #1E7FB8; --biology-u5: #7B3FB0; --biology-u6: #B4580C; --chemistry: #0E7490; --chemistry-u1: #1D4ED8; --chemistry-u2: #C2410C; --chemistry-u3: #0F766E; --chemistry-u4: #7E22CE; --physics: #1D4ED8; --physics-u1: #1D4ED8; --physics-u2: #B45309; --physics-u3: #0F766E; --physics-u4: #C2410C; --physics-u5: #475569; --physics-u6: #B91C1C; --physics-u7: #15803D; --physics-u8: #6D28D9; --maths: #D9480F; --maths-u1: #D9480F; --maths-u2: #C2255C; --maths-u3: #7048E8; --maths-u4: #1C7ED6; --maths-u5: #2B8A3E; --maths-u6: #E67700; --humanbio: #C2255C; --humanbio-u1: #C2255C; --humanbio-u2: #E8590C; --humanbio-u3: #1C7ED6; --humanbio-u4: #2B8A3E; --cs: #7048E8; --cs-u1: #7048E8; --cs-u2: #E8590C; --cs-u3: #1C7ED6; --cs-u4: #2B8A3E; --cs-u5: #C2255C; --cs-u6: #0E8FB0; --geography: #2B8A3E; --geography-u1: #1C7ED6; --geography-u2: #E8590C; --geography-u3: #2B8A3E;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #13111F; --panel: #1D1A2E; --ink: #EEEBFF; --muted: #A7A2C7; --line: #2E2A47; --soft: #262240;
  --accent: #A99BFF; --ok: #3DD68C; --bad: #FF6B6F; --on-c: #15122A;
  --shadow: 0 2px 4px rgba(0,0,0,.25), 0 10px 30px rgba(0,0,0,.3);
  --shadow-hi: 0 4px 8px rgba(0,0,0,.3), 0 18px 40px rgba(0,0,0,.45);
  --biology: #5FD3A2; --biology-u1: #5FD3A2; --biology-u2: #F38B7E; --biology-u3: #86D07A; --biology-u4: #6CB8F0; --biology-u5: #C39BEA; --biology-u6: #F2AE5A; --chemistry: #67D7EA; --chemistry-u1: #7FB0FF; --chemistry-u2: #F9A26C; --chemistry-u3: #5FD3C4; --chemistry-u4: #CFA0F5; --physics: #6EA8FE; --physics-u1: #6EA8FE; --physics-u2: #F0B35A; --physics-u3: #4FD1C5; --physics-u4: #FB8B4B; --physics-u5: #A3B1C6; --physics-u6: #F87171; --physics-u7: #6EE7A0; --physics-u8: #B9A2F7; --maths: #FF9F6B; --maths-u1: #FF9F6B; --maths-u2: #F783AC; --maths-u3: #B197FC; --maths-u4: #74C0FC; --maths-u5: #8CE99A; --maths-u6: #FFC078; --humanbio: #FF8FB1; --humanbio-u1: #FF8FB1; --humanbio-u2: #FFA94D; --humanbio-u3: #74C0FC; --humanbio-u4: #8CE99A; --cs: #B197FC; --cs-u1: #B197FC; --cs-u2: #FFA94D; --cs-u3: #74C0FC; --cs-u4: #8CE99A; --cs-u5: #FF8FB1; --cs-u6: #66D9E8; --geography: #8CE99A; --geography-u1: #74C0FC; --geography-u2: #FFA94D; --geography-u3: #8CE99A;
  color-scheme: dark } }
* { box-sizing: border-box; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 80px); -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; font-weight: 600;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(56px + env(safe-area-inset-bottom, 0px)); overflow-x: hidden; }
h1, h2, h3, p { overflow-wrap: anywhere; }
img { max-width: 100%; }
[hidden] { display: none !important; }
a { color: inherit; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; min-width: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- top bar ---------- */
.switcher { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; margin: 0 -16px; padding: 12px 16px;
  background: color-mix(in srgb, var(--bg) 85%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.switcher .in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; }
.switcher .in::-webkit-scrollbar { display: none; }
@media (min-width: 700px) { .switcher .in { flex-wrap: wrap; overflow: visible; } }
.logo { font: 900 18px var(--font); margin-right: 6px; white-space: nowrap; color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 9px; flex: none; }
.logo b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 12px 16px 12px 16px; color: #fff; font-size: 17px;
  background: linear-gradient(135deg, var(--biology), var(--chemistry) 50%, var(--physics)); box-shadow: var(--shadow); }
.tab { font: 800 15px var(--font); text-decoration: none; color: var(--ink); padding: 9px 16px; border-radius: 999px; background: var(--panel);
  box-shadow: var(--shadow); white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; flex: none; }
.tab i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.tab[aria-current="page"] { background: var(--c, var(--ink)); color: var(--on-c); }
.tab[aria-current="page"] i { background: var(--on-c); }
@media (max-width: 520px) { .logo span { display: none; } .tab { padding: 8px 13px; font-size: 14px; } }

/* ---------- header ---------- */
.hero { position: relative; overflow: hidden; border-radius: var(--r-lg); padding: clamp(22px, 4vw, 40px); color: var(--on-c);
  background: var(--hero-bg, linear-gradient(135deg, #6D5DD3, #9A6DE0)); box-shadow: var(--shadow-hi); isolation: isolate; }
.hero .blob { position: absolute; z-index: -1; border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; background: rgba(255,255,255,.14); }
.hero .b1 { width: 260px; height: 240px; right: -60px; top: -80px; }
.hero .b2 { width: 180px; height: 170px; right: 120px; bottom: -110px; border-radius: 63% 37% 54% 46% / 55% 48% 52% 45%; background: rgba(255,255,255,.10); }
.hero .b3 { width: 90px; height: 90px; right: 40px; bottom: 30px; border-radius: 50%; background: rgba(255,255,255,.12); }
.hero h1 { font: 900 clamp(28px, 5vw, 46px)/1.1 var(--font); margin: 0; letter-spacing: -0.5px; max-width: 18ch; text-wrap: balance; }
.hero p { margin: 10px 0 0; max-width: 58ch; font-size: clamp(15px, 2vw, 17px); opacity: .95; font-weight: 600; }
.hero .row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; align-items: center; }
.search { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.95); color: #1E1B3A; border-radius: 999px; padding: 11px 18px;
  min-width: 0; flex: 1 1 260px; max-width: 460px; box-shadow: 0 6px 20px rgba(0,0,0,.12); }
.search input { border: 0; outline: none; background: transparent; color: #1E1B3A; font: 700 15px var(--font); width: 100%; min-width: 0; }
.search input::placeholder { color: #7A7598; }
.hbtn { font: 800 15px var(--font); color: var(--hero-ink, #4B3DB8); background: var(--on-c); border-radius: 999px; padding: 11px 18px; text-decoration: none;
  white-space: nowrap; box-shadow: 0 6px 20px rgba(0,0,0,.12); display: inline-flex; gap: 8px; align-items: center; }
.hbtn.ghost { background: color-mix(in srgb, var(--on-c) 18%, transparent); color: var(--on-c); box-shadow: none; }

/* ---------- unit chips ---------- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { font: 800 14px var(--font); border: 0; background: var(--panel); color: var(--ink); padding: 8px 14px; border-radius: 18px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); max-width: 100%; text-align: left; }
.chip span { min-width: 0; overflow-wrap: anywhere; }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.chip[aria-pressed="true"] { background: var(--c, var(--ink)); color: var(--on-c); }
.chip[aria-pressed="true"] i { background: var(--on-c); }
.chip:focus-visible, .btn:focus-visible, .tab:focus-visible, .opt:focus-visible, .hbtn:focus-visible, .search:focus-within { outline: 3px solid var(--accent); outline-offset: 3px; }

/* ---------- home subject cards ---------- */
.subjects { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 20px; }
.scard.soon { background: transparent; border: 3px dashed var(--line, #cfc9ee); box-shadow: none; align-items: center; justify-content: center; min-height: 260px; text-align: center; }
.scard.soon .soonin { padding: 28px; } .scard.soon .em { font-size: 54px; display: block; margin-bottom: 8px; } .scard.soon h2 { margin: 0 0 6px; font-size: 22px; } .scard.soon p { margin: 0; color: var(--muted, #6a6590); font-weight: 700; }

#chooser { position: fixed; inset: 0; z-index: 100; background: rgba(30,20,70,.55); display: grid; place-items: center; padding: 16px; backdrop-filter: blur(4px); }
.chbox { background: var(--panel, #fff); border-radius: 24px; padding: 26px; max-width: 560px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-height: 92vh; overflow: auto; }
.chbox h2 { margin: 0 0 6px; font: 900 26px var(--font); } .chbox p { margin: 0 0 16px; color: var(--muted, #666); font-weight: 600; }
.chgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.chopt { display: flex; align-items: center; gap: 10px; padding: 13px 15px; border-radius: 16px; border: 2px solid color-mix(in srgb, var(--c) 30%, transparent); cursor: pointer; font: 800 16px var(--font); }
.chopt:has(input:checked) { background: var(--c); color: #fff; border-color: var(--c); } .chopt input { accent-color: #fff; width: 18px; height: 18px; }
.chfoot { display: flex; align-items: center; gap: 10px; margin-top: 18px; } .chfoot #chmsg { flex: 1; color: #c92a2a; font-weight: 700; font-size: 14px; }
.chfoot button { font: 800 15px var(--font); border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer; background: #eee; }
.chfoot #chsave { background: var(--accent, #6D5DD3); color: #fff; }
.cbtns { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.navdiv { width: 2px; align-self: stretch; min-height: 26px; margin: 0 8px; border-radius: 2px; background: color-mix(in srgb, var(--ink, #1b1740) 18%, transparent); }
.tab.nav.acc { border: 2px dashed color-mix(in srgb, var(--accent) 55%, transparent); background: transparent; }
.tab.nav.who { background: transparent; box-shadow: none; cursor: default; }
.tab.nav.out { background: #FFE3E3; color: #C92A2A; }
.navsp { flex: 1; min-width: 8px; } .tab.nav { border: 0; cursor: pointer; white-space: nowrap; flex: none; }
.faq { max-width: 760px; margin: 0 auto; display: grid; gap: 10px; }
.faq details { background: var(--panel); border-radius: 16px; padding: 14px 18px; box-shadow: var(--shadow); }
.faq summary { font: 900 16px var(--font); cursor: pointer; } .faq details p { margin: 10px 0 0; color: var(--muted, #6a6590); font-weight: 700; }
.faq .contact { text-align: center; padding: 22px 10px; } .faq .contact h3 { margin: 0 0 10px; }
.scard { background: var(--panel); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow); min-width: 0; }
.scard .top { background: var(--c); color: var(--on-c); padding: 22px 22px 26px; position: relative; overflow: hidden; isolation: isolate; }
.scard .top .blob { position: absolute; z-index: -1; right: -40px; top: -50px; width: 190px; height: 180px; background: rgba(255,255,255,.16);
  border-radius: 42% 58% 63% 37% / 41% 44% 56% 59%; }
.scard .top .em { position: absolute; right: 18px; top: 16px; font-size: 54px; line-height: 1; z-index: -1; }
.scard .top .code { font: 800 13px var(--font); letter-spacing: 1.5px; opacity: .9; }
.scard .top h2 { font: 900 32px/1.1 var(--font); margin: 4px 0 4px; }
.scard .top p { margin: 0; opacity: .95; font-size: 15px; max-width: 26ch; }
.scard .body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; margin-top: -14px; background: var(--panel);
  border-radius: var(--r-lg) var(--r-lg) 0 0; position: relative; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stats div { background: var(--soft); border-radius: var(--r-sm); padding: 8px 6px; text-align: center; min-width: 0; }
.stats b { display: block; font: 900 20px var(--font); color: var(--c); }
.stats span { color: var(--muted); font-size: 12px; font-weight: 700; }
.prog { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
.prog .bar { flex: 1 1 120px; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.prog .bar i { display: block; height: 100%; background: var(--c); border-radius: 99px; }
.prog .bar,.spec-progress .bar{display:none!important}
.continue { font-size: 14px; color: var(--muted); }
.mrow { display: flex; align-items: center; gap: 12px; }
.mring { flex: none; width: var(--sz); height: var(--sz); border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--soft) 0); }
.mring span { width: calc(var(--sz) - 12px); height: calc(var(--sz) - 12px); border-radius: 50%; background: var(--panel); display: grid; place-items: center;
  font: 900 calc(var(--sz) * .26) var(--font); color: var(--ink); }
.continue a { color: var(--c); font-weight: 800; }

/* ---------- chapter list ---------- */
.list { display: flex; flex-direction: column; gap: 28px; }
section.unit { display: flex; flex-direction: column; gap: 14px; }
.subj-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 900 24px var(--font); color: var(--c); }
.subj-head small { font: 700 14px var(--font); color: var(--muted); }
.unit-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.unit-head .pill { font: 900 13px var(--font); color: var(--on-c); background: var(--c); letter-spacing: .5px; text-transform: uppercase; padding: 4px 12px; border-radius: 999px; }
.unit-head h2 { font: 900 21px/1.2 var(--font); margin: 0; min-width: 0; }
.unit-head .count { margin-left: auto; color: var(--muted); font-size: 14px; white-space: nowrap; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.tile { background: var(--panel); border-radius: var(--r-md); display: flex; flex-direction: column; min-width: 0; box-shadow: var(--shadow); overflow: hidden; }
.tile .head { background: color-mix(in srgb, var(--c) 11%, var(--panel)); padding: 16px 16px 18px; border-radius: 0 0 26px 26px; }
.tile .row { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
.tile .ch { flex: none; width: 48px; height: 48px; display: grid; place-items: center; font: 900 19px var(--font); color: var(--on-c); background: var(--c);
  border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; }
.tile .info { min-width: 0; flex: 1; }
.tile h3 { font: 800 17px/1.25 var(--font); margin: 2px 0 0; }
.tile .foot { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 12px; flex: 1; }
.mtext { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.mtext b { font: 900 14px var(--font); color: var(--ink); }
.meta-line { font-size: 13px; color: var(--muted); font-weight: 700; margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.badge { font: 800 12px var(--font); padding: 2px 9px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; align-self: flex-start; }
.badge.good { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: auto; }
.actions > * { width: 100%; }
.btn { font: 800 14px var(--font); border-radius: 999px; padding: 9px 12px; text-align: center; cursor: pointer; text-decoration: none; border: 0;
  background: var(--soft); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; white-space: nowrap; }
.btn.primary { background: var(--c, var(--accent)); color: var(--on-c); }
.btn.quiz { background: color-mix(in srgb, var(--c, var(--accent)) 16%, var(--panel)); color: var(--c, var(--accent)); }
.empty { color: var(--muted); padding: 20px 0; }

/* ---------- reader ---------- */
#reader { background: var(--panel); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-hi); min-width: 0; }
.reader-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; padding: 16px 18px; background: color-mix(in srgb, var(--c) 10%, var(--panel)); }
.reader-bar .ch { flex: none; width: 44px; height: 44px; display: grid; place-items: center; font: 900 17px var(--font); color: var(--on-c); background: var(--c);
  border-radius: 42% 58% 55% 45% / 48% 42% 58% 52%; }
.reader-bar .ttl { flex: 1 1 220px; min-width: 0; }
.reader-bar h2 { font: 900 20px/1.2 var(--font); margin: 0; }
.reader-bar .meta { color: var(--muted); font-size: 13px; font-weight: 700; }
.reader-bar .tools { display: flex; flex-wrap: wrap; gap: 8px; width: 100%; }
@media (max-width: 640px) { .reader-bar .tools { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 2px 18px 4px; width: calc(100% + 36px); }
  .reader-bar .tools::-webkit-scrollbar { display: none; } }
.reader-bar .btn { flex: 0 0 auto; background: var(--panel); box-shadow: 0 1px 3px rgba(40,30,110,.08); }
.reader-bar .btn.primary { background: var(--c); }
.notes-wrap { height: 80vh; background: var(--soft); } .notes-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }
#reader.full .notes-wrap { height: auto; flex: 1; }
.pages-wrap { padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 16px; background: var(--soft); max-height: 78vh; overflow-y: auto; }
.pages-wrap img { width: 100%; max-width: 860px; aspect-ratio: 1406 / 1988; height: auto; object-fit: cover; background: #fff; box-shadow: var(--shadow); border-radius: 12px; display: block; }
#reader.full { position: fixed; inset: 0; z-index: 50; border-radius: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
#reader.full .pages-wrap, #reader.full .spec-wrap, #reader.full .quiz-wrap { flex: 1; max-height: none; }
#reader.full .pages-wrap img { max-width: 1100px; }
#reader.full .deck-wrap { flex: 1; max-height: none; aspect-ratio: auto; }
body.locked { overflow: hidden; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px;
  border-radius: 999px; font-size: 14px; z-index: 60; max-width: calc(100vw - 32px); }
.deck-wrap { background: #05070B; aspect-ratio: 16 / 10; max-height: 82vh; width: 100%; }
.deck-wrap iframe { width: 100%; height: 100%; border: 0; display: block; }

/* spec list */
.spec-wrap { padding: 18px; display: flex; flex-direction: column; gap: 10px; max-height: 78vh; overflow-y: auto; background: var(--soft); }
.spec-progress { display: flex; align-items: center; gap: 12px; font-weight: 800; color: var(--muted); flex-wrap: wrap; }
.spec-progress .bar { flex: 1 1 140px; height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; }
.spec-progress .bar i { display: block; height: 100%; background: var(--c, var(--accent)); width: 0; transition: width .2s; border-radius: 99px; }
.sp { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 8px 12px; align-items: start; background: var(--panel); border-radius: var(--r-sm); padding: 12px 14px; cursor: pointer; }
.sp input { margin-top: 4px; width: 20px; height: 20px; accent-color: var(--c, var(--accent)); }
.sp .id { font: 900 13px var(--font); background: var(--c, var(--accent)); color: var(--on-c); border-radius: 999px; padding: 3px 10px; min-width: 56px; text-align: center; white-space: nowrap; }
.sp .txt { font-size: 15px; line-height: 1.45; font-weight: 600; overflow-wrap: anywhere; min-width: 0; }
.sp .po { display: inline-block; font: 800 11px var(--font); border: 1.5px solid currentColor; color: var(--c, var(--accent)); border-radius: 99px; padding: 0 8px; margin-left: 6px; white-space: nowrap; }
.sp.done .txt { color: var(--muted); }
.sp .chls { grid-column: 3; display: flex; flex-wrap: wrap; gap: 6px; }
.sp .chl { font: 800 12px var(--font); text-decoration: none; color: var(--ink); background: var(--soft); border-radius: 999px; padding: 3px 10px; }
@media (max-width: 520px) { .sp { grid-template-columns: auto minmax(0, 1fr); } .sp .id { grid-column: 2; justify-self: start; } .sp .txt, .sp .chls { grid-column: 1 / -1; } }
.spec-topic { font: 900 17px var(--font); margin: 12px 0 2px; }
.status { color: var(--muted); font-size: 14px; padding: 18px; text-align: center; font-weight: 600; }


/* exam */
.ex-tag { display: inline-block; font: 800 12px var(--font); background: var(--soft); color: var(--c, var(--accent)); border-radius: 99px; padding: 4px 10px; margin-right: 6px; }
.ex-q { white-space: pre-wrap; }
.ex-ans { width: 100%; min-height: 130px; margin-top: 14px; font: 600 16px/1.45 var(--font); color: var(--ink); background: var(--soft); border: 2px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; resize: vertical; box-sizing: border-box; }
.ex-ms { background: var(--panel); border-radius: var(--r-md); padding: 16px 20px; box-shadow: var(--shadow); border-left: 6px solid var(--c, var(--accent)); }
.ex-ms h4 { margin: 0 0 8px; font: 900 17px var(--font); }
.ex-ms label { display: flex; gap: 10px; align-items: flex-start; padding: 7px 0; font-weight: 700; cursor: pointer; }
.ex-ms input { width: 20px; height: 20px; margin-top: 2px; flex: none; accent-color: var(--ok); }
.ex-left { font-size: 12px; opacity: .7; margin-top: 8px; }
.ex-sc { font: 900 18px var(--font); margin-top: 10px; color: var(--c, var(--accent)); }

/* quiz */
.quiz-wrap { padding: clamp(16px, 3vw, 28px); background: var(--soft); max-height: 82vh; overflow-y: auto; }
.quiz { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.qtop { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-weight: 800; color: var(--muted); }
.dots { display: flex; gap: 6px; flex: 1; min-width: 120px; }
.dots i { flex: 1; height: 8px; border-radius: 99px; background: var(--line); }
.dots i.ok { background: var(--ok); } .dots i.bad { background: var(--bad); } .dots i.now { background: var(--c, var(--accent)); }
.qcard { background: var(--panel); border-radius: var(--r-md); padding: clamp(18px, 3vw, 26px); box-shadow: var(--shadow); }
.qcard .from { font: 800 13px var(--font); color: var(--c, var(--accent)); text-transform: uppercase; letter-spacing: .6px; }
.qcard h3 { font: 900 clamp(19px, 2.6vw, 23px)/1.3 var(--font); margin: 6px 0 0; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; font: 700 16px/1.35 var(--font); color: var(--ink); background: var(--panel);
  border: 2px solid transparent; border-radius: var(--r-md); padding: 14px 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .12s ease, border-color .12s ease; }
.opt span { min-width: 0; overflow-wrap: anywhere; }
.opt b { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: var(--soft); font-weight: 900; color: var(--c, var(--accent)); }
.opt:hover:not([disabled]) { border-color: color-mix(in srgb, var(--c, var(--accent)) 45%, transparent); transform: translateY(-1px); }
.opt[disabled] { cursor: default; }
.opt.right { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, var(--panel)); }
.opt.right b { background: var(--ok); color: var(--on-c); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 10%, var(--panel)); }
.opt.wrong b { background: var(--bad); color: var(--on-c); }
.opt.dim { opacity: .55; }
.feedback { border-radius: var(--r-md); padding: 14px 18px; font-weight: 700; background: var(--panel); box-shadow: var(--shadow); border-left: 6px solid var(--fc); }
.feedback strong { display: block; font-weight: 900; color: var(--fc); font-size: 17px; }
.qnav { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
.qnav .btn { padding: 12px 22px; font-size: 15px; background: var(--panel); box-shadow: var(--shadow); }
.qnav .btn.primary { background: var(--c, var(--accent)); }
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.ring { width: 150px; height: 150px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--line) 0); }
.ring div { width: 118px; height: 118px; border-radius: 50%; background: var(--panel); display: grid; place-items: center; font: 900 34px var(--font); }
.result h3 { font: 900 24px var(--font); margin: 0; }
.review { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 8px; }
.review div { background: var(--panel); border-radius: var(--r-sm); padding: 10px 14px; font-size: 14px; border-left: 5px solid var(--rc); }
.review b { display: block; font-weight: 800; }
@media (prefers-reduced-motion: no-preference) {
  .tile, .scard { transition: transform .18s ease, box-shadow .18s ease; }
  .tile:hover, .scard:hover { transform: translateY(-3px); box-shadow: var(--shadow-hi); }
}
.logo .lgo{width:34px;height:34px;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}</style>

ar reactions where suitable information is provided."], ["1.26", "calculate relative formula masses (including relative molecular masses) (Mᵣ) from relative atomic masses (Aᵣ)"], ["1.27", "know that the mole (mol) is the unit for the amount of a substance"], ["1.28", "understand how to carry out calculations involving amount of substance, relative atomic mass (Aᵣ) and relative formula mass (Mᵣ)"], ["1.29", "calculate reacting masses using experimental data and chemical equations"], ["1.30", "calculate percentage yield"], ["1.31", "understand how the formulae of simple compounds can be obtained experimentally, including metal oxides, water and salts containing water of crystallisation"], ["1.32", "know what is meant by the terms empirical formula and molecular formula"], ["1.33", "calculate empirical and molecular formulae from experimental data"], ["1.34C", "understand how to carry out calculations involving amount of substance, volume and concentration (in mol/dm³) of solution"], ["1.35C", "understand how to carry out calculations involving gas volumes and the molar volume of a gas (24 dm³ and 24 000 cm³ at room temperature and pressure (rtp))"], ["1.36", "practical: know how to determine the formula of a metal oxide by combustion (e.g. magnesium oxide) or by reduction (e.g. copper(II) oxide)"], ["1.37", "understand how ions are formed by electron loss or gain"], ["1.38", "know the charges of these ions: • metals in Groups 1, 2 and 3 • non-metals in Groups 5, 6 and 7 • Ag⁺, Cu²⁺, Fe²⁺, Fe³⁺, Pb²⁺, Zn²⁺ • hydrogen (H⁺), hydroxide (OH⁻), ammonium (NH₄⁺), carbonate (CO₃²⁻), nitrate (NO₃⁻), sulfate (SO₄²⁻)."], ["1.39", "write formulae for compounds formed between the ions listed above"], ["1.40", "draw dot-and-cross diagrams to show the formation of ionic compounds by electron transfer, limited to combinations of elements from Groups 1, 2, 3 and 5, 6, 7 only outer electrons need be shown"], ["1.41", "understand ionic bonding in terms of electrostatic attractions"], ["1.42", "understand why compounds with giant ionic lattices have high melting and boiling points"], ["1.43", "know that ionic compounds do not conduct electricity when solid, but do conduct electricity when molten and in aqueous solution"], ["1.44", "know that a covalent bond is formed between atoms by the sharing of a pair of electrons"], ["1.45", "understand covalent bonds in terms of electrostatic attractions"], ["1.46", "understand how to use dot-and-cross diagrams to represent covalent bonds in: • diatomic molecules, including hydrogen, oxygen, nitrogen, halogens and hydrogen halides • inorganic molecules including water, ammonia and carbon dioxide • organic molecules containing up to two carbon atoms, including methane, ethane, ethene and those containing halogen atoms."], ["1.47", "explain why substances with a simple molecular structures are gases or liquids, or solids with low melting and boiling points (the term intermolecular forces of attraction can be used to represent all forces between molecules)"], ["1.48", "explain why the melting and boiling points of substances with simple molecular structures increase, in general, with increasing relative molecular mass"], ["1.49", "explain why substances with giant covalent structures are solids with high melting and boiling points"], ["1.50", "explain how the structures of diamond, graphite and C₆₀ fullerene influence their physical properties, including electrical conductivity and hardness"], ["1.51", "know that covalent compounds do not usually conduct electricity"], ["1.52C", "know how to represent a metallic lattice by a 2-D diagram"], ["1.53C", "understand metallic bonding in terms of electrostatic attractions"], ["1.54C", "explain typical physical properties of metals, including electrical conductivity and malleability"], ["1.55C", "understand why covalent compounds do not conduct electricity"], ["1.56C", "understand why ionic compounds conduct electricity only when molten or in aqueous solution"], ["1.57C" now that bond-breaking is an endothermic process and that bond-making is an exothermic process"], ["3.7C", "use bond energies to calculate the enthalpy change during a chemical reaction"], ["3.8", "practical: investigate temperature changes accompanying some of the following types of change: • salts dissolving in water • neutralisation reactions • displacement reactions • combustion reactions."], ["3.9", "describe experiments to investigate the effects of changes in surface area of a solid, concentration of a solution, temperature and the use of a catalyst on the rate of a reaction"], ["3.10", "describe the effects of changes in surface area of a solid, concentration of a solution, pressure of a gas, temperature and the use of a catalyst on the rate of a reaction"], ["3.11", "explain the effects of changes in surface area of a solid, concentration of a solution, pressure of a gas and temperature on the rate of a reaction in terms of particle collision theory"], ["3.12", "know that a catalyst is a substance that increases the rate of a reaction, but is chemically unchanged at the end of the reaction"], ["3.13", "know that a catalyst works by providing an alternative pathway with lower activation energy"], ["3.14C", "draw and explain reaction profile diagrams showing ΔH and activation energy"], ["3.15", "practical: investigate the effect of changing the surface area of marble chips and of changing the concentration of hydrochloric acid on the rate of reaction between marble chips and dilute hydrochloric acid"], ["3.16", "practical: investigate the effect of different solids on the catalytic decomposition of hydrogen peroxide solution"], ["3.17", "know that some reactions are reversible and this is indicated by the symbol ⇌ in equations"], ["3.18", "describe reversible reactions such as the dehydration of hydrated copper(II) sulfate and the effect of heat on ammonium chloride"], ["3.19C", "know that a reversible reaction can reach dynamic equilibrium in a sealed container"], ["3.20C", "know that the characteristics of a reaction at dynamic equilibrium are: • the forward and reverse reactions occur at the same rate • the concentrations of reactants and products remain constant."], ["3.21C", "understand why a catalyst does not affect the position of equilibrium in a reversible reaction"], ["3.22C", "know the effect of changing either temperature or pressure on the position of equilibrium in a reversible reaction: • an increase (or decrease) in temperature shifts the position of equilibrium in the direction of the endothermic (or exothermic) reaction • an increase (or decrease) in pressure shifts the position of equilibrium in the direction that produces fewer (or more) moles of gas References to Le Chatelier's principle are not required"], ["4.1", "know that a hydrocarbon is a compound of hydrogen and carbon only"], ["4.2", "understand how to represent organic molecules using empirical formulae, molecular formulae, general formulae, structural formulae and displayed formulae"], ["4.3", "know what is meant by the terms homologous series, functional group and isomerism"], ["4.4", "understand how to name compounds relevant to this specification using the rules of International Union of Pure and Applied Chemistry (IUPAC) nomenclature students will be expected to name compounds containing up to six carbon atoms"], ["4.5", "understand how to write the possible structural and displayed formulae of an organic molecule given its molecular formula"], ["4.6", "understand how to classify reactions of organic compounds as substitution, addition and combustion knowledge of reaction mechanisms is not required"], ["4.7", "know that crude oil is a mixture of hydrocarbons"], ["4.8", "describe how the industrial process of fractional distillation separates crude oil into fractions"], ["4.9", "know the names and uses of the main fractions obtained from crude oil: refinery gases, gasoline, kerosene, diesel, fuel oil and bitumen"], ["4.10", "know the trend in colour, boiling point and viscosity of the main fractions"], ["4.11", "know that a fuel is a substance that, when burned, releases heat energy"], ["4.12", "know the possible products of complete and incomplete combustion of hydrocarbons with oxygen in the air"], ["4.13", "understand why carbon monoxide is poisonous, in terms of its effect on the capacity of blood to transport oxygen references to haemoglobin are not required"], ["4.14", "know that, in car engines, the temperature reached is high enough to allow nitrogen and oxygen from air to react, forming oxides of nitrogen"], ["4.15", "explain how the combustion of some impurities in hydrocarbon fuels results in the formation of sulfur dioxide"], ["4.16", "understand how sulfur dioxide and oxides of nitrogen contribute to acid rain"], ["4.17", "describe how long-chain alkanes are converted to alkenes and shorter-chain alkanes by catalytic cracking (using silica or alumina as the catalyst and a temperature in the range of 600–700 °C)"], ["4.18", "explain why cracking is necessary, in terms of the balance between supply and demand for different fractions"], ["4.19", "know the general formula for alkanes"], ["4.20", "explain why alkanes are classified as saturated hydrocarbons"], ["4.21", "understand how to draw the structural and displayed formulae for alkanes with up to five carbon atoms in the molecule, and to name the unbranched-chain isomers"], ["4.22", "describe the reactions of alkanes with halogens in the presence of ultraviolet radiation, limited to mono-substitution knowledge of reaction mechanisms is not required"], ["4.23", "know that alkenes contain the functional group >C=C<"], ["4.24", "know the general formula for alkenes"], ["4.25", "explain why alkenes are classified as unsaturated hydrocarbons"], ["4.26", "understand how to draw the structural and displayed formulae for alkenes with up to four carbon atoms in the molecule, and name the unbranched-chain isomers knowledge of cis/trans or E/Z ed formulae of an ester, given the name or formula of the alcohol and carboxylic acid from which it is formed and vice versa"], ["4.42C", "know that esters are volatile compounds with distinctive smells and are used as food flavourings and in perfumes"], ["4.43C", "practical: prepare a sample of an ester such as ethyl ethanoate"], ["4.44", "know that an addition polymer is formed by joining up many small molecules called monomers"], ["4.45", "understand how to draw the repeat unit of an addition polymer, including poly(ethene), poly(propene), poly(chloroethene) and (poly)tetrafluoroethene"], ["4.46", "understand how to deduce the structure of a monomer from the repeat unit of an addition polymer and vice versa"], ["4.47", "explain problems in the disposal of addition polymers, including: • their inertness and inability to biodegrade • the production of toxic gases when they are burned."], ["4.48C", "know that condensation polymerisation, in which a dicarboxylic acid reacts with a diol, produces a polyester and water"], ["4.49C", "understand how to write the structural and displayed formula of a polyester, showing the repeat unit, given the formulae of the monomers from which it is formed, including the reaction of ethanedioic acid and ethanediol"], ["4.50C", "know that some polyesters, known as biopolyesters, are biodegradable"]], "specmap": {"1": ["1.1", "1.2", "1.3", "1.4", "1.5C", "1.6C", "1.7C"], "2": ["1.8", "1.9", "1.10", "1.11", "1.12", "1.13"], "3": ["1.14", "1.15", "1.16", "1.17"], "4": ["1.18", "1.19", "1.20", "1.21", "1.22", "1.23", "1.24"], "5": ["1.25", "1.26", "1.27", "1.28", "1.29", "1.30", "1.31", "1.32", "1.33", "1.36"], "6": ["1.34C", "1.35C"], "7": ["1.37", "1.38", "1.39", "1.40", "1.41", "1.42", "1.43"], "8": ["1.44", "1.45", "1.46", "1.47", "1.48", "1.49", "1.50", "1.51"], "9": ["1.52C", "1.53C", "1.54C"], "10": ["1.55C", "1.56C", "1.57C", "1.58C", "1.59C", "1.60C"], "11": ["2.1", "2.2", "2.3", "2.4C"], "12": ["2.5", "2.6", "2.7", "2.8C"], "13":  or tennis balls"], ["1.6", "know and use the relationship between acceleration, change in velocity and time taken: acceleration = change in velocity ÷ time taken, a = (v − u) ÷ t"], ["1.7", "plot and explain velocity−time graphs"], ["1.8", "determine acceleration from the gradient of a velocity−time graph"], ["1.9", "determine the distance travelled from the area between a velocity−time graph and the time axis"], ["1.10", "use the relationship between final speed, initial speed, acceleration and distance moved: (final speed)² = (initial speed)² + (2 × acceleration × distance moved), v² = u² + (2 × a × s)"], ["1.11", "describe the effects of forces between bodies such as changes in speed, shape or direction"], ["1.12", "identify different types of force such as gravitational or electrostatic"], ["1.13", "understand how vector quantities differ from scalar quantities"], ["1.14", "understand that force is a vector quantity"], ["1.15", "calculate the resultant force of forces that act along a line"], ["1.16", "know that friction is a force that opposes motion"], ["1.17", "know and use the relationship between unbalanced force, mass and acceleration: force = mass × acceleration, F = m × a"], ["1.18", "know and use the relationship between weight, mass and gravitational field strength: weight = mass × gravitational field strength, W = m × g"], ["1.19", "know that the stopping distance of a vehicle is made up of the sum of the thinking distance and the braking distance"], ["1.20", "describe the factors affecting vehicle stopping distance, including speed, mass, road condition and reaction time"], ["1.21", "describe the forces acting on falling objects (and explain why falling objects reach a terminal velocity)"], ["1.22", "practical: investigate how extension varies with applied force for helical springs, metal wires and rubber bands"], ["1.23", "know that the initial linear region of a force-extension graph is associated with Hooke’s law"], ["1.24", "describe elastic behaviour as the ability of a material to recover its original shape after the forces causing deformation have been removed"], ["1.25P", "know and use the relationship between momentum, mass and velocity: momentum = mass × velocity, p = m × v"], ["1.26P", "use the idea of momentum to explain safety features"], ["1.27P", "use the conservation of momentum to calculate the mass, velocity or momentum of objects"], ["1.28P", "use the relationship between force, change in momentum and time taken: force = change in momentum ÷ time taken, F = (mv − mu) ÷ t"], ["1.29P", "demonstrate an understanding of Newton’s third law"], ["1.30P", "know and use the relationship between the moment of a force and its perpendicular distance from the pivot: moment = force × perpendicular distance from the pivot"], ["1.31P", "know that the weight of a body acts through its centre of gravity"], ["1.32P", "use the principle of moments for a simple system of parallel forces acting in one plane"], ["1.33P", "understand how the upward forces on a light beam, supported at its ends, vary with the position of a heavy object placed on the beam"], ["2.1", "use the following units: ampere (A), coulomb (C), joule (J), ohm (Ω), second (s), volt (V) and watt (W)"], ["2.2", "understand how the use of insulation, double insulation, earthing, fuses and circuit breakers protects the device or user in a range of domestic appliances"], ["2.3", "understand why a current in a resistor results in the electrical transfer of energy and an increase in temperature, and how this can be used in a variety of domestic contexts"], ["2.4", "know and use the relationship between power, current and voltage: power = current × voltage, P = I × V, and apply the relationship to the selection of appropriate fuses"], ["2.5", "use the relationship between energy transferred, current, voltage and time: energy transferred = current × voltage × time, E = I × V × t"], ["2.6", "know the difference between mains electricity being alternating current (a.c.) and direct current (d.c.) being supplied by a cell or battery"], ["2.7", "explain why a series or parallel circuit is more appropriate for particular applications, including domestic lighting"], ["2.8", "understand how the current in a series circuit depends on the applied voltage and the number and nature of other components"], ["2.9", "describe how current varies with voltage in wires, resistors, metal filament lamps and diodes, and how to investigate this experimentally"], ["2.10", "describe the qualitative effect of changing resistance on the current in a circuit"], ["2.11", "describe the qualitative variation of resistance of light-dependent resistors (LDRs) with illumination and thermistors with temperature"], ["2.12", "know that lamps and LEDs can be used to indicate the presence of a current in a circuit"], ["2.13", "know and use the relationship between voltage, current and resistance: voltage = current × resistance, V = I × R"], ["2.14", "know that current is the rate of flow of charge"], ["2.15", "know and use the relationship between charge, current and time: charge = current × time, Q = I × t"], ["2.16", "know that electric current in solid metallic conductors is a flow of negatively charged electrons"], ["2.17", "understand why current is conserved at a junction in a circuit"], ["2.18", "know that the voltage across two components connected in parallel is the same"], ["2.19", "calculate the currents, voltages and resistances of two resistive components connected in a series circuit"], ["2.20", "know that: voltage is the energy transferred per unit charge passed; the volt is a joule per coulomb"], ["2.21", "know and use the relationship between energy transferred, charge and voltage: energy transferred = charge × voltage, E = Q × V"], ["2.22P", "identify common materials that are electrical conductors or insulators, including metals and plastics"], ["2.23P", "practical: investigate how insulating materials can be charged by friction"], ["2.24P", "explain how positive and negative electrostatic charges are produced on materials by the loss and gain of electrons"], ["2.25P", "know that there are forces of attraction between unlike charges and forces of repulsion between like charges"], ["2.26P", "explain electrostatic phenomena in terms of the movement of electrons"], ["2.27P", "explain the potential dangers of electrostatic charges, e.g. when fuelling aircraft and tankers"], ["2.28P", "explain some uses of electrostatic charges, e.g. in photocopiers and inkjet printers"], ["3.1", "use the following units: degree (°), hertz (Hz), metre (m), metre/second (m/s) and second (s)"], ["3.2", "explain the difference between longitudinal and transverse waves"], ["3.3", "know the definitions of amplitude, wavefront, frequency, wavelength and period of a wave"], ["3.4", "know that waves transfer energy and information without transferring matter"], ["3.5", "know and use the relationship between the speed, frequency and wavelength of a wave: wave speed = frequency × wavelength, v = f × λ"], ["3.6", "use the relationship between frequency and time period: frequency = 1 ÷ time period, f = 1/T"], ["3.7", "use the above relationships in different contexts, including sound waves and electromagnetic waves"], ["3.8", "explain why there is a change in the observed frequency and wavelength of a wave when its source is moving relative to an observer and that this is known as the Doppler effect"], ["3.9", "explain that all waves can be reflected and refracted"], ["3.10", "know that light is part of a continuous electromagnetic spectrum that includes radio, microwave, infrared, visible, ultraviolet, x-ray and gamma ray radiations, and that all these waves travel at the same speed in free space"], ["3.11", "know the order of the electromagnetic spectrum in terms of decreasing wavelength and increasing frequency, including the colours of the visible spectrum"], ["3.12", "explain some of the uses of electromagnetic radiations, including: radio waves: broadcasting and communications; microwaves: cooking and satellite transmissions; infrared: heaters and night vision equipment; visible light: optical fibres and photography; ultraviolet: fluorescent lamps; x-rays: observing the internal structure of objects and materials, including for medical applications; gamma rays: sterilising food and medical equipment"], ["3.13", "explain the detrimental effects of excessive exposure of the human body to electromagnetic waves, including: microwaves: internal heating of body tissue; infrared: skin burns; ultraviolet: damage to surface cells and blindness; gamma rays: cancer, mutation and describe simple protective measures against the risks"], ["3.14", "know that light waves are transverse waves and that they can be reflected and refracted"], ["3.15", "use the law of reflection (the angle of incidence equals the angle of reflection)"], ["3.16", "draw ray diagrams to illustrate reflection and refraction"], ["3.17", "practical: investigate the refraction of light, using rectangular blocks, semi-circular blocks and triangular prisms"], ["3.18", "know and use the relationship between refractive index, angle of incidence and angle of refraction: n = sin i ÷ sin r"], ["3.19", "practical: investigate the refractive index of glass, using a glass block"], ["3.20", "describe the role of total internal reflection in transmitting information along optical fibres and in prisms"], ["3.21", "explain the meaning of critical angle c"], ["3.22", "know and use the relationship between critical angle and refractive index: sin c = 1/n"], ["3.23", "know that sound waves are longitudinal waves that can be reflected and refracted"], ["3.24P", "know that the frequency range for human hearing is 20–20 000 Hz"], ["3.25P", "practical: investigate the speed of sound in air"], ["3.26P", "understand how an oscilloscope and microphone can be used to display a sound wave"], ["3.27P", "practical: investigate the frequency of a sound wave using an oscilloscope"], ["3.28P", "understand how the pitch of a sound relates to the frequency of vibration of the source"], ["3.29P", "understand how the loudness of a sound relates to the amplitude of vibration of the source"], ["4.1", "use the following units: kilogram (kg), joule (J), metre (m), metre/second (m/s), metre/second² (m/s²), newton (N), second (s) and watt (W)"], ["4.2", "describe energy transfers involving energy stores: energy stores: chemical, kinetic, gravitational, elastic, thermal, magnetic, electrostatic, nuclear; energy transfers: mechanically, electrically, by heating, by radiation (light and sound)"], ["4.3", "use the principle of conservation of energy"], ["4.4", "know and use the relationship between efficiency, useful energy output and total energy output: efficiency = (useful energy output ÷ total energy output) × 100%"], ["4.5", "describe a variety of everyday and scientific devices and situations, explaining the transfer of the input energy in terms of the above relationship, including their representation by Sankey diagrams"], ["4.6", "describe how thermal energy transfer may take place by conduction, convection and radiation"], ["4.7", "explain the role of convection in everyday phenomena"], ["4.8", "explain how emission and absorption of radiation are related to surface and temperature"], ["4.9", "practical: investigate thermal energy transfer by conduction, convection and radiation"], ["4.10", "explain ways of reducing unwanted energy transfer, such as insulation"], ["4.11", "know and use the relationship between work done, force and distance moved in the direction of the force: work done = force × distance moved, W = F × d"], ["4.12", "know that work done is equal to energy transferred"], ["4.13", "know and use the relationship between gravitational potential energy, mass, gravitational field strength and height: gravitational potential energy = mass × gravitational field strength × height, GPE = m × g × h"], ["4.14", "know and use the relationship: kinetic energy = ½ × mass × speed², KE = ½ × m × v²"], ["4.15", "understand how conservation of energy produces a link between gravitational potential energy, kinetic energy and work"], ["4.16", "describe power as the rate of transfer of energy or the rate of doing work"], ["4.17", "use the relationship between power, work done (energy transferred) and time taken: power = work done ÷ time taken, P = W/t"], ["4.18P", "describe the energy transfers involved in generating electricity using: wind; water; geothermal resources; solar heating systems; solar cells; fossil fuels; nuclear power"], ["4.19P", "describe the advantages and disadvantages of methods of large-scale electricity production from various renewable and non-renewable resources"], ["5.1", "use the following units: degree Celsius (°C), Kelvin (K), joule (J), kilogram (kg), kilogram/metre³ (kg/m³), metre (m), metre² (m²), metre³ (m³), metre/second (m/s), metre/second² (m/s²), newton (N) and pascal (Pa)"], ["5.2P", "use the following unit: joules/kilogram degree Celsius (J/kg °C)"], ["5.3", "know and use the relationship between density, mass and volume: density = mass ÷ volume, ρ = m/V"], ["5.4", "practical: investigate density using direct measurements of mass and volume"], ["5.5", "know and use the relationship between pressure, force and area: pressure = force ÷ area, p = F/A"], ["5.6", "understand how the pressure at a point in a gas or liquid at rest acts equally in all directions"], ["5.7", "know and use the relationship for pressure difference: pressure difference = height × density × gravitational field strength, p = h × ρ × g"], ["5.8P", "explain why heating a system will change the energy stored within the system and raise its temperature or produce changes of state"], ["5.9P", "describe the changes that occur when a solid melts to form a liquid, and when a liquid evaporates or boils to form a gas"], ["5.10P", "describe the arrangement and motion of particles in solids, liqu const QUIZ = {"biology": {"1": [["Which process releases energy from food in cells?", "Respiration", "Excretion", "Nutrition", "Sensitivity", "Respiration releases energy from food molecules such as glucose inside cells."], ["Which structure is found in plant cells but NOT in animal cells?", "Cell wall", "Cell membrane", "Nucleus", "Mitochondria", "Plant cells have a cellulose cell wall; animal cells do not."], ["What is the word equation for aerobic respiration?", "glucose + oxygen → carbon dioxide + water", "glucose → lactic acid", "carbon dioxide + water → glucose + oxygen", "glucose → ethanol + carbon dioxide", "Aerobic respiration uses oxygen and releases carbon dioxide and water."], ["What happens to an enzyme when it is heated well above its optimum temperature?", "Its active site changes shape and it is denatured", "It works faster and faster", "It is used up in the reaction", "It turns into a substrate", "High temperatures change the shape of the active site, so the substrate no longer fits."], ["Which process moves water across a partially permeable membrane?", "Osmosis", "Diffusion", "Active transport", "Respiration", "Osmosis is the net movement of water from dilute to concentrated solution."], ["Which of these is a characteristic of all living organisms?", "Reproduction", "Photosynthesis", "Flowering", "Hibernation", "All living things reproduce."], ["Which of these is a characteristic of all living organisms?", "Excretion", "Photosynthesis", "Having a skeleton", "Having a nucleus in every cell", "All living things remove metabolic waste."], ["Which structure is found in plant cells but not animal cells?", "Cell wall", "Cell membrane", "Nucleus", "Mitochondria", "Plant cell walls are made of cellulose."], ["What does a chloroplast do?", "Carries out photosynthesis", "Releases energy by respiration", "Controls the cell", "Makes proteins", "Chloroplasts contain chlorophyll."], ["What does the permanent vacuole contain?", "Cell sap", "Chromosomes", "Chlorophyll", "Ribosomes", "It keeps the cell turgid."], ["At what temperature does an enzyme work best?", "Its optimum temperature", "0 degrees Celsius", "100 degrees Celsius", "Any temperature equally", "Above the optimum it denatures."]], "2": [["Which group of organisms has cells with a nucleus and a chitin cell wall, and feeds by extracellular digestion?", "Fungi", "Bacteria", "Plants", "Viruses", "Fungi have chitin walls and secrete enzymes onto food, then absorb the products (saprotrophic nutrition)."], ["Which of these is NOT made of cells?", "Virus", "Bacterium", "Protoctist", "Fungus", "Viruses are not living cells; they can only reproduce inside living cells."], ["Which is an example of a protoctist?", "Amoeba", "Yeast", "Lactobacillus", "Mushroom", "Amoeba is a single-celled protoctist (as are Chlorella and Plasmodium)."], ["Which kingdom do mushrooms belong to?", "Fungi", "Plants", "Protoctista", "Animals", "Mushrooms are fungi, with cell walls of chitin."], ["Why are viruses not classed as living organisms?", "They have no cells and cannot reproduce on their own", "They are too small", "They cause disease", "They have DNA", "Viruses only reproduce inside host cells and have no cell structure."], ["Which group of vertebrates has feathers?", "Birds", "Reptiles", "Mammals", "Amphibians", "Only birds have feathers."], ["Which kingdom do mushrooms belong to?", "Fungi", "Plants", "Bacteria", "Protoctists", "Fungi feed by extracellular digestion."], ["What are fungal threads called?", "Hyphae", "Plasmids", "Chloroplasts", "Cilia", "A network of hyphae is a mycelium."], ["Which organism is a protoctist?", "Amoeba", "Yeast", "Lactobacillus", "Mucor", "Some protoctists are like animals, some like plants."], ["What do bacteria have instead of a nucleus?", "A loop of DNA free in the cytoplasm", "No genetic material", "A protein coat only", "Chloroplasts", "They may also have plasmids."], ["Which pathogen causes malaria?", "Plasmodium (a protoctist)", "A virus", "Lactobacillus", "Pneumococcus", "It is spread by mosquitoes."]], "3": [["Where does gas exchange take place in the human lungs?", "Alveoli", "Trachea", "Bronchi", "Larynx", "The alveoli have a large surface area and thin walls for diffusion."], ["Which feature does NOT help alveoli exchange gases efficiently?", "Thick walls", "Large surface area", "Good blood supply", "Moist lining", "Alveolar walls are one cell thick to keep the diffusion distance short."], ["Which substance in cigarette smoke reduces the blood's ability to carry oxygen?", "Carbon monoxide", "Tar", "Nicotine", "Water vapour", "Carbon monoxide binds to haemoglobin, so less oxygen is carried."], ["Which structure is the site of gas exchange in the lungs?", "Alveoli", "Bronchi", "Trachea", "Diaphragm", "Alveoli have thin walls and a large surface area."], ["Which gas diffuses from the alveoli into the blood?", "Oxygen", "Carbon dioxide", "Nitrogen", "Water vapour", "Oxygen moves in and carbon dioxide moves out."], ["What is the function of the trachea's cartilage rings?", "Keep the airway open", "Produce mucus", "Exchange gases", "Trap dust", "They stop it collapsing."], ["What happens to the ribs when you breathe in?", "They move up and out", "They move down and in", "They stay still", "They break apart", "Intercostal muscles contract."], ["Which gas test shows carbon dioxide?", "Turns limewater milky", "Relights a glowing splint", "Squeaky pop with a lit splint", "Bleaches damp litmus", "Exhaled air turns limewater milky faster."], ["What is the effect of exercise on breathing rate?", "It increases", "It decreases", "It stops", "It has no effect", "Muscles need more oxygen."], ["Which substance in smoke causes cancer?", "Tar", "Nicotine", "Carbon monoxide", "Oxygen", "Tar contains carcinogens."]], "4": [["Which enzyme breaks down starch?", "Amylase", "Protease", "Lipase", "Bile", "Amylase digests starch into maltose."], ["What does bile do?", "Neutralises stomach acid and emulsifies fats", "Digests proteins", "Absorbs water", "Makes starch", "Bile (made in the liver) emulsifies fats into droplets and neutralises acid."], ["Where is most digested food absorbed?", "Small intestine (ileum)", "Stomach", "Large intestine", "Oesophagus", "Villi in the ileum give a huge surface area for absorption."], ["Which reagent turns blue-black with starch?", "Iodine solution", "Benedict's solution", "Biuret reagent", "Limewater", "Iodine changes from orange-brown to blue-black when starch is present."], ["Which enzyme digests starch?", "Amylase", "Protease", "Lipase", "Pepsin", "Amylase breaks starch into sugars."], ["Where is bile stored?", "Gall bladder", "Liver", "Stomach", "Pancreas", "Bile is made in the liver and stored in the gall bladder."], ["What are the end products of protein digestion?", "Amino acids", "Fatty acids", "Glucose", "Glycerol", "Proteases break proteins into amino acids."], ["What does lipase break down?", "Lipids into fatty acids and glycerol", "Starch into maltose", "Proteins into amino acids", "Glucose into starch", "Lipase works in the small intestine."], ["Which organ makes amylase, protease and lipase?", "Pancreas", "Liver", "Gall bladder", "Large intestine", "Pancreatic juice enters the duodenum."], ["What are villi?", "Finger-like projections in the small intestine", "Teeth", "Air sacs", "Kidney tubules", "They increase the surface area for absorption."], ["Which vitamin deficiency causes rickets?", "Vitamin D", "Vitamin C", "Vitamin A", "Iron", "Bones become soft."], ["What is a balanced diet?", "One with the right amounts of all the nutrients", "One with only protein", "One with no fat", "One with only fruit", "Needs vary with age and activity."]], "5": [["Which blood component carries oxygen?", "Red blood cells (haemoglobin)", "White blood cells", "Platelets", "Plasma proteins only", "Haemoglobin in red cells combines with oxygen to form oxyhaemoglobin."], ["Which vessels carry blood away from the heart at high pressure?", "Arteries", "Veins", "Capillaries", "Lymph vessels", "Arteries have thick muscular, elastic walls to cope with high pressure."], ["Which chamber of the heart pumps blood to the body?", "Left ventricle", "Right ventricle", "Left atrium", "Right atrium", "The left ventricle has the thickest wall and pumps blood into the aorta."], ["What is the job of platelets?", "Help blood clot", "Carry carbon dioxide", "Make antibodies", "Digest bacteria", "Platelets start clotting to seal wounds."], ["Which blood vessel carries blood away from the heart?", "Artery", "Vein", "Capillary", "Vena cava", "Arteries carry blood away from the heart."], ["Which part of the blood carries oxygen?", "Red blood cells", "Platelets", "Plasma", "White blood cells", "Haemoglobin in red cells binds oxygen."], ["Which blood cells make antibodies?", "Lymphocytes", "Phagocytes", "Red blood cells", "Platelets", "Antibodies target specific antigens."], ["What does the heart's septum do?", "Separates oxygenated and deoxygenated blood", "Pumps blood", "Stops backflow", "Makes red blood cells", "It divides left and right sides."], ["Why do arteries have thick muscular walls?", "To withstand high pressure", "To let gases diffuse", "To store blood", "To carry blood to the heart", "Blood leaves the heart at high pressure."], ["What happens to heart rate during exercise?", "It increases", "It decreases", "It stops", "It stays the same", "More oxygen and glucose reach muscles."], ["Which blood vessel brings blood back from the body to the heart?", "Vena cava", "Aorta", "Pulmonary artery", "Pulmonary vein", "It enters the right atrium."]], "6": [["What is the correct order in a reflex arc?", "Receptor → sensory neurone → relay neurone → motor neurone → effector", "Effector → motor neurone → receptor", "Receptor → motor neurone → sensory neurone → effector", "Brain → receptor → effector", "Information passes from receptor to effector via the CNS."], ["Which part of the eye controls how much light enters?", "Iris", "Retina", "Lens", "Cornea", "The iris muscles change the size of the pupil."], ["Which type of neurone carries impulses to muscles?", "Motor neurone", "Sensory neurone", "Relay neurone", "Receptor neurone", "Motor neurones carry impulses to effectors."], ["What is a stimulus?", "A change in the environment that is detected", "A response by a muscle", "A type of hormone", "A nerve cell", "Receptors detect stimuli."], ["Which part of the eye refracts light the most?", "Cornea", "Lens", "Retina", "Iris", "The lens fine-tunes focusing."], ["What do the ciliary muscles do when looking at a distant object?", "Relax", "Contract", "Disappear", "Make the lens fatter", "The suspensory ligaments pull tight and the lens is thin."], ["What is the job of a relay neurone?", "Passes impulses from sensory to motor neurones in the CNS", "Detects stimuli", "Contracts muscles", "Makes hormones", "It is found in the spinal cord."], ["Which part of the eye has no light receptors and is called the blind spot?", "Where the optic nerve leaves", "The fovea", "The iris", "The lens", "No image is detected there."]], "7": [["Which hormone lowers blood glucose?", "Insulin", "Adrenaline", "Glucagon", "Testosterone", "Insulin from the pancreas causes the liver to convert glucose into glycogen."], ["Which gland makes adrenaline?", "Adrenal gland", "Pituitary gland", "Thyroid gland", "Pancreas", "Adrenaline prepares the body for fight or flight."], ["Which hormone is made by the testes?", "Testosterone", "Oestrogen", "Progesterone", "FSH", "Testosterone controls male secondary sexual characteristics."], ["Which gland produces insulin?", "Pancreas", "Pituitary", "Thyroid", "Adrenal", "The pancreas releases insulin when blood glucose is high."], ["Which gland is called the master gland?", "Pituitary gland", "Thyroid", "Adrenal gland", "Pancreas", "It controls other glands."], ["What does FSH do in women?", "Causes an egg to mature in the ovary", "Causes ovulation", "Thickens the uterus lining", "Lowers blood glucose", "It also stimulates oestrogen release."], ["Which hormone is released by the testes?", "Testosterone", "Oestrogen", "Insulin", "ADH", "It controls male puberty."], ["What happens when blood glucose is too low?", "Glucagon is released and glycogen is turned to glucose", "Insulin is released", "ADH is released", "Adrenaline is stopped", "This is negative feedback."], ["How do hormones reach target organs?", "In the blood", "Along nerves", "Through the air", "By osmosis only", "They travel all round the body."]], "8": [["What is homeostasis?", "Keeping internal conditions constant", "Growing taller", "Making new cells", "Removing undigested food", "Homeostasis keeps things like body temperature and water content steady."], ["Which part of the nephron filters the blood?", "Glomerulus / Bowman's capsule", "Loop of Henle", "Collecting duct", "Ureter", "Ultrafiltration happens from the glomerulus into the Bowman's capsule."], ["Which substance is fully reabsorbed by a healthy kidney?", "Glucose", "Urea", "Excess salts", "Excess water", "All glucose is selectively reabsorbed in the proximal convoluted tubule."], ["Which organ removes urea from the blood?", "Kidney", "Liver", "Lung", "Heart", "The kidney filters urea into urine."], ["Which organ excretes carbon dioxide?", "Lungs", "Kidneys", "Liver", "Skin", "Carbon dioxide is a waste product of respiration."], ["What is filtered out of the blood in the glomerulus?", "Water, glucose, urea and salts", "Red blood cells", "Proteins", "Platelets", "Large molecules stay in the blood."], ["What happens to blood vessels in the skin when it is cold?", "They narrow (vasoconstriction)", "They widen", "They burst", "Nothing happens", "Less heat is lost from the skin."], ["Where is ADH released from?", "Pituitary gland", "Kidney", "Liver", "Bladder", "The hypothalamus detects water levels."], ["What is excretion?", "Removal of waste made by metabolism", "Removal of undigested food", "Taking in food", "Breathing in oxygen", "Urea and carbon dioxide are excreted."]], "9": [["Where does fertilisation normally happen in humans?", "Oviduct", "Uterus", "Ovary", "Cervix", "The sperm meets the egg in the oviduct (fallopian tube)."], ["Which hormone keeps the uterus lining thick during pregnancy?", "Progesterone", "FSH", "Testosterone", "Adrenaline", "Progesterone maintains the uterus lining."], ["What is the job of the placenta?", "Exchange of substances between mother and fetus", "Producing sperm", "Producing milk", "Releasing eggs", "Oxygen and food pass to the fetus; CO₂ and urea pass back."], ["Which hormone causes ovulation?", "LH", "Oestrogen", "Insulin", "Testosterone", "A surge of LH from the pituitary triggers release of an egg."], ["Where does fertilisation occur in humans?", "Oviduct", "Uterus", "Vagina", "Ovary", "The sperm meets the egg in the oviduct."], ["Which structure carries sperm out of the penis?", "Urethra", "Ureter", "Sperm duct", "Prostate", "The urethra carries both urine and semen."], ["Which hormone is released by the ovary and builds up the uterus lining?", "Oestrogen", "Testosterone", "Insulin", "ADH", "Oestrogen repairs the uterus lining."], ["What is the function of the scrotum?", "Holds the testes outside the body to keep them cooler", "Makes sperm", "Stores urine", "Makes eggs", "Sperm develop best below body temperature."], ["What happens to the uterus lining during menstruation?", "It breaks down and is lost", "It thickens", "It releases an egg", "It makes hormones", "This is a period."], ["Which hormone keeps the uterus lining thick in pregnancy?", "Progesterone", "FSH", "Testosterone", "Insulin", "It is made by the ovary and placenta."], ["What is the function of the prostate gland?", "Adds fluid to sperm to make semen", "Makes sperm", "Stores urine", "Makes testosterone", "The fluid helps sperm swim."], ["Where does the fetus develop?", "Uterus", "Ovary", "Oviduct", "Cervix", "It is attached by the placenta."]], "10": [["What is the word equation for photosynthesis?", "carbon dioxide + water → glucose + oxygen", "glucose + oxygen → carbon dioxide + water", "glucose → starch", "oxygen + water → glucose", "Light energy is absorbed by chlorophyll to make glucose."], ["Where in the leaf does most photosynthesis happen?", "Palisade mesophyll", "Upper epidermis", "Xylem", "Guard cells only", "Palisade cells are packed with chloroplasts near the top of the leaf."], ["Which factor could limit the rate of photosynthesis?", "Light intensity", "Amount of oxygen", "Amount of glucose", "Number of roots", "Light intensity, CO₂ concentration and temperature can all be limiting factors."], ["What are the products of photosynthesis?", "Glucose and oxygen", "Carbon dioxide and water", "Starch and nitrogen", "Water and oxygen only", "Photosynthesis makes glucose and releases oxygen."], ["Which part of the leaf contains most chloroplasts?", "Palisade mesophyll", "Upper epidermis", "Spongy mesophyll", "Guard cells", "Palisade cells are packed with chloroplasts near the top."], ["Which gas is released during photosynthesis?", "Oxygen", "Carbon dioxide", "Nitrogen", "Methane", "It comes from splitting water."], ["Why do plants need nitrate ions?", "To make amino acids and proteins", "To make chlorophyll only", "To make starch", "To open stomata", "Lack of nitrate causes poor growth."], ["Why do plants need magnesium ions?", "To make chlorophyll", "To make proteins", "To make cellulose", "To absorb water", "Lack of magnesium causes yellow leaves."], ["Which cells in the leaf do most photosynthesis?", "Palisade mesophyll cells", "Guard cells", "Epidermis cells", "Xylem cells", "They are packed with chloroplasts."], ["What is the function of guard cells?", "Open and close the stomata", "Carry water", "Make food", "Protect the leaf from insects", "They control gas exchange."]], "11": [["Which tissue carries water from roots to leaves?", "Xylem", "Phloem", "Epidermis", "Cambium", "Xylem vessels carry water and mineral ions upwards."], ["What does phloem transport?", "Sucrose and amino acids", "Only water", "Oxygen", "Mineral ions only", "Translocation in phloem moves sugars and amino acids."], ["Which condition increases the rate of transpiration?", "Higher temperature", "Higher humidity", "Lower light", "No wind", "Warmer air gives water molecules more kinetic energy, so more evaporate."], ["How do root hair cells take in water?", "By osmosis", "By active transport only", "By photosynthesis", "Through stomata", "Water moves into root hair cells by osmosis; mineral ions often need active transport."], ["Which tissue carries water up a plant?", "Xylem", "Phloem", "Cambium", "Epidermis", "Xylem carries water and minerals upwards."], ["What is transpiration?", "Loss of water vapour from leaves", "Movement of sugar in phloem", "Uptake of minerals", "Making glucose", "It pulls water up the xylem."], ["How does humidity affect transpiration?", "High humidity slows it down", "High humidity speeds it up", "It has no effect", "It stops photosynthesis", "There is a smaller concentration gradient."], ["What do root hair cells do?", "Absorb water and mineral ions", "Photosynthesise", "Carry sugar", "Release oxygen", "They have a large surface area."], ["What is translocation?", "Movement of sucrose and amino acids in the phloem", "Loss of water from leaves", "Uptake of water by roots", "Opening of stomata", "It moves food both up and down."], ["How are mineral ions absorbed into root hairs?", "Active transport", "Osmosis", "Diffusion only", "Transpiration", "They are taken in against a gradient."]], "12": [["Which plant hormone controls tropisms?", "Auxin", "Insulin", "Adrenaline", "Glucagon", "Auxin causes cells to elongate."], ["Why is phototropism useful to a plant?", "Leaves get more light for photosynthesis", "It stops transpiration", "It makes flowers open", "It stores more starch in roots", "More light means more photosynthesis."], ["Which hormone controls plant growth responses?", "Auxin", "Insulin", "Adrenaline", "Oestrogen", "Auxin makes cells elongate."], ["What is a tropism?", "A growth response to a directional stimulus", "A type of hormone", "A plant disease", "A kind of leaf", "For example, phototropism."], ["What do roots show in response to gravity?", "Positive gravitropism", "Negative gravitropism", "Positive phototropism", "No response", "Roots grow downwards."], ["Where is auxin made in a shoot?", "The tip", "The roots", "The leaves only", "The flowers", "It moves down from the tip."], ["How do shoots respond to light?", "They grow towards it", "They grow away from it", "They stop growing", "They grow downwards", "This is positive phototropism."], ["What does auxin do in shoot cells?", "Makes them elongate", "Makes them divide by meiosis", "Kills them", "Makes them photosynthesise", "More elongation on the shaded side."]], "13": [["What does the ovule become after fertilisation?", "Seed", "Fruit", "Petal", "Anther", "The ovule becomes the seed and the ovary becomes the fruit."], ["Which conditions are needed for germination?", "Water, oxygen and a suitable temperature", "Light, soil and carbon dioxide", "Only sunlight", "Fertiliser and wind", "Seeds need water, oxygen and warmth to germinate."], ["Which part of a flower produces pollen?", "Anther", "Stigma", "Ovary", "Sepal", "Anthers make pollen grains."], ["What is pollination?", "Transfer of pollen from anther to stigma", "Fusion of male and female nuclei", "Growth of a seed", "Release of seeds", "Fertilisation follows pollination."], ["What does the ovule become after fertilisation?", "Seed", "Fruit", "Flower", "Leaf", "The ovary becomes the fruit."], ["What is asexual reproduction?", "Reproduction with one parent and no gametes", "Reproduction with two parents", "Fusion of gametes", "Pollination by insects", "Offspring are clones."], ["Which is an example of natural asexual reproduction in plants?", "Runners in strawberry plants", "Pollination by bees", "Seed dispersal by wind", "Fertilisation", "Runners grow new plants."], ["What do insect-pollinated flowers produce to attract insects?", "Nectar and scent", "Feathery stigmas", "Light pollen", "Large anthers outside", "Insects carry pollen between flowers."]], "14": [["Which organism is a producer?", "Grass", "Rabbit", "Fox", "Fungus", "Producers make their own food by photosynthesis."], ["Roughly what percentage of energy passes from one trophic level to the next?", "About 10%", "About 90%", "100%", "About 50%", "Most energy is lost as heat from respiration, in waste and uneaten parts."], ["Which process returns carbon dioxide to the air?", "Respiration", "Photosynthesis", "Transpiration", "Osmosis", "Respiration (and combustion) release CO₂."], ["What do we call an organism that makes its own food?", "Producer", "Consumer", "Decomposer", "Predator", "Producers photosynthesise."], ["Which gas is taken in by plants in the carbon cycle?", "Carbon dioxide", "Oxygen", "Methane", "Nitrogen", "Plants use CO2 for photosynthesis."], ["What is a habitat?", "The place where an organism lives", "All the organisms in an area", "The feeding position of an organism", "A food chain", "For example, a pond."], ["What is a community?", "All the populations of different species in an area", "One species in an area", "The non-living parts of an area", "A food chain", "It includes plants and animals."], ["What do decomposers do?", "Break down dead material and release nutrients", "Make food by photosynthesis", "Eat only plants", "Eat only animals", "Bacteria and fungi are decomposers."], ["What is a quadrat used for?", "Sampling the abundance of organisms", "Measuring temperature", "Catching insects", "Measuring pH", "Place quadrats randomly."], ["What does the nitrogen cycle return to the soil?", "Nitrates", "Oxygen", "Glucose", "Carbon dioxide", "Plants use nitrates to make proteins."]], "15": [["Which gas is a greenhouse gas released by cattle and rice fields?", "Methane", "Oxygen", "Nitrogen", "Argon", "Methane traps heat and adds to the greenhouse effect."], ["Which is a result of deforestation?", "More CO₂ in the atmosphere and loss of habitats", "More oxygen made", "Less soil erosion", "More rainfall always", "Fewer trees remove less CO₂ and burning or decay releases more."], ["Which gas is mainly responsible for global warming?", "Carbon dioxide", "Oxygen", "Nitrogen", "Argon", "Carbon dioxide traps heat."], ["What is eutrophication?", "Excess nutrients in water causing algae to grow and oxygen to fall", "Burning of forests", "Acid rain", "Global warming", "Fish may die from lack of oxygen."], ["What gas causes acid rain?", "Sulfur dioxide", "Oxygen", "Methane", "Argon", "It dissolves in rain to form acid."], ["How does deforestation increase carbon dioxide?", "Less photosynthesis and burning trees releases carbon dioxide", "More trees take in carbon dioxide", "Soil absorbs carbon dioxide", "It produces oxygen", "Fewer trees remove less carbon dioxide."], ["Why do farmers use fish farms?", "To produce fish without depleting wild stocks", "To kill all wild fish", "To increase pollution", "To grow plants", "Conditions are controlled."], ["What harmful gas comes from car exhausts and reduces oxygen in blood?", "Carbon monoxide", "Oxygen", "Nitrogen", "Water vapour", "It binds to haemoglobin."]], "16": [["How many chromosomes are in a normal human body cell?", "46 (23 pairs)", "23", "92", "44", "Body cells are diploid with 46 chromosomes."], ["What shape is a DNA molecule?", "Double helix", "Single straight strand", "Circle of protein", "Triangle", "DNA is two strands twisted into a double helix."], ["Which base pairs with adenine in DNA?", "Thymine", "Cytosine", "Guanine", "Uracil", "A pairs with T."], ["What is a nucleotide made of?", "A sugar, a phosphate and a base", "Amino acids", "Fatty acids and glycerol", "Glucose only", "Nucleotides join to form DNA."], ["Which base pairs with cytosine?", "Guanine", "Adenine", "Thymine", "Uracil", "C pairs with G."], ["How many bases code for one amino acid?", "Three", "One", "Two", "Four", "This is a triplet code."], ["What is a gene?", "A section of DNA that codes for a protein", "A whole chromosome", "A cell", "An amino acid", "Genes control characteristics."], ["What shape is a DNA molecule?", "Double helix", "Single straight strand", "Circle of protein", "Sphere", "Two strands twist together."]], "17": [["Which process is used to repair damaged skin?", "Mitosis", "Meiosis", "Fertilisation", "Mutation", "New identical cells replace damaged ones by mitosis."], ["Why does meiosis create variation?", "Chromosomes are shuffled and separated randomly", "It copies cells exactly", "It only happens in plants", "It uses no DNA", "Independent assortment and crossing over create new combinations."], ["How many chromosomes are in a human body cell?", "46", "23", "44", "92", "Humans have 23 pairs."], ["In which type of cell division are gametes made?", "Meiosis", "Mitosis", "Binary fission", "Budding", "Gametes are haploid."], ["How many chromosomes does a human cell have after mitosis?", "46", "23", "92", "12", "The number stays the same."], ["Why is meiosis important for variation?", "It produces genetically different gametes", "It makes clones", "It repairs tissues", "It doubles the chromosome number", "Each gamete is unique."], ["What is diploid?", "Having two sets of chromosomes", "Having one set of chromosomes", "Having no chromosomes", "Having three sets", "Body cells are diploid."], ["What happens to chromosomes before a cell divides?", "They are copied", "They are destroyed", "They join together", "They leave the nucleus", "Each chromosome becomes two copies."]], "18": [["A cross between Tt and Tt gives which ratio of dominant to recessive phenotypes?", "3 : 1", "1 : 1", "1 : 2 : 1 phenotypes", "all dominant", "TT, Tt, Tt show the dominant trait; tt shows the recessive trait."], ["A human male has which sex chromosomes?", "XY", "XX", "YY", "X only", "Females are XX; males are XY."], ["What is the chance a child is a boy?", "5
