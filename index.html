0%", "25%", "75%", "100%", "Half the sperm carry X and half carry Y."], ["Which sex chromosomes does a human female have?", "XX", "XY", "YY", "X", "Females have two X chromosomes."], ["A cross between Bb and Bb gives what ratio of dominant to recessive phenotype?", "3 : 1", "1 : 1", "1 : 3", "2 : 1", "Three dominant for one recessive."], ["What is a carrier of a genetic disease?", "Someone with one recessive allele who does not have the disease", "Someone with the disease", "Someone with no alleles", "Someone who is immune", "They can pass on the allele."], ["A cross Bb x Bb gives what ratio of phenotypes?", "3 dominant : 1 recessive", "1 : 1", "All dominant", "1 : 2", "One in four is bb."], ["What is codominance?", "Both alleles are expressed in the phenotype", "One allele hides the other", "No alleles are expressed", "Alleles change each generation", "For example, AB blood group."], ["What is a pedigree diagram used for?", "Showing how a characteristic is inherited in a family", "Showing a food chain", "Counting chromosomes", "Measuring variation", "Shaded shapes show affected people."], ["What is a heterozygous genotype?", "Two different alleles, such as Tt", "Two dominant alleles", "Two recessive alleles", "No alleles", "Tt shows the dominant feature."]], "19": [["Who proposed the theory of evolution by natural selection?", "Charles Darwin", "Gregor Mendel", "Louis Pasteur", "Isaac Newton", "Darwin proposed natural selection."], ["In natural selection, which individuals are more likely to reproduce?", "Those best adapted to their environment", "The largest only", "Those that mutate the most", "All individuals equally", "Better-adapted individuals survive and pass on their alleles."], ["Which increases the chance of a mutation?", "Ionising radiation", "Eating fruit", "Exercise", "Sleep", "Ionising radiation and some chemicals increase the mutation rate."], ["Who proposed the theory of evolution by natural selection?", "Charles Darwin", "Isaac Newton", "Gregor Mendel", "Louis Pasteur", "He published in 1859."], ["What gives some organisms a better chance of survival?", "Advantageous variations", "Being the largest", "Living alone", "Having no predators ever", "They pass on their alleles."], ["What is evolution?", "A change in the inherited characteristics of a population over time", "An individual changing during its life", "A type of reproduction", "A food chain", "It happens over many generations."], ["What provides evidence for evolution?", "Fossils", "Weather records", "Maps", "Seed counts", "Fossils show changes over time."], ["Why might a species become extinct?", "The environment changes faster than it can adapt", "It has too many offspring", "It evolves too fast", "It has too much food", "New predators or disease can also cause extinction."]], "20": [["Which is an example of selective breeding in plants?", "Wheat with higher yield", "Bacteria making insulin", "Bt maize", "Dolly the sheep", "Crops are bred for yield, disease resistance and so on."], ["Which of these is an example of selective breeding?", "Cows that produce more milk", "Insulin-producing bacteria", "Golden rice", "Dolly the sheep", "Dairy cows have been bred for milk yield."], ["What is the aim of selective breeding?", "Produce organisms with useful characteristics", "Make all organisms identical by cloning", "Kill weak organisms", "Increase mutations", "Breeders choose the parents."], ["Which is a problem with selective breeding?", "Inbreeding can cause health problems", "It is too fast", "It increases variation", "It needs genetic engineering", "A smaller gene pool reduces variety."], ["How long does selective breeding usually take?", "Many generations", "One day", "One generation", "A few minutes", "The best offspring are bred each time."], ["Which crop feature might be selectively bred?", "Resistance to disease", "More pests", "Lower yield", "Bitter taste", "Higher yield is also common."], ["What is the difference between selective breeding and natural selection?", "Humans choose the parents in selective breeding", "They are the same", "Natural selection is faster", "Selective breeding happens in the wild", "Nature selects in natural selection."]], "21": [["Which bacterium is used to make yoghurt?", "Lactobacillus", "Yeast", "Penicillium", "E. coli only", "Lactobacillus turns lactose into lactic acid."], ["Why is a fermenter kept at an optimum temperature?", "So enzymes in the microorganisms work best", "To kill the microorganisms", "To make oxygen", "To stop growth", "Too hot denatures enzymes; too cold slows growth."], ["Why must a fermenter be sterile (aseptic)?", "To stop other microorganisms contaminating the product", "To add more oxygen", "To make it cooler", "To make more ethanol", "Contaminating microbes compete or produce unwanted substances."], ["What makes bread dough rise?", "Carbon dioxide from yeast", "Oxygen from flour", "Lactic acid", "Steam only", "Yeast respires and the CO₂ bubbles make the dough rise."], ["Which microorganism is used to make yoghurt?", "Bacteria", "Yeast", "Virus", "Fungus", "Lactobacillus bacteria ferment lactose."], ["Why is a fermenter kept at constant temperature?", "Microorganisms work best at an optimum temperature", "Heat kills yeast", "To dissolve gas", "To save energy", "Enzymes in microorganisms have an optimum temperature."], ["What does yeast produce in anaerobic respiration?", "Ethanol and carbon dioxide", "Lactic acid", "Oxygen", "Starch", "This is used in brewing."], ["Why does bread dough rise?", "Carbon dioxide from yeast gets trapped", "Ethanol expands", "Oxygen is released", "Sugar melts", "Baking kills the yeast."], ["Which bacterium is used to make yoghurt?", "Lactobacillus", "Penicillium", "Yeast", "Salmonella", "It turns lactose into lactic acid."], ["Why is a fermenter sterilised before use?", "To prevent contamination by other microorganisms", "To speed up growth", "To add oxygen", "To cool it", "Unwanted microbes compete or spoil the product."], ["What is penicillin made by?", "A fungus called Penicillium", "A bacterium", "Yeast", "A virus", "It was the first antibiotic."]], "22": [["Which enzyme cuts DNA at specific sequences?", "Restriction enzyme", "Ligase", "Amylase", "Protease", "Restriction enzymes cut DNA leaving sticky ends."], ["Which enzyme joins DNA pieces together?", "DNA ligase", "Restriction enzyme", "Lipase", "Catalase", "Ligase joins the gene into the plasmid."], ["Which human product is made by GM bacteria?", "Insulin", "Bile", "Haemoglobin", "Adrenaline", "The human insulin gene is put into bacteria, which make insulin."], ["Which enzyme cuts DNA at a specific site?", "Restriction enzyme", "Ligase", "Amylase", "Protease", "Restriction enzymes cut DNA."], ["Which enzyme joins DNA pieces together?", "Ligase", "Restriction enzyme", "Lipase", "Catalase", "DNA ligase joins sticky ends."], ["What is a plasmid?", "A small ring of DNA in bacteria", "A type of enzyme", "A virus coat", "A chromosome in humans", "Plasmids are used as vectors."], ["What does DNA ligase do?", "Joins pieces of DNA together", "Cuts DNA", "Copies proteins", "Digests fats", "It seals the gene into the plasmid."], ["What is a transgenic organism?", "One containing a gene from another species", "A clone", "A hybrid", "A wild organism", "For example, bacteria making human insulin."], ["What is cloning?", "Making genetically identical copies", "Breeding two species together", "Inserting a gene", "Selecting the best parents", "Dolly the sheep was a clone."], ["Why are GM crops made resistant to herbicides?", "Farmers can kill weeds without harming the crop", "To make them taste better", "To slow their growth", "To make them smaller", "Yield increases."]]}, "chemistry": {"1": [["In which state are particles close together but able to move past each other?", "Liquid", "Solid", "Gas", "Plasma", "Liquid particles touch but can slide over one another."], ["What is the change from gas to liquid called?", "Condensation", "Evaporation", "Sublimation", "Melting", "Gas cools and condenses into a liquid."], ["Which change of state is called sublimation?", "Solid to gas", "Liquid to gas", "Gas to liquid", "Solid to liquid", "Sublimation skips the liquid state."], ["Which state of matter has particles that are far apart and move randomly?", "Gas", "Liquid", "Solid", "Crystal", "Gas particles have weak forces between them."], ["Which technique separates coloured dyes in ink?", "Chromatography", "Filtration", "Distillation", "Evaporation", "Different dyes travel different distances."], ["What is the name for a solid turning straight into a gas?", "Sublimation", "Evaporation", "Condensation", "Melting", "Iodine and dry ice sublime."], ["Which state of matter has particles with the most energy?", "Gas", "Liquid", "Solid", "All the same", "Gas particles move fastest."], ["What happens to particles when a solid melts?", "They gain energy and break free from fixed positions", "They lose energy", "They stop moving", "They get bigger", "Forces between particles are overcome."]], "2": [["Which method separates an insoluble solid from a liquid?", "Filtration", "Crystallisation", "Chromatography", "Simple distillation", "The solid is trapped as a residue on the filter paper."], ["Which method separates the dyes in ink?", "Paper chromatography", "Filtration", "Fractional distillation", "Decanting", "Different dyes travel different distances up the paper."], ["How is an Rf value calculated?", "distance moved by spot ÷ distance moved by solvent", "distance moved by solvent ÷ distance moved by spot", "spot distance × solvent distance", "solvent distance − spot distance", "Rf is always between 0 and 1."], ["Which is a compound?", "Water", "Oxygen", "Iron", "Air", "Water is two elements chemically joined; air is a mixture."], ["Which method separates a liquid from a solution of a dissolved solid?", "Simple distillation", "Filtration", "Chromatography", "Decanting", "The liquid evaporates and is condensed."], ["Which is a compound?", "Water", "Oxygen", "Air", "Brass", "Water is H2O, chemically bonded."], ["Which method separates two miscible liquids with different boiling points?", "Fractional distillation", "Filtration", "Crystallisation", "Decanting", "Fractional distillation separates by boiling point."], ["What is a pure substance?", "A single element or compound with nothing mixed in", "A mixture of two compounds", "Any liquid", "Salt water", "Pure substances have a sharp melting point."], ["How does an impurity affect a melting point?", "It lowers it and makes it melt over a range", "It raises it sharply", "It has no effect", "It stops melting", "Pure substances melt at one temperature."], ["What is the Rf value in chromatography?", "Distance moved by the spot divided by distance moved by the solvent", "Distance moved by the solvent only", "The number of spots", "The time taken", "Rf is always less than 1."]], "3": [["What is the relative charge of a neutron?", "0", "+1", "−1", "+2", "Neutrons are neutral: relative charge 0 (protons +1, electrons −1)."], ["Where is most of the mass of an atom?", "In the nucleus", "In the electron shells", "Spread evenly through the atom", "In the empty space", "Protons and neutrons are in the nucleus and are much heavier than electrons."], ["Which is the best description of a molecule?", "Two or more atoms chemically bonded together", "The smallest piece of an element", "A single atom with a charge", "A mixture of different atoms", "A molecule is two or more atoms joined by covalent bonds, e.g. H₂ or H₂O."], ["What is the relative mass of an electron?", "1/1836 (about 0.0005)", "1", "0", "1836", "An electron is about 1836 times lighter than a proton or neutron."], ["How many neutrons are in an atom of cobalt-59 (atomic number 27)?", "32", "27", "59", "86", "Neutrons = mass number − atomic number = 59 − 27 = 32."], ["Uranium is shown with the numbers 238 and 92. How many electrons does one uranium atom have?", "92", "146", "238", "330", "Electrons = protons = atomic number (the smaller number) = 92."], ["Why does an atom have the same number of electrons as protons?", "Atoms are electrically neutral, so the +1 and −1 charges cancel", "Electrons and protons have the same mass", "Electrons are made from protons", "Each proton holds one electron in the nucleus", "An atom has no overall charge, so the number of electrons equals the number of protons."], ["Why do carbon-12 and carbon-14 have the same chemical reactions?", "They have the same number and arrangement of electrons", "They have the same number of neutrons", "They have the same mass number", "Neutrons control chemical reactions", "Chemical properties depend on electrons; isotopes have identical electrons."], ["Which statement about chlorine-35 and chlorine-37 is correct?", "Both have 17 protons; Cl-37 has 2 more neutrons", "Cl-37 has 2 more protons than Cl-35", "Cl-37 has 2 more electrons than Cl-35", "They are atoms of different elements", "Both have atomic number 17; Cl-35 has 18 neutrons and Cl-37 has 20."], ["Boron is 20% boron-10 and 80% boron-11. What is its relative atomic mass?", "10.8", "10.5", "10.2", "21", "Aᵣ = (20 × 10 + 80 × 11) ÷ 100 = 1080 ÷ 100 = 10.8."], ["Chlorine is 75% chlorine-35 and 25% chlorine-37. What is its Aᵣ?", "35.5", "36.0", "36.5", "35.0", "Aᵣ = (75 × 35 + 25 × 37) ÷ 100 = 3550 ÷ 100 = 35.5 — nearest the commoner isotope."], ["Why can 35.5 not be the mass number of a chlorine atom?", "It would mean 18.5 neutrons, and you can’t have part of a neutron", "Chlorine has no neutrons", "Mass numbers are always smaller than atomic numbers", "35.5 is the number of electrons", "35.5 is Aᵣ, an average of Cl-35 and Cl-37; a mass number must be a whole number."], ["What is the charge on a neutron?", "0", "+1", "-1", "+2", "Neutrons are neutral."], ["How many electrons does a Na+ ion (atomic number 11) have?", "10", "11", "12", "9", "It has lost one electron."], ["What is the atomic number?", "The number of protons in an atom", "The number of neutrons", "Protons plus neutrons", "The number of shells", "It identifies the element."], ["What are isotopes?", "Atoms of the same element with different numbers of neutrons", "Atoms with different numbers of protons", "Ions with different charges", "Molecules of two elements", "Carbon-12 and carbon-14 are isotopes."], ["How many electrons can the first shell hold?", "2", "8", "18", "1", "The second shell holds up to 8."]], "4": [["Which group contains the noble gases?", "Group 0", "Group 1", "Group 7", "Group 2", "Group 0 (or 8) is the noble gases."], ["Which block of the Periodic Table contains iron and copper?", "Transition metals", "Alkali metals", "Halogens", "Noble gases", "They are transition elements."], ["How is the Periodic Table arranged?", "In order of atomic number", "In order of mass only", "Alphabetically", "By colour", "Elements in a group have similar properties."], ["What are the elements in Group 0 called?", "Noble gases", "Halogens", "Alkali metals", "Transition metals", "They are very unreactive."], ["Which side of the Periodic Table are metals found on?", "Left and centre", "Right only", "Top only", "Bottom row only", "Non-metals are on the right."]], "5": [["What is the relative formula mass (Mr) of CO₂? (C = 12, O = 16)", "44", "28", "32", "40", "12 + 2 × 16 = 44."], ["How many moles are in 36 g of water? (Mr = 18)", "2", "0.5", "18", "648", "moles = mass ÷ Mr = 36 ÷ 18 = 2."], ["Which is the balanced equation?", "2H₂ + O₂ → 2H₂O", "H₂ + O₂ → H₂O", "H₂ + O₂ → 2H₂O", "2H₂ + 2O₂ → H₂O", "4 H and 2 O on each side."], ["What is the formula of sodium sulfate?", "Na2SO4", "NaSO4", "Na2S", "NaSO3", "Sodium is 1+ and sulfate is 2-."], ["What is the relative formula mass of H2O? (H = 1, O = 16)", "18", "17", "16", "20", "2 + 16 = 18."], ["Which type of equation shows state symbols?", "Balanced symbol equation", "Word equation", "Ionic only", "Formula", "Symbols (s), (l), (g), (aq) are added."], ["What is the relative formula mass of ammonia, NH3? (N = 14, H = 1)", "17", "15", "18", "42", "14 + 3 x 1 = 17."], ["What is the formula of sodium sulfate?", "Na2SO4", "NaSO4", "Na(SO4)2", "Na2S", "Sodium is 1+ and sulfate is 2-."], ["What does the state symbol (aq) mean?", "Dissolved in water", "Solid", "Gas", "Liquid", "aq stands for aqueous."]], "6": [["What volume does 1 mole of any gas occupy at room temperature and pressure?", "24 dm³", "22.4 cm³", "1 dm³", "100 dm³", "Molar volume at rtp = 24 dm³ (24 000 cm³)."], ["How many moles of solute are in 250 cm³ of 2 mol/dm³ solution?", "0.5", "500", "8", "0.125", "moles = concentration × volume in dm³ = 2 × 0.25."], ["How many moles of gas are in 48 dm³ at rtp?", "2", "0.5", "24", "1152", "48 ÷ 24 = 2 mol."], ["How many moles are in 36 g of water? (Mr = 18)", "2", "1", "3", "0.5", "36 / 18 = 2."], ["What is the concentration if 20 g of solute is in 2 dm3?", "10 g/dm3", "40 g/dm3", "2 g/dm3", "22 g/dm3", "20 / 2 = 10."], ["What is the volume of 1 mole of any gas at room temperature and pressure?", "24 dm3", "22.4 dm3", "12 dm3", "1 dm3", "24 dm3 at rtp."], ["What is the empirical formula?", "The simplest whole number ratio of atoms in a compound", "The actual number of atoms", "The mass of a compound", "The formula of an ion", "For example, CH2 for ethene C2H4."], ["What is the volume of one mole of any gas at room temperature and pressure?", "24 dm3", "22 dm3", "1 dm3", "100 dm3", "This is the molar volume."], ["How many moles are in 32 g of oxygen gas, O2? (O = 16)", "1 mol", "2 mol", "0.5 mol", "16 mol", "Mr of O2 is 32."]], "7": [["Why do ionic compounds have high melting points?", "Strong electrostatic attractions between oppositely charged ions in a giant lattice", "Weak forces between molecules", "They contain metal atoms", "They have delocalised electrons", "Lots of energy is needed to overcome strong ionic bonds."], ["What is the formula of magnesium oxide?", "MgO", "MgO₂", "Mg₂O", "Mg₂O₃", "Mg²⁺ and O²⁻ balance 1 : 1."], ["Which particles are transferred in ionic bonding?", "Electrons", "Protons", "Neutrons", "Molecules", "Metal atoms lose electrons."], ["Which substance has a high melting point and conducts when molten?", "Sodium chloride", "Methane", "Diamond", "Iodine", "Ionic compounds conduct when molten."], ["What charge does a chloride ion have?", "1-", "1+", "2-", "2+", "Chlorine gains one electron."], ["What is an ion?", "A charged particle made when an atom gains or loses electrons", "A neutral atom", "A molecule of two non-metals", "A neutron", "Metals form positive ions."], ["What charge does an oxide ion have?", "2-", "1-", "1+", "2+", "Oxygen gains two electrons."], ["What is the formula of magnesium oxide?", "MgO", "Mg2O", "MgO2", "Mg2O3", "Mg2+ and O2- balance one to one."]], "8": [["Why do simple molecular substances have low boiling points?", "Weak intermolecular forces", "Weak covalent bonds", "They are ionic", "They have no electrons", "Only weak forces between molecules need to be overcome; the covalent bonds stay intact."], ["Why does graphite conduct electricity?", "It has delocalised electrons between layers", "It has free ions", "It is a metal", "It is made of molecules", "Each carbon bonds to 3 others, leaving one delocalised electron."], ["How many covalent bonds are in a molecule of methane, CH₄?", "4", "1", "2", "8", "Carbon shares one pair with each of four hydrogens."], ["What is a covalent bond?", "A shared pair of electrons", "A transfer of electrons", "An attraction between ions", "A metal bond", "Covalent bonds share electrons."], ["Why does graphite conduct electricity?", "It has delocalised electrons", "It has ions", "It has free protons", "It is a metal", "Each carbon is bonded to three others leaving a free electron."], ["Why does a simple molecular substance have a low boiling point?", "Weak intermolecular forces", "Strong covalent bonds", "Free electrons", "Strong ionic bonds", "Little energy is needed to separate molecules."], ["What type of bonding is found in water?", "Covalent", "Ionic", "Metallic", "No bonding", "Hydrogen and oxygen share electrons."], ["Why does graphite conduct electricity?", "It has delocalised electrons between layers", "It has ions that move", "It is a metal", "It has free protons", "Each carbon makes only three bonds."], ["How many covalent bonds does carbon usually form?", "Four", "Two", "Three", "One", "Carbon has four outer electrons."]], "9": [["Why are metals malleable?", "Layers of ions can slide over each other", "They have strong covalent bonds", "They contain no electrons", "They are brittle", "The delocalised electrons hold the layers together as they slide."], ["Why do metals conduct electricity?", "Delocalised electrons can move through the structure", "Ions move freely", "They are magnetic", "They are shiny", "The free electrons carry the charge."], ["Which property is typical of metals?", "Good thermal conductor", "Brittle", "Dull surface", "Electrical insulator", "Delocalised electrons transfer heat energy well."], ["Why are metals malleable?", "Layers of atoms can slide", "Strong covalent bonds", "Weak ionic bonds", "They are brittle", "Layers slide over each other."], ["What is in a metallic bond?", "Positive ions in a sea of delocalised electrons", "Shared electron pairs", "Negative ions", "Neutral molecules", "This explains conduction."], ["What is an alloy?", "A mixture of a metal with other elements", "A pure metal", "A compound", "A polymer", "Alloys are harder than pure metals."], ["What holds a metal together?", "Attraction between positive ions and delocalised electrons", "Shared pairs of electrons", "Attraction between oppositely charged ions", "Weak forces between molecules", "This is metallic bonding."], ["Why do metals have high melting points?", "Strong metallic bonds need a lot of energy to break", "They have weak forces", "They are made of molecules", "They contain no electrons", "The lattice is held strongly."], ["What is steel?", "An alloy of iron with carbon", "A pure element", "A compound of iron and oxygen", "A non-metal", "Carbon makes it harder."]], "10": [["What forms at the cathode when molten lead(II) bromide is electrolysed?", "Lead", "Bromine", "Hydrogen", "Oxygen", "Pb²⁺ ions gain electrons to form lead."], ["Why must an ionic compound be molten or dissolved for electrolysis?", "So the ions are free to move", "To make it cooler", "So electrons can be shared", "To add oxygen", "Ions in a solid lattice cannot move to the electrodes."], ["At the cathode in electrolysis of molten lead bromide, which forms?", "Lead", "Bromine", "Oxygen", "Hydrogen", "Positive ions are reduced at the cathode."], ["Which electrode is the anode?", "Positive", "Negative", "Neutral", "Carbon only", "The anode is positive."], ["Which gas forms at the anode when concentrated sodium chloride solution is electrolysed?", "Chlorine", "Hydrogen", "Oxygen", "Sodium", "Chloride ions are oxidised."], ["What is the cathode?", "The negative electrode", "The positive electrode", "The electrolyte", "The power supply", "Positive ions move to the cathode."], ["What is formed at the anode when dilute sulfuric acid is electrolysed?", "Oxygen", "Hydrogen", "Sulfur", "Water", "Hydroxide ions are discharged."], ["What is reduction in terms of electrons?", "Gain of electrons", "Loss of electrons", "Gain of protons", "Loss of neutrons", "OIL RIG: reduction is gain."]], "11": [["Why are alkali metals stored under oil?", "To stop them reacting with air and water", "To keep them warm", "To make them shiny", "To dissolve them", "They react quickly with oxygen and moisture."], ["What colour does universal indicator turn in the solution after potassium reacts with water?", "Purple (alkaline)", "Red", "Green", "Orange", "The solution contains KOH, a strong alkali."], ["Which gas is formed when sodium reacts with water?", "Hydrogen", "Oxygen", "Carbon dioxide", "Chlorine", "Hydrogen and sodium hydroxide form."], ["Why are alkali metals stored under oil?", "They react with air and water", "They are heavy", "They are toxic", "They melt", "They are very reactive."], ["Which alkali metal is most reactive?", "Potassium", "Lithium", "Sodium", "All same", "Reactivity increases down the group."], ["What colour flame does lithium give?", "Red", "Lilac", "Yellow", "Green", "Sodium is yellow and potassium lilac."], ["What is formed when potassium reacts with water?", "Potassium hydroxide and hydrogen", "Potassium oxide and oxygen", "Potassium chloride", "Potassium carbonate", "The solution is alkaline."], ["Why are alkali metals called alkali metals?", "They form alkaline solutions with water", "They are acidic", "They are found in salt", "They are unreactive", "Their hydroxides are alkalis."]], "12": [["Which halogen is a dark grey solid at room temperature?", "Iodine", "Chlorine", "Bromine", "Fluorine", "Chlorine is a pale green gas, bromine a red-brown liquid, iodine a dark grey solid."], ["What is the test for chlorine?", "It bleaches damp blue litmus paper (turns it red first)", "It pops with a lighted splint", "It turns limewater milky", "It relights a glowing splint", "Chlorine bleaches damp litmus paper."], ["What colour is chlorine gas?", "Pale green", "Brown", "Purple", "Colourless", "Chlorine is pale green."], ["Which halogen is a solid at room temperature?", "Iodine", "Chlorine", "Bromine", "Fluorine", "Iodine is a grey-black solid."], ["Which halide ion would chlorine displace?", "Bromide", "Fluoride", "Chloride", "Astatide only", "Chlorine is more reactive than bromine."], ["What is the colour of iodine solution?", "Brown", "Green", "Colourless", "Blue", "Solid iodine is grey-black."], ["Which halogen is the most reactive?", "Fluorine", "Chlorine", "Bromine", "Iodine", "Reactivity decreases down the group."], ["What do halogens form when they react with metals?", "Salts called halides", "Acids", "Alkalis", "Alloys", "For example, sodium chloride."]], "13": [["About what percentage of air is oxygen?", "21%", "78%", "1%", "50%", "Air is about 78% nitrogen, 21% oxygen, about 1% argon."], ["Which gas relights a glowing splint?", "Oxygen", "Hydrogen", "Carbon dioxide", "Nitrogen", "Oxygen supports combustion."], ["What percentage of dry air is oxygen?", "21%", "78%", "1%", "50%", "Oxygen is about one fifth."], ["Which gas makes up most of the air?", "Nitrogen", "Oxygen", "Argon", "Carbon dioxide", "About 78% is nitrogen."], ["Which pollutant causes acid rain?", "Sulfur dioxide", "Oxygen", "Nitrogen", "Argon", "SO2 dissolves to form acids."], ["Which gas makes up about 21 % of dry air?", "Oxygen", "Nitrogen", "Carbon dioxide", "Argon", "Nitrogen is about 78 %."], ["What is produced when magnesium burns in oxygen?", "Magnesium oxide", "Magnesium hydroxide", "Magnesium carbonate", "Hydrogen", "It burns with a bright white flame."], ["What type of oxide do non-metals usually form?", "Acidic oxides", "Basic oxides", "Neutral salts", "Alkalis", "For example, sulfur dioxide."]], "14": [["Which metal is most reactive?", "Potassium", "Magnesium", "Copper", "Gold", "Potassium is near the top of the reactivity series."], ["Which metal is more reactive than zinc?", "Magnesium", "Copper", "Silver", "Gold", "Magnesium is above zinc."], ["Which metal does not react with dilute acid?", "Copper", "Zinc", "Iron", "Magnesium", "Copper is below hydrogen."], ["What happens when iron is placed in copper sulfate solution?", "Copper forms", "Nothing", "Gas forms", "Iron dissolves slowly with no change", "Iron displaces copper."], ["Which metal is more reactive than iron?", "Zinc", "Copper", "Silver", "Gold", "Zinc can displace iron from its salts."], ["What is oxidation in terms of oxygen?", "Gain of oxygen", "Loss of oxygen", "Gain of hydrogen", "Loss of electrons only", "Burning is oxidation."], ["What is a redox reaction?", "One where oxidation and reduction happen together", "Only oxidation", "Only reduction", "A neutralisation", "Displacement reactions are redox."]], "15": [["Why is aluminium used for aircraft?", "Low density and resistant to corrosion", "It is magnetic", "It is very heavy", "It is the cheapest metal", "Strong but light, and the oxide layer protects it."], ["Which method extracts aluminium?", "Electrolysis", "Heating with carbon", "Using hydrogen", "Filtration", "Aluminium is too reactive for carbon."], ["Which gas is used to reduce iron oxide in the blast furnace?", "Carbon monoxide", "Oxygen", "Nitrogen", "Hydrogen only", "CO acts as the reducing agent."], ["Why is gold found native?", "It is unreactive", "It is dense", "It is rare", "It is shiny", "It does not form compounds."], ["Which metal is extracted by heating its oxide with carbon?", "Iron", "Aluminium", "Sodium", "Potassium", "Iron is less reactive than carbon."], ["What is the main ore of aluminium?", "Bauxite", "Haematite", "Limestone", "Malachite", "It contains aluminium oxide."], ["Why is copper used for electrical wires?", "It is a good conductor and can be drawn into wires", "It is very hard", "It is magnetic", "It is cheap and brittle", "Copper is ductile."]], "16": [["Acids produce which ions in water?", "H⁺", "OH⁻", "Na⁺", "Cl⁻", "Acids are proton (H⁺) donors."], ["Which piece of apparatus delivers the acid during a titration?", "Burette", "Measuring cylinder", "Beaker", "Test tube", "A burette measures the exact volume added."], ["What is the pH of a strong acid?", "1", "7", "10", "14", "Strong acids have low pH."], ["Which colour does universal indicator turn in an alkali?", "Purple", "Red", "Green", "Yellow", "High pH is purple."], ["Which piece of apparatus delivers an accurate volume in a titration?", "Burette", "Beaker", "Conical flask", "Measuring cylinder", "A burette is calibrated."], ["What colour is universal indicator in a strong acid?", "Red", "Green", "Purple", "Blue", "Neutral is green."], ["What ions do acids release in water?", "Hydrogen ions (H+)", "Hydroxide ions (OH-)", "Sodium ions", "Chloride ions only", "Alkalis release OH- ions."], ["What is the ionic equation for neutralisation?", "H+ + OH- gives H2O", "Na+ + Cl- gives NaCl", "H2 + O2 gives H2O", "H+ + Cl- gives HCl", "Water is formed."]], "17": [["Which salt is made from sulfuric acid?", "A sulfate", "A chloride", "A nitrate", "A carbonate", "Sulfuric acid → sulfates; hydrochloric → chlorides; nitric → nitrates."], ["Which of these is insoluble in water?", "Barium sulfate", "Sodium chloride", "Potassium nitrate", "Ammonium chloride", "All sodium, potassium, ammonium salts and nitrates are soluble."], ["What is made when an acid reacts with a base?", "Salt and water", "Salt and hydrogen", "Acid and water", "Carbon dioxide", "It is neutralisation."], ["Which salt forms when sulfuric acid reacts with copper oxide?", "Copper sulfate", "Copper chloride", "Copper nitrate", "Copper carbonate", "Sulfates come from sulfuric acid."], ["How is an insoluble salt made?", "Precipitation", "Crystallisation", "Titration", "Distillation", "Mix two solutions to make a precipitate."], ["What salt is made from hydrochloric acid and sodium hydroxide?", "Sodium chloride", "Sodium sulfate", "Sodium nitrate", "Sodium carbonate", "Hydrochloric acid gives chlorides."], ["Which acid makes nitrate salts?", "Nitric acid", "Sulfuric acid", "Hydrochloric acid", "Ethanoic acid", "For example, potassium nitrate."], ["Which of these is insoluble in water?", "Barium sulfate", "Sodium chloride", "Potassium nitrate", "Ammonium chloride", "All sodium, potassium and ammonium salts are soluble."]], "18": [["Which flame colour shows sodium ions?", "Yellow", "Lilac", "Red", "Blue-green", "Na⁺ gives an intense yellow flame."], ["What is the test for carbon dioxide?", "Limewater turns cloudy", "Glowing splint relights", "Squeaky pop", "Bleaches litmus", "Limewater is calcium hydroxide."], ["Which flame colour is sodium?", "Yellow", "Lilac", "Red", "Green", "Sodium is yellow."], ["What is the test for chloride ions?", "Silver nitrate gives a white precipitate", "Barium chloride", "Limewater", "Litmus", "Add acidified silver nitrate."], ["What colour precipitate does copper(II) ions give with sodium hydroxide?", "Blue", "Green", "Brown", "White", "Iron(II) gives green and iron(III) brown."], ["What is the test for sulfate ions?", "Add hydrochloric acid then barium chloride: white precipitate", "Add silver nitrate: cream precipitate", "Flame test: yellow", "Add limewater: milky", "Barium sulfate is insoluble."], ["What is the test for water?", "Turns anhydrous copper sulfate from white to blue", "Turns limewater milky", "Relights a glowing splint", "Gives a squeaky pop", "Cobalt chloride paper also turns pink."]], "19": [["Which process is endothermic?", "Thermal decomposition", "Combustion", "Neutralisation", "Respiration", "It takes in heat."], ["What is activation energy?", "The minimum energy needed for a reaction to happen", "The energy released", "The energy of the products", "The total energy of the reactants", "A catalyst lowers it."], ["Is bond breaking endothermic or exothermic?", "Endothermic", "Exothermic", "Neither", "Both", "Energy is needed to break bonds."], ["What happens to the temperature in an endothermic reaction?", "It falls", "It rises", "It stays the same", "It doubles", "Energy is taken from the surroundings."]], "20": [["How could you measure the rate of a reaction that makes a gas?", "Collect the gas in a gas syringe over time", "Use a burette", "Measure pH only", "Use a thermometer only", "Volume of gas against time gives the rate."], ["Which change increases the rate of reaction?", "Increasing temperature", "Decreasing concentration", "Using larger lumps", "Lowering pressure", "Particles collide more often and harder."], ["Which gas can be collected over water to measure rate?", "Hydrogen", "Ammonia", "HCl", "Sulfur dioxide", "Hydrogen is insoluble."], ["Why does a powder react faster than a lump?", "It has a larger surface area", "It has more mass", "It is hotter", "It has fewer particles", "More particles are exposed."], ["What happens to the rate as a reaction proceeds?", "It slows down", "It speeds up", "It stays constant", "It stops at once", "Reactants are used up."], ["What is a catalyst?", "A substance that speeds up a reaction without being used up", "A reactant", "A product", "An inhibitor", "It lowers the activation energy."]], "21": [["What is the catalyst in the Haber process?", "Iron", "Nickel", "Platinum", "Vanadium", "Iron speeds up ammonia formation."], ["What happens to equilibrium if pressure is increased in the Haber process?", "More ammonia forms", "Less ammonia forms", "No change", "It stops", "Fewer gas molecules are on the right."], ["What symbol shows a reversible reaction?", "Two half-arrows pointing in opposite directions", "A single arrow", "An equals sign", "A plus sign", "Products can turn back into reactants."], ["What happens when blue hydrated copper sulfate is heated?", "It turns white as water is driven off", "It turns red", "It melts", "Nothing happens", "Adding water turns it blue again."], ["What is the effect of a catalyst on the position of equilibrium?", "No effect", "Shifts it right", "Shifts it left", "Removes it", "It only speeds up reaching equilibrium."]], "22": [["What is the general formula of the alkanes?", "CₙH₂ₙ₊₂", "CₙH₂ₙ", "CₙH₂ₙ₋₂", "CₙH₂ₙ₊₁OH", "e.g. methane CH₄, ethane C₂H₆."], ["What is the general formula of the alkanes?", "CnH2n+2", "CnH2n", "CnH2n-2", "CnHn", "Alkanes are saturated."], ["Which functional group is in alcohols?", "-OH", "-COOH", "C=C", "-CHO", "Alcohols contain a hydroxyl group."], ["What is a hydrocarbon?", "A compound of only hydrogen and carbon", "Any carbon compound", "A compound with oxygen", "A polymer", "Hydrocarbons contain just C and H."], ["What is a functional group?", "The part of a molecule that gives its typical reactions", "The longest carbon chain", "A type of isomer", "A metal ion", "For example, C=C in alkenes."], ["What are structural isomers?", "Compounds with the same molecular formula but different structures", "Compounds with different formulas", "Isotopes", "Compounds with the same structure", "Butane and methylpropane are isomers."], ["Which homologous series has the general formula CnH2n+2?", "Alkanes", "Alkenes", "Alcohols", "Carboxylic acids", "Methane is the first alkane."]], "23": [["Which fraction has the highest boiling point?", "Bitumen", "Petrol", "Kerosene", "Refinery gas", "Large molecules have high boiling points."], ["Which fraction is used as fuel for aircraft?", "Kerosene", "Diesel", "Bitumen", "Petrol", "Kerosene is jet fuel."], ["Which fraction of crude oil has the lowest boiling point?", "Refinery gases", "Bitumen", "Fuel oil", "Diesel", "Small molecules boil at low temperatures."], ["What is a fuel?", "A substance that releases energy when burned", "A catalyst", "A type of polymer", "An alkali", "Most fuels are hydrocarbons."], ["Which fraction is used for jet fuel?", "Kerosene", "Bitumen", "Petrol", "Refinery gases", "It is also called paraffin."]], "24": [["What is the formula of ethane?", "C₂H₆", "C₂H₄", "CH₄", "C₃H₈", "CₙH₂ₙ₊₂ with n = 2."], ["Which hydrocarbon would NOT decolourise bromine water in the dark?", "Ethane", "Ethene", "Propene", "Butene", "Alkanes have no C=C bond, so bromine water stays orange."], ["Which gas is formed in the complete combustion of methane?", "Carbon dioxide", "Carbon monoxide", "Methane", "Hydrogen", "CH4 + 2O2 gives CO2 + 2H2O."], ["Which gas is poisonous and made in incomplete combustion?", "Carbon monoxide", "Carbon dioxide", "Water vapour", "Oxygen", "CO binds to haemoglobin."], ["What is the formula of ethane?", "C2H6", "C2H4", "CH4", "C3H8", "It has 2 carbons."], ["Why are alkanes described as saturated?", "They have only single carbon-carbon bonds", "They have double bonds", "They contain oxygen", "They are soluble in water", "They cannot undergo addition reactions."], ["What is the formula of ethane?", "C2H6", "C2H4", "CH4", "C3H8", "It fits CnH2n+2."], ["What is produced by the incomplete combustion of alkanes?", "Carbon monoxide and soot", "Only carbon dioxide", "Hydrogen", "Oxygen", "There is not enough oxygen."]], "25": [["What is the general formula of the alkenes?", "CₙH₂ₙ", "CₙH₂ₙ₊₂", "CₙH₂ₙ₊₁", "CₙHₙ", "e.g. ethene C₂H₄."], ["What is the general formula of alkenes?", "CnH2n", "CnH2n+2", "CnH2n-2", "CnH", "Alkenes have a double bond."], ["Which reagent distinguishes alkenes from alkanes?", "Bromine water", "Limewater", "Litmus", "Universal indicator", "Alkenes decolourise bromine water."], ["What is made when ethene reacts with steam?", "Ethanol", "Ethane", "Ethanoic acid", "Ethyne", "Hydration forms an alcohol."], ["What is the formula of ethene?", "C2H4", "C2H6", "CH4", "C2H2", "It has a C=C double bond."], ["What type of reaction happens when ethene reacts with bromine?", "Addition", "Substitution", "Combustion", "Neutralisation", "The double bond opens."], ["Why are alkenes more reactive than alkanes?", "They have a carbon-carbon double bond", "They are bigger", "They contain oxygen", "They are gases", "The double bond can open up."]], "26": [["What is the functional group of the alcohols?", "–OH", "–COOH", "C=C", "–COO–", "e.g. ethanol C₂H₅OH."], ["What is the product of fermentation of glucose?", "Ethanol", "Methanol", "Ethene", "Ethanoic acid", "Yeast makes ethanol and CO2."], ["What is formed by oxidising ethanol with an oxidising agent?", "Ethanoic acid", "Ethene", "Ethane", "Methanol", "Oxidation gives a carboxylic acid."], ["What is the formula of methanol?", "CH3OH", "C2H5OH", "CH4", "HCOOH", "Methanol has one carbon."], ["What is the functional group of alcohols?", "-OH", "-COOH", "C=C", "-COO-", "Ethanol is CH3CH2OH."], ["What is ethanol oxidised to?", "Ethanoic acid", "Ethene", "Ethane", "Methanol", "This happens when wine turns sour."], ["What temperature is best for fermentation by yeast?", "About 30 to 35 degrees Celsius", "0 degrees Celsius", "100 degrees Celsius", "80 degrees Celsius", "Too hot denatures the enzymes."]], "27": [["Which functional group is in ethanoic acid?", "-COOH", "-OH", "C=C", "-COO-", "The carboxyl group."], ["Which gas forms when ethanoic acid reacts with sodium carbonate?", "Carbon dioxide", "Hydrogen", "Oxygen", "Methane", "Like other acids it releases CO2."], ["Why is ethanoic acid a weak acid?", "It is partially ionised", "It does not dissolve", "It has a low pH", "It has no H+", "Only a few molecules ionise."], ["What gas is produced when a carboxylic acid reacts with a carbonate?", "Carbon dioxide", "Hydrogen", "Oxygen", "Chlorine", "It turns limewater milky."], ["What is the name of CH3CH2COOH?", "Propanoic acid", "Ethanoic acid", "Butanoic acid", "Methanoic acid", "It has three carbons."], ["What is vinegar a dilute solution of?", "Ethanoic acid", "Hydrochloric acid", "Ethanol", "Sulfuric acid", "It is a weak acid."]], "28": [["What catalyst is used in esterification?", "Concentrated sulfuric acid", "Iron", "Yeast", "Nickel", "A few drops of conc. H₂SO₄ and warming."], ["Which two compounds make an ester?", "An alcohol and a carboxylic acid", "Two alcohols", "Two acids", "Alkane and alkene", "Esterification."], ["What catalyst is used to make esters?", "Concentrated sulfuric acid", "Iron", "Nickel", "Platinum", "An acid catalyst."], ["Which property of esters makes them useful in perfumes?", "Pleasant smell", "High melting point", "Colour", "Acidity", "Esters smell fruity."], ["What reacts with an alcohol to make an ester?", "A carboxylic acid", "An alkane", "A metal", "An alkali", "Concentrated sulfuric acid is the catalyst."], ["What is the functional group of an ester?", "-COO-", "-OH", "-COOH", "C=C", "Esters often smell fruity."], ["What are esters commonly used for?", "Flavourings and perfumes", "Fuels in cars", "Making fertilisers", "Making steel", "They have pleasant smells."]], "29": [["Why are addition polymers hard to dispose of?", "They are not biodegradable", "They dissolve in water", "They are too reactive", "They melt at room temperature", "They persist in landfill for a very long time."], ["Which monomer makes PVC (poly(chloroethene))?", "Chloroethene", "Ethene", "Propene", "Ethanol", "The polymer is named after its monomer."], ["Which process joins ethene molecules into poly(ethene)?", "Addition polymerisation", "Condensation", "Cracking", "Hydration", "Double bonds open."], ["What is a monomer?", "A small molecule that forms a polymer", "A long chain", "A catalyst", "An alkane", "Monomers join together."], ["Why are many plastics a problem?", "They are not biodegradable", "They dissolve", "They are heavy", "They are toxic", "They persist in landfill."], ["What is the monomer of poly(ethene)?", "Ethene", "Ethane", "Ethanol", "Propene", "Many ethene molecules join."], ["What small molecule is lost in condensation polymerisation?", "Water (or HCl)", "Oxygen", "Carbon dioxide", "Hydrogen", "Two different functional groups react."], ["Why are some polymers hard to dispose of?", "They are not biodegradable", "They dissolve quickly", "They are too heavy", "They are magnetic", "They stay in landfill for a long time."]]}, "physics": {"1": [["A car travels 300 m in 20 s. What is its average speed?", "15 m/s", "6000 m/s", "0.067 m/s", "320 m/s", "speed = distance ÷ time = 300 ÷ 20."], ["A cyclist goes from 2 m/s to 10 m/s in 4 s. What is the acceleration?", "2 m/s²", "8 m/s²", "3 m/s²", "32 m/s²", "a = (v − u) ÷ t = 8 ÷ 4."], ["Which quantity is a vector?", "Velocity", "Speed", "Distance", "Time", "Velocity has size and direction."], ["What does the gradient of a distance-time graph show?", "Speed", "Acceleration", "Distance", "Time", "Gradient is change in distance over time."], ["A car goes from 0 to 20 m/s in 5 s. What is its acceleration?", "4 m/s2", "100 m/s2", "25 m/s2", "0.25 m/s2", "20 / 5 = 4."], ["What does the area under a speed-time graph show?", "Distance", "Acceleration", "Time", "Speed", "Area equals distance travelled."], ["What does the area under a velocity-time graph represent?", "Distance travelled", "Acceleration", "Speed", "Force", "Count squares or use shapes."], ["What is the unit of acceleration?", "m/s2", "m/s", "N", "kg", "It is change in velocity per second."], ["What does a flat line on a distance-time graph show?", "The object is stationary", "The object is accelerating", "The object is moving at constant speed", "The object is decelerating", "Distance is not changing."], ["What does the gradient of a velocity-time graph show?", "Acceleration", "Distance", "Time", "Mass", "Steeper means greater acceleration."]], "2": [["Forces of 10 N right and 4 N left act on a box. What is the resultant force?", "6 N to the right", "14 N to the right", "6 N to the left", "0 N", "Subtract forces acting in opposite directions."], ["Which force acts between charged objects?", "Electrostatic force", "Friction", "Upthrust", "Air resistance", "Like charges repel; unlike charges attract."], ["Which law links force and extension of a spring?", "Hooke's law", "Newton's first law", "Ohm's law", "Boyle's law", "Force is proportional to extension."], ["A spring of constant 50 N/m is pulled by 2 N. What is the extension?", "0.04 m", "100 m", "25 m", "0.4 m", "2 / 50 = 0.04."], ["What is the unit of the spring constant?", "N/m", "N", "m", "N m", "Force per unit extension."], ["What is the unit of force?", "Newton", "Joule", "Watt", "Pascal", "1 N accelerates 1 kg at 1 m/s2."], ["What is elastic deformation?", "The object returns to its original shape when the force is removed", "It stays permanently stretched", "It breaks", "It melts", "Beyond the elastic limit it does not return."], ["What is the formula for weight?", "Weight = mass x gravitational field strength", "Weight = mass / volume", "Weight = force x distance", "Weight = mass x velocity", "g is about 10 N/kg on Earth."], ["What instrument measures force?", "Newton meter", "Ammeter", "Thermometer", "Voltmeter", "It contains a spring."]], "3": [["What force accelerates a 2 kg mass at 3 m/s²?", "6 N", "1.5 N", "5 N", "0.67 N", "F = m × a = 2 × 3."], ["What is the weight of a 5 kg mass on Earth (g = 10 N/kg)?", "50 N", "5 N", "0.5 N", "15 N", "W = m × g."], ["Which increases thinking distance?", "Drinking alcohol or being tired", "Worn brakes", "An icy road", "Worn tyres", "These slow the driver's reaction time."], ["What is the resultant force on a car moving at constant speed?", "Zero", "Equal to weight", "Forward", "Backward", "Balanced forces cause no acceleration."], ["Which equation is Newton's second law?", "F = ma", "F = mv", "F = m/a", "F = a/m", "Force equals mass times acceleration."], ["Which force acts on a falling object in air?", "Air resistance", "Friction only", "Magnetic force", "Tension", "Air resistance opposes motion."], ["What is Newton's second law?", "Force = mass x acceleration", "Force = mass x velocity", "Force = work / time", "Force = pressure x volume", "F = ma."], ["What happens if the forces on an object are balanced?", "It stays still or moves at constant velocity", "It accelerates", "It slows to a stop always", "It changes direction", "The resultant force is zero."], ["What two parts make up stopping distance?", "Thinking distance and braking distance", "Speed and time", "Mass and weight", "Friction and gravity", "Both increase with speed."], ["Which factor increases thinking distance?", "Tiredness or alcohol", "Worn brakes", "Icy roads", "Worn tyres", "It slows reaction time."]], "4": [["What is the momentum of a 1000 kg car at 20 m/s?", "20 000 kg m/s", "50 kg m/s", "200 000 kg m/s", "1020 kg m/s", "p = 1000 × 20."], ["What is the unit of momentum?", "kg m/s", "N", "kg", "J", "Momentum equals mass times velocity."], ["What is the momentum of a 2 kg object moving at 5 m/s?", "10 kg m/s", "7 kg m/s", "2.5 kg m/s", "3 kg m/s", "2 x 5 = 10."], ["What is the unit of momentum?", "kg m/s", "N", "J", "m/s2", "Momentum = mass x velocity."], ["Is momentum a scalar or a vector?", "Vector", "Scalar", "Neither", "Both", "It has direction."], ["Force equals the rate of change of what?", "Momentum", "Speed", "Mass", "Distance", "F = change in momentum / time."], ["Why do airbags reduce injury?", "They increase the time taken to stop, reducing force", "They increase the force", "They stop the car", "They reduce mass", "Same momentum change over a longer time."]], "5": [["A 20 N force acts 0.5 m from a pivot. What is the moment?", "10 N m", "40 N m", "20.5 N m", "0.025 N m", "20 × 0.5."], ["Which equation gives a moment?", "Force x perpendicular distance", "Force / distance", "Mass x distance", "Force + distance", "Moment = F x d."], ["A 10 N force acts 0.5 m from a pivot. What is the moment?", "5 N m", "20 N m", "0.05 N m", "10 N m", "10 x 0.5 = 5."], ["Where is the centre of mass of a uniform ruler?", "At the middle", "At one end", "At the pivot", "Anywhere", "Symmetry places it in the middle."], ["What is a moment?", "The turning effect of a force", "A short time", "A type of energy", "A unit of mass", "Moment = force x perpendicular distance."], ["What is the unit of a moment?", "N m", "N", "J", "kg", "It is newton metres."], ["Why is a long spanner easier to use?", "Greater distance gives a bigger moment for the same force", "It is heavier", "It has less friction", "It is made of steel", "Moment = F x d."], ["What is the centre of gravity?", "The point where the weight seems to act", "The middle of the base", "The heaviest part", "The pivot", "Low centres of gravity give stability."]], "6": [["A kettle draws 10 A at 230 V. What is its power?", "2300 W", "23 W", "240 W", "0.043 W", "P = 10 × 230."], ["Why do appliances with metal cases have an earth wire?", "So a fault current flows safely to earth and blows the fuse", "To make them work faster", "To save energy", "To heat the case", "It prevents the case becoming live."], ["Which wire in a three-pin plug is the live wire?", "Brown", "Blue", "Green and yellow", "Black", "Live is brown."], ["What does a fuse do?", "Melts if the current is too high", "Increases voltage", "Stores charge", "Stops earthing", "It breaks the circuit."], ["Which current is used in mains supply?", "Alternating", "Direct", "Static", "Pulsed", "Mains is a.c."], ["Which wire in a plug contains the fuse?", "Live wire", "Neutral wire", "Earth wire", "All three", "The fuse breaks the live circuit."], ["What colour is the live wire?", "Brown", "Blue", "Green and yellow", "Black", "Neutral is blue."], ["What is the formula for electrical power?", "Power = current x voltage", "Power = current / voltage", "Power = voltage / resistance only", "Power = charge x time", "P = IV."], ["What is double insulation?", "The appliance has a plastic case so it needs no earth wire", "Two fuses are used", "Two live wires", "A metal case with an earth", "The user cannot touch live parts."]], "7": [["How much charge flows when 2 A flows for 5 s?", "10 C", "2.5 C", "7 C", "0.4 C", "Q = I × t."], ["What is the unit of charge?", "Coulomb", "Ampere", "Volt", "Ohm", "Charge is measured in coulombs."], ["What is electric current?", "The rate of flow of charge", "The push of electricity", "Stored energy", "The resistance of a wire", "Measured in amperes."], ["How is an ammeter connected?", "In series", "In parallel", "Across the battery only", "It is not connected", "Current must flow through it."], ["What is the formula linking charge, current and time?", "Q = I x t", "Q = V x I", "Q = I / t", "Q = V / R", "Charge is measured in coulombs."], ["What is the unit of energy transferred by electricity?", "Joule", "Watt", "Ampere", "Ohm", "E = Q x V."]], "8": [["What is the resistance if 12 V gives a current of 3 A?", "4 Ω", "36 Ω", "0.25 Ω", "15 Ω", "R = V ÷ I."], ["What is the resistance of a 12 V supply with 3 A current?", "4 ohm", "36 ohm", "0.25 ohm", "9 ohm", "R = V / I = 4."], ["What happens to the resistance of an LDR in bright light?", "Decreases", "Increases", "Stays the same", "Becomes infinite", "More light lowers resistance."], ["Which component has a resistance that decreases as temperature rises?", "Thermistor", "LDR", "Diode", "Resistor", "NTC thermistor."], ["What is the formula for Ohm's law?", "V = I x R", "V = I / R", "V = P x I", "V = Q / t", "At constant temperature."], ["What is the unit of resistance?", "Ohm", "Volt", "Amp", "Watt", "Symbol is the Greek letter omega."], ["What does a diode do?", "Lets current flow in one direction only", "Stores charge", "Lights up in all directions", "Increases current", "It has very high resistance in reverse."], ["What happens to total resistance when resistors are added in series?", "It increases", "It decreases", "It stays the same", "It becomes zero", "R total = R1 + R2."]], "9": [["Which material is an electrical insulator?", "Plastic", "Copper", "Aluminium", "Graphite", "Insulators don't let charge flow."], ["Why are aircraft earthed when refuelling?", "To stop sparks from static charge igniting the fuel", "To make fuel flow faster", "To cool the engine", "To weigh the plane", "Friction between fuel and pipe builds up charge."], ["Which uses electrostatic charge?", "Inkjet printer", "Electric kettle", "Torch", "Fuse", "Charged ink droplets are deflected by plates."], ["What is the unit of current?", "Ampere", "Coulomb", "Volt", "Watt", "Current is measured in amperes."], ["What particles move when a material becomes charged by rubbing?", "Electrons", "Protons", "Neutrons", "Atoms", "Protons stay in the nucleus."], ["Why is a metal a conductor?", "Electrons can move freely through it", "It has no electrons", "Its protons move", "It is cold", "Insulators hold electrons tightly."], ["What is earthing?", "Connecting an object to the ground so charge can flow away", "Burying a wire", "Adding more charge", "Rubbing with a cloth", "It prevents build-up of charge."], ["How do inkjet printers use static electricity?", "Charged ink drops are steered by charged plates", "They melt ink", "They use magnets only", "They heat paper", "Drops are deflected to the right place."]], "10": [["A wave has frequency 50 Hz and wavelength 2 m. What is its speed?", "100 m/s", "25 m/s", "52 m/s", "0.04 m/s", "50 × 2."], ["Which type of wave is sound?", "Longitudinal", "Transverse", "Electromagnetic", "Stationary", "Compressions and rarefactions."], ["What is the unit of frequency?", "Hertz", "Metre", "Second", "Watt", "Frequency is cycles per second."], ["Which equation links wave speed, frequency and wavelength?", "v = f x wavelength", "v = f / wavelength", "v = wavelength / f", "v = f + wavelength", "The wave equation."], ["What is the frequency of a wave?", "Number of waves passing a point per second", "Height of a wave", "Length of a wave", "Speed of a wave", "Measured in hertz."], ["What is the wave equation?", "v = f x wavelength", "v = f / wavelength", "v = d x t", "v = f + wavelength", "Speed = frequency x wavelength."], ["What type of wave is sound?", "Longitudinal", "Transverse", "Electromagnetic", "Stationary", "Vibrations are parallel to travel."], ["What is the formula linking frequency and time period?", "f = 1 / T", "f = T", "f = T / 2", "f = 2T", "T is the time for one wave."]], "11": [["Which EM wave has the longest wavelength?", "Radio waves", "Gamma rays", "X-rays", "Ultraviolet", "Radio, micro, IR, visible, UV, X, gamma."], ["Which EM wave is used for night-vision cameras?", "Infrared", "Ultraviolet", "Gamma", "Radio", "Warm objects emit infrared."], ["Which electromagnetic wave has the longest wavelength?", "Radio waves", "Gamma rays", "X-rays", "Visible light", "Radio waves are the longest."], ["Which type of radiation is used in cancer treatment?", "Gamma rays", "Radio waves", "Microwaves", "Infrared", "Gamma rays kill cancer cells."], ["Which electromagnetic wave is used to sterilise food?", "Gamma rays", "Radio waves", "Infrared", "Microwaves", "Gamma kills bacteria."], ["Which electromagnetic wave has the longest wavelength?", "Radio waves", "Gamma rays", "X-rays", "Visible light", "Radio waves have the lowest frequency."], ["What speed do all electromagnetic waves travel at in a vacuum?", "3 x 10^8 m/s", "340 m/s", "1500 m/s", "3 x 10^6 m/s", "This is the speed of light."], ["Which electromagnetic wave is used in optical fibres?", "Visible light or infrared", "Gamma rays", "Radio waves", "Ultraviolet", "Total internal reflection keeps light inside."]], "12": [["What is the law of reflection?", "Angle of incidence equals angle of reflection", "Light bends", "Angle of incidence is double", "Reflection is random", "Measured from the normal."], ["Which change occurs when light enters glass from air?", "It slows down", "It speeds up", "Frequency changes", "It stops", "The speed decreases."], ["What is the normal?", "A line at 90 degrees to a surface", "The surface itself", "A light ray", "An angle of 45 degrees", "Angles are measured from it."], ["What happens to light when it enters glass from air?", "It slows down and bends towards the normal", "It speeds up", "It bends away from the normal", "It stops", "This is refraction."], ["What is the critical angle?", "The angle of incidence where the refracted ray travels along the boundary", "Always 90 degrees", "The angle of reflection", "The angle in air", "Above it, total internal reflection happens."], ["What is the formula for refractive index?", "n = sin i / sin r", "n = sin r / sin i", "n = i x r", "n = speed x time", "i is the angle in air."]], "13": [["An oscilloscope shows a sound wave with 4 waves in 0.01 s. What is the frequency?", "400 Hz", "40 Hz", "4 Hz", "0.04 Hz", "f = 4 ÷ 0.01."], ["What determines the pitch of a sound?", "Frequency", "Amplitude", "Speed", "Wavelength only", "Higher frequency means higher pitch."], ["What is an echo?", "Reflected sound", "Absorbed sound", "Refracted sound", "Diffracted sound", "Sound bounces off a surface."], ["What is an echo?", "A reflected sound", "A refracted sound", "A very loud sound", "An ultrasound wave", "Sound bounces off hard surfaces."], ["What unit is used for the frequency of sound?", "Hertz", "Decibel", "Metre", "Second", "Loudness is in decibels."], ["Through which material does sound travel fastest?", "Solids", "Liquids", "Gases", "A vacuum", "Particles are closest together."], ["What does an oscilloscope trace with a taller wave show?", "A louder sound", "A higher pitch", "A lower pitch", "A quieter sound", "Taller means larger amplitude."]], "14": [["A bulb receives 100 J and gives out 20 J of light. What is its efficiency?", "20%", "80%", "5%", "120%", "useful ÷ total × 100."], ["What is the unit of energy?", "Joule", "Watt", "Newton", "Pascal", "Energy is measured in joules."], ["What energy store does a stretched spring have?", "Elastic potential", "Kinetic", "Thermal", "Chemical", "Energy stored in the spring."], ["Which equation gives kinetic energy?", "1/2 mv^2", "mgh", "Fd", "mv", "KE = half mass times speed squared."], ["What is a Sankey diagram used for?", "Showing energy transfers and efficiency", "Showing forces", "Showing circuits", "Showing waves", "Arrow widths show amounts of energy."], ["What is the formula for kinetic energy?", "KE = 1/2 x m x v2", "KE = m x g x h", "KE = F x d", "KE = m x v", "v is speed."], ["What is the formula for gravitational potential energy?", "GPE = m x g x h", "GPE = 1/2 m v2", "GPE = F x d", "GPE = P x t", "h is height."], ["What happens to wasted energy in most devices?", "It is transferred as heat to the surroundings", "It disappears", "It is stored forever", "It becomes mass", "It spreads out and is less useful."]], "15": [["Which surface is the best emitter of infrared radiation?", "Dull black", "Shiny silver", "Shiny white", "Polished metal", "Dull black is the best emitter and absorber."], ["Which process transfers thermal energy in solids?", "Conduction", "Convection", "Radiation", "Evaporation", "Particles vibrate and pass energy on."], ["Which surface is the best absorber of radiation?", "Matt black", "Shiny silver", "White", "Shiny black", "Matt black absorbs the most."], ["Which method of heat transfer happens mainly in fluids?", "Convection", "Conduction", "Radiation", "Evaporation", "Warm fluid rises."], ["What is specific heat capacity?", "Energy needed to raise 1 kg by 1 degree Celsius", "Energy to melt a solid", "Energy to boil a liquid", "Temperature of a substance", "Water has a high specific heat capacity."], ["Which surface is the best absorber of infrared?", "Dark matt", "Shiny silver", "White glossy", "Transparent", "Dark matt surfaces absorb and emit best."], ["Why is loft insulation effective?", "It traps air, which is a poor conductor", "It is a good conductor", "It reflects light", "It heats the house", "Trapped air also reduces convection."]], "16": [["What is the GPE gained when a 2 kg mass is lifted 5 m (g = 10 N/kg)?", "100 J", "10 J", "50 J", "20 J", "GPE = m × g × h."], ["What is the kinetic energy of a 4 kg ball moving at 3 m/s?", "18 J", "12 J", "36 J", "6 J", "½ × 4 × 3²."], ["A motor does 600 J of work in 30 s. What is its power?", "20 W", "18 000 W", "570 W", "0.05 W", "600 ÷ 30."], ["What is the equation for work done?", "Force x distance", "Force / distance", "Mass x speed", "Power x force", "W = Fd."], ["What is the unit of power?", "Watt", "Joule", "Newton", "Volt", "One joule per second."], ["A machine does 500 J of work in 10 s. What is its power?", "50 W", "5000 W", "510 W", "0.02 W", "500 / 10 = 50."], ["What is work done?", "Energy transferred when a force moves an object", "Power used", "Mass times speed", "A type of force", "Work = force x distance."], ["What is the unit of power?", "Watt", "Joule", "Newton", "Volt", "1 W = 1 J per second."], ["A 50 N force moves a box 4 m. What work is done?", "200 J", "54 J", "12.5 J", "46 J", "Work = 50 x 4."], ["A motor transfers 1200 J in 60 s. What is its power?", "20 W", "72000 W", "1260 W", "0.05 W", "Power = 1200 / 60."]], "17": [["Which is a renewable energy resource?", "Wind", "Coal", "Natural gas", "Uranium", "Wind is replaced naturally."], ["Which resource uses hot rocks underground?", "Geothermal", "Tidal", "Solar", "Hydroelectric", "Water is heated by hot rocks."], ["Which is a renewable energy resource?", "Wind", "Coal", "Gas", "Oil", "Wind is renewable."], ["Which energy resource produces radioactive waste?", "Nuclear", "Wind", "Solar", "Hydroelectric", "Fission produces waste."], ["Which is a renewable energy resource?", "Solar", "Coal", "Natural gas", "Uranium", "It will not run out."], ["How does a hydroelectric power station generate electricity?", "Falling water turns turbines", "Burning coal", "Splitting atoms", "Wind turns blades", "Water stored behind a dam."], ["What is a disadvantage of tidal power?", "It can damage habitats in estuaries", "It produces carbon dioxide", "It runs out", "It needs fuel", "It is also costly to build."], ["Which energy resource releases sulfur dioxide when burned?", "Coal", "Wind", "Solar", "Geothermal", "Sulfur dioxide causes acid rain."]], "18": [["A block has mass 600 g and volume 200 cm³. What is its density?", "3 g/cm³", "0.33 g/cm³", "120 000 g/cm³", "400 g/cm³", "600 ÷ 200."], ["Which equation gives density?", "Mass / volume", "Volume / mass", "Mass x volume", "Force / area", "Density is mass per unit volume."], ["What is the unit of pressure?", "Pascal", "Newton", "Joule", "Watt", "Pressure is in pascals."], ["What is the unit of pressure?", "Pascal", "Newton", "Joule", "Watt", "1 Pa = 1 N/m2."], ["Why do tractors have wide tyres?", "To spread the weight over a larger area and reduce pressure", "To go faster", "To increase pressure", "To use less fuel", "They sink less into mud."], ["How does pressure in a liquid change with depth?", "It increases", "It decreases", "It stays the same", "It becomes zero", "Pressure = h x density x g."], ["What is the formula for density?", "Density = mass / volume", "Density = volume / mass", "Density = mass x volume", "Density = force / area", "Units kg/m3 or g/cm3."]], "19": [["Convert 27 °C to kelvin.", "300 K", "246 K", "27 K", "−246 K", "Add 273."], ["Which state has particles in fixed positions?", "Solid", "Liquid", "Gas", "Plasma", "Solid particles vibrate in place."], ["What happens to gas pressure if volume decreases at constant temperature?", "Increases", "Decreases", "Stays same", "Zero", "Boyle's law."], ["What is the temperature of absolute zero in Celsius?", "-273 degrees Celsius", "0 degrees Celsius", "-100 degrees Celsius", "-373 degrees Celsius", "It is 0 K."], ["How do you convert Celsius to kelvin?", "Add 273", "Subtract 273", "Multiply by 273", "Divide by 273", "For example, 27 degrees Celsius is 300 K."], ["What happens to gas pressure if temperature rises at constant volume?", "It increases", "It decreases", "It stays the same", "It becomes zero", "Particles hit walls harder and more often."], ["What is evaporation?", "Particles escaping from the surface of a liquid", "A gas turning into a liquid", "A solid turning into a liquid", "Boiling throughout", "It cools the remaining liquid."]], "20": [["How can you make an electromagnet stronger?", "Increase the current or the number of turns", "Use a plastic core", "Reduce the current", "Use fewer coils", "An iron core also helps."], ["Which material is used for the core of an electromagnet?", "Soft iron", "Steel", "Copper", "Plastic", "Soft iron magnetises and demagnetises easily."], ["Which rule gives the direction of the force on a current in a field?", "Fleming's left-hand rule", "Right-hand grip rule", "Ohm's law", "Boyle's law", "It relates field, current and force."], ["Which materials are magnetic?", "Iron, nickel and cobalt", "Copper and aluminium", "Gold and silver", "Plastic and glass", "Steel is mostly iron."], ["What do like magnetic poles do?", "Repel", "Attract", "Do nothing", "Spin", "Unlike poles attract."], ["What is the shape of the field around a long straight wire carrying current?", "Circles around the wire", "Straight lines along the wire", "No field", "A figure of eight", "Use the right-hand grip rule."], ["What is a solenoid?", "A coil of wire that acts like a bar magnet when current flows", "A type of battery", "A permanent magnet", "A light bulb", "An iron core makes it stronger."]], "21": [["What is needed to induce a voltage in a wire?", "Relative movement between wire and magnetic field", "A battery", "A resistor", "A fuse", "Electromagnetic induction."], ["Why is electricity transmitted at high voltage?", "To reduce energy lost as heat", "To increase current", "To use thicker cables", "To save voltage", "A high voltage means a lower current."], ["What does a generator transfer?", "Kinetic energy into electrical energy", "Electrical energy into kinetic energy", "Heat into light", "Sound into electricity", "It uses electromagnetic induction."], ["How can the voltage induced in a coil be increased?", "Move the magnet faster", "Move the magnet slower", "Use fewer turns", "Remove the magnet", "More turns or a stronger magnet also help."], ["What does a transformer need to work?", "Alternating current", "Direct current", "No current", "A battery", "A changing field induces voltage."], ["What does a step-down transformer do?", "Decreases voltage", "Increases voltage", "Increases current only", "Stores energy", "Used before homes."]], "22": [["Which radiation is stopped by a few mm of aluminium but passes through paper?", "Beta", "Alpha", "Gamma", "Neutron", "Gamma needs thick lead or concrete."], ["Which detects ionising radiation?", "Geiger–Müller tube", "Thermometer", "Ammeter", "Microphone", "Photographic film also works."], ["Which particle is a helium nucleus?", "Alpha", "Beta", "Gamma", "Neutron", "An alpha particle has 2 protons and 2 neutrons."], ["Which radiation is most penetrating?", "Gamma", "Alpha", "Beta", "All equal", "Gamma passes through thick lead partially."], ["Who discovered the nucleus using alpha scattering?", "Rutherford", "Bohr", "Thomson", "Chadwick", "The gold foil experiment."], ["What is in the nucleus of an atom?", "Protons and neutrons", "Electrons only", "Protons and electrons", "Neutrons and electrons", "Electrons orbit the nucleus."], ["Which radiation is the most ionising?", "Alpha", "Beta", "Gamma", "Radio", "It is stopped by paper."], ["What is a gamma ray?", "Electromagnetic radiation from the nucleus", "A helium nucleus", "A fast electron", "A neutron", "It has no charge or mass."], ["What happens to the mass number in beta decay?", "It stays the same", "It decreases by 4", "It increases by 1", "It decreases by 1", "A neutron becomes a proton."]], "23": [["A source has activity 800 Bq and half-life 2 days. What is the activity after 6 days?", "100 Bq", "400 Bq", "200 Bq", "0 Bq", "3 half-lives: 800 → 400 → 200 → 100."], ["Which is a source of background radiation?", "Radon gas from rocks", "Mobile phones", "Microwave ovens", "Light bulbs", "Also cosmic rays, food, medical uses."], ["What is half-life?", "The time for the activity to halve", "Half the atoms decay", "The time for all atoms to decay", "Half the mass", "Time for half of nuclei to decay."], ["A source has half-life 4 days. What fraction remains after 8 days?", "One quarter", "One half", "One eighth", "One tenth", "Two half-lives gives one quarter."], ["Which instrument detects radiation?", "Geiger-Muller tube", "Voltmeter", "Thermometer", "Barometer", "It counts ionising events."], ["What is background radiation?", "Radiation that is always present from natural and man-made sources", "Radiation only from power stations", "Radiation from mobile phones only", "Light from the Sun", "Radon gas is a big source."], ["Which detector measures radioactivity?", "Geiger-Muller tube", "Ammeter", "Thermometer", "Barometer", "It counts ionising events."], ["A source has a half-life of 2 days. What fraction is left after 6 days?", "1/8", "1/2", "1/4", "1/6", "Three half-lives pass."], ["What is contamination?", "Radioactive material getting onto or into an object", "Being exposed to radiation from a distance", "A type of decay", "A safety rule", "Irradiation is exposure from outside."]], "24": [  is a stem cell?", "An unspecialised cell that can become other cell types", "A cell with no nucleus", "A nerve cell", "A cell that cannot divide", "Stem cells can differentiate."], ["What is differentiation?", "A cell becoming specialised for a job", "A cell dividing in two", "A cell dying", "A cell taking in water", "Specialised cells have special features."], ["Which feature helps a red blood cell carry oxygen?", "It has no nucleus, leaving more room for haemoglobin", "It has many mitochondria", "It has a tail", "It has a cell wall", "Its biconcave shape also helps."], ["What type of cell division produces two genetically identical cells?", "Mitosis", "Meiosis", "Fertilisation", "Differentiation", "Mitosis is used for growth and repair."], ["Why does a sperm cell have many mitochondria?", "To release energy for swimming", "To store food", "To digest the egg", "To make proteins", "The tail needs energy to move."], ["What does the nucleus contain?", "Chromosomes made of DNA", "Haemoglobin", "Enzymes for respiration", "Starch grains", "DNA carries the genetic code."], ["What is the job of the mitochondria?", "Aerobic respiration releasing energy", "Photosynthesis", "Making proteins", "Controlling entry of substances", "They are found in almost all human cells."]], "2": [["Which cube has the largest surface area to volume ratio?", "The smallest", "The largest", "All equal", "The middle", "Smaller means larger ratio."], ["Which increases the rate of diffusion?", "Higher temperature", "Longer distance", "Smaller gradient", "Smaller surface area", "More kinetic energy."], ["What is osmosis?", "Movement of water across a partially permeable membrane", "Movement of solutes", "Movement using energy", "Movement of gases only", "Water moves from dilute to concentrated."], ["What is diffusion?", "Net movement of particles from high to low concentration", "Movement of water only", "Movement using energy", "Movement against a gradient", "It is passive and needs no energy."], [" y", "Hydrogen and sulfur", "Proteins also contain nitrogen."], ["Why does pH affect enzyme activity?", "It can change the shape of the active site", "It changes the substrate into a product", "It makes the enzyme bigger", "It adds energy", "Each enzyme has an optimum pH."], ["What is glycogen?", "A storage carbohydrate in liver and muscle", "A type of protein", "A fat", "An enzyme", "Glycogen is made from glucose."]], "4": [["Which food group gives the most energy per gram?", "Lipid", "Carbohydrate", "Protein", "Water", "About 39 kJ per g."], ["Which vitamin deficiency causes scurvy?", "Vitamin C", "Vitamin D", "Vitamin A", "Vitamin K", "Vitamin C is needed for connective tissue."], ["Which nutrient is the main energy source?", "Carbohydrate", "Water", "Fibre", "Vitamins", "Carbohydrates are respired for energy."], ["Which nutrient is the main source of energy?", "Carbohydrate", "Vitamin C", "Calcium", "Water", "Starch and sugars release energy."], ["What is the function of dietary fibre?", "Helps food move through the gut and prevents constipation", "Builds muscles", "Carries oxygen", "Strengthens bones", "Fibre adds bulk for peristalsis."], ["Which mineral is needed to make haemoglobin?", "Iron", "Calcium", "Iodine", "Sodium", "Lack of iron causes anaemia."], ["Which nutrient is needed for strong bones and teeth?", "Calcium", "Iron", "Vitamin C", "Fibre", "Vitamin D helps absorb calcium."], ["What does amylase break down?", "Starch into maltose", "Protein into amino acids", "Fat into fatty acids", "Maltose into glucose", "Amylase is made in the salivary glands and pancreas."], ["Where is bile made?", "Liver", "Gall bladder", "Stomach", "Pancreas", "It is stored in the gall bladder."], ["What does bile do to fats?", "Emulsifies them into small droplets", "Digests them into glucose", "Absorbs them", "Turns them into protein", "Small droplets give lipase a larger surface area."], ["Where are most digested foods absorbed?", "Small intestine (ileum)", "Stomach", "Large re analogue signals?", "Continuously variable", "Only on or off", "Fixed values", "Binary", "Like a dimmer."], ["What is binary 101 in denary?", "5", "3", "6", "7", "4 + 1 = 5."], ["How many bits are in a byte?", "8", "4", "16", "2", "One byte is eight bits."], ["What is the largest number that 8 bits can store as an unsigned integer?", "255", "256", "128", "127", "11111111 in binary."], ["What is 1101 in denary?", "13", "11", "15", "9", "8 + 4 + 1."], ["What is denary 12 in 4-bit binary?", "1100", "1010", "1110", "0011", "8 + 4."]], "13": [["What is a pixel?", "The smallest dot of an image", "A colour", "A file", "A pattern", "Images are made of pixels."], ["What does a higher sample rate do to a sound file?", "Increases quality and file size", "Decreases size", "Removes sound", "Changes pitch", "More samples per second."], ["What is a character set?", "A list of characters with their binary codes", "A font", "A type of image", "A sound file", "ASCII and Unicode are character sets."], ["Why was Unicode developed?", "To represent characters from all the world's languages", "To make files smaller", "To store images", "To encrypt data", "ASCII only has 128 characters."], ["What is colour depth?", "The number of bits used for each pixel", "The number of pixels", "The size of the screen", "The brightness of an image", "More bits allow more colours."]], "14": [["How many bytes are in a kilobyte (decimal prefix)?", "1000", "1024", "100", "8", "Kilo is 1000."], ["How many bits in a byte?", "8", "4", "16", "10", "A byte is 8 bits."], ["Which compression loses some data permanently?", "Lossy", "Lossless", "Both", "Neither", "Lossy discards data."], ["How many bytes are in 1 KiB?", "1024", "1000", "100", "8", "A kibibyte is 1024 bytes."], ["How many bits are in a nibble?", "4", "8", "2", "16", "Two nibbles make a byte."], ["How many bytes are in a kibibyte (KiB)?", "1024", "1000", "100", "8", "Binary prefixes use powers of 2."], ["What is lossy compression?", "Permanently rem er dissolving rock", "Rocks knocking into each other", "The force of water alone", "It is like sandpaper."], ["What is attrition?", "Rocks hitting each other and becoming smaller and rounder", "Rocks dissolving", "Water pressure breaking rock", "Rocks scraping the bed", "Sediment gets smaller downstream."], ["What is traction?", "Large boulders rolled along the river bed", "Small particles bouncing", "Material carried in the water", "Material dissolved in the water", "It needs a lot of energy."], ["What is saltation?", "Small pebbles bouncing along the river bed", "Boulders rolling", "Material dissolved in water", "Fine material floating", "It happens in faster flow."], ["Where is the floodplain found?", "On the flat land beside a river in its lower course", "At the source", "In a gorge", "On a mountain top", "It is made by deposition during floods."], ["What is a levee?", "A raised bank of sediment along a river", "A waterfall", "A deep pool", "A meander", "Natural levees form during floods."], ["Which is a hard engineering flood defence?", "A dam", "Afforestation", "Floodplain zoning", "Flood warnings", "Hard engineering uses structures."], ["Which is a soft engineering flood management method?", "Planting trees in the drainage basin", "Building a concrete wall", "Straightening the channel", "Building a dam", "It works with nature."], ["What is discharge?", "The volume of water passing a point per second", "The speed of a river", "The depth of a river", "The width of a river", "Measured in cumecs."]], "2": [["What makes waves stronger?", "Stronger wind and longer fetch", "Shallow water", "Low tide", "Rivers", "Wind blowing for longer over a longer distance."], ["Which wave type has a stronger backwash than swash?", "Destructive", "Constructive", "Tidal", "Swell", "They erode beaches."], ["How does longshore drift move material?", "Zigzag along the coast", "Straight out to sea", "Up cliffs", "Into rivers", "Waves come in at an angle."], ["What forms when waves unde
