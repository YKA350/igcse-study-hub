    11: [() => { const a = rnd(10, 30), b = a + rnd(2, 8); return mk(`A potato cylinder gains mass from ${a} g to ${b} g in water. What is the percentage change in mass?`, (b - a) / a * 100, [(b - a), (b - a) / b * 100, b / a * 100], `% change = change ÷ original × 100 = ${b - a} ÷ ${a} × 100.`); }],
    14: [() => { const q = rnd(2, 12), area = [100, 200, 400][rnd(0, 2)]; return mk(`A 1 m² quadrat averages ${q} plants per quadrat in a field of ${area} m². Estimate the population.`, q * area, [q + area, area / q, q * area * 2], `population ≈ mean per m² × area = ${q} × ${area}.`); }],
    17: [() => { const n = [46, 48, 40, 14][rnd(0, 3)]; return mk(`A body cell has ${n} chromosomes. How many chromosomes are in each daughter cell after mitosis?`, n, [n / 2, n * 2, n / 4], `mitosis makes identical cells with the same number, ${n}.`); },
        () => { const n = [46, 48, 40, 14][rnd(0, 3)]; return mk(`A body cell has ${n} chromosomes. How many chromosomes are in each gamete after meiosis?`, n / 2, [n, n * 2, n / 4], `meiosis halves the number: ${n} ÷ 2.`); }],
    18: [() => { const n = rnd(2, 12) * 4; return mk(`Two heterozygous parents (Aa × Aa) have ${n} offspring. How many are expected to show the dominant phenotype?`, n * 3 / 4, [n / 4, n / 2, n], `3 : 1 ratio, so ¾ of ${n}.`); },
        () => { const n = rnd(2, 12) * 4; return mk(`Two heterozygous parents (Aa × Aa) have ${n} offspring. How many are expected to be homozygous recessive (aa)?`, n / 4, [n * 3 / 4, n / 2, n], `aa is ¼ of the offspring: ${n} ÷ 4.`); }]
  },
  physics: {
    1: [() => { const d = rnd(2, 60) * 10, t = rnd(2, 20); return mk(`A runner covers ${d} m in ${t} s. What is the average speed in m/s?`, d / t, [d * t, t / d, d / t + 2], `speed = distance ÷ time = ${d} ÷ ${t}.`); }],
    3: [() => { const m = rnd(2, 40), a = rnd(2, 9); return mk(`A ${m} kg object accelerates at ${a} m/s². What is the resultant force in N?`, m * a, [m / a, m + a, m * a * 10], `F = m × a = ${m} × ${a}.`); },
        () => { const m = rnd(2, 80); return mk(`What is the weight in N of a ${m} kg mass? (g = 10 N/kg)`, m * 10, [m / 10, m * 100, m + 10], `W = m × g = ${m} × 10.`); }],
    4: [() => { const m = rnd(2, 30), v = rnd(2, 25); return mk(`What is the momentum in kg m/s of a ${m} kg mass moving at ${v} m/s?`, m * v, [m + v, m / v, m * v * 2], `p = m × v = ${m} × ${v}.`); }],
    7: [() => { const i = rnd(2, 9), t = rnd(2, 30); return mk(`A current of ${i} A flows for ${t} s. How much charge in C passes?`, i * t, [i / t, i + t, t / i], `Q = I × t = ${i} × ${t}.`); }],
    8: [() => { const v = rnd(3, 24), r = rnd(2, 12); return mk(`A ${r} Ω resistor has ${v} V across it. What is the current in A?`, v / r, [v * r, r / v, v + r], `I = V ÷ R = ${v} ÷ ${r}.`); },
        () => { const i = rnd(2, 8), r = rnd(2, 15); return mk(`A current of ${i} A flows through a ${r} Ω resistor. What is the potential difference in V?`, i * r, [i / r, i + r, r / i], `V = I × R = ${i} × ${r}.`); }],
    6: [() => { const v = 230, i = rnd(1, 13); return mk(`A kettle draws ${i} A from the 230 V mains. What is its power in W?`, v * i, [v / i, v + i, i / v], `P = I × V = ${i} × 230.`); }],
    10: [() => { const f = rnd(2, 50), l = rnd(2, 12) / 2; return mk(`A wave has frequency ${f} Hz and wavelength ${l} m. What is its speed in m/s?`, f * l, [f / l, f + l, l / f], `v = f × λ = ${f} × ${l}.`); }],
    14: [() => { const u = rnd(2, 9) * 100, e = rnd(2, 9) * 10; const out = u * e / 100; return mk(`A machine takes in ${u} J and gives ${out} J of useful energy. What is its efficiency in %?`, e, [100 - e, out / 10, u / out], `efficiency = useful ÷ total × 100 = ${out} ÷ ${u} × 100.`); }],
    16: [() => { const f = rnd(2, 40), d = rnd(2, 25); return mk(`A force of ${f} N moves an object ${d} m in its direction. How much work in J is done?`, f * d, [f / d, f + d, d / f], `W = F × d = ${f} × ${d}.`); },
         () => { const w = rnd(2, 60) * 10, t = rnd(2, 20); return mk(`${w} J of work is done in ${t} s. What is the power in W?`, w / t, [w * t, t / w, w / t + 5], `P = W ÷ t = ${w} ÷ ${t}.`); }],
    18: [() => { const m = rnd(2, 90), v = rnd(2, 9); return mk(`A block has mass ${m} g and volume ${v} cm³. What is its density in g/cm³?`, m / v, [m * v, v / m, m / v + 1], `ρ = m ÷ V = ${m} ÷ ${v}.`); },
         () => { const f = rnd(2, 90) * 10, a = rnd(2, 9); return mk(`A force of ${f} N acts on an area of ${a} m². What is the pressure in Pa?`, f / a, [f * a, a / f, f / a + 10], `p = F ÷ A = ${f} ÷ ${a}.`); }],
    23: [() => { const h = rnd(2, 8), n = rnd(2, 4), a = rnd(1, 9) * 2 ** n; return mk(`A source has activity ${a * 1} Bq and half-life ${h} h. What is the activity after ${h * n} h?`, a / 2 ** n, [a / n, a / 2 ** (n + 1), a / 2 ** (n - 1)], `${n} half-lives: halve ${n} times.`); }]
  },
  chemistry: {
    5: [() => { const mr = [18, 44, 58.5, 40, 98, 36.5, 17][rnd(0, 6)], mol = rnd(1, 6) / 2; return mk(`What mass in g is ${mol} mol of a substance with Mr ${mr}?`, mol * mr, [mr / mol, mol + mr, mr * mol * 2], `mass = moles × Mr = ${mol} × ${mr}.`); }],
    6: [() => { const mr = [18, 44, 40, 98, 36.5, 100][rnd(0, 5)], m = mr * rnd(1, 5); return mk(`How many moles are in ${m} g of a substance with Mr ${mr}?`, m / mr, [m * mr, mr / m, m / mr + 1], `moles = mass ÷ Mr = ${m} ÷ ${mr}.`); }],
    16: [() => { const c = rnd(1, 8) / 4, v = rnd(1, 5) * 10; return mk(`How many moles are in ${v} cm³ of a ${c} mol/dm³ solution?`, c * v / 1000, [c * v, v / c / 1000, c / v * 1000], `moles = concentration × volume (dm³) = ${c} × ${v} ÷ 1000.`); },
         () => { const n = rnd(1, 6) / 10, v = rnd(1, 5) * 50; return mk(`${n} mol is dissolved to make ${v} cm³ of solution. What is the concentration in mol/dm³?`, n / (v / 1000), [n * v, n / v, v / n / 1000], `concentration = moles ÷ volume (dm³) = ${n} ÷ ${v / 1000}.`); }]
  }
};
function genQs(s, n, k) {
  const g = GENS[s]; if (!g) return [];
  const pairs = n ? (g[n] || []).map(f => [n, f]) : Object.entries(g).flatMap(([ch, fs]) => fs.map(f => [+ch, f]));
  if (!pairs.length) return [];
  const out = [];
  for (let i = 0; i < k; i++) { const [ch, f] = pairs[rnd(0, pairs.length - 1)]; out.push({q: f(), ch}); }
  return out;
}
function startQuiz(s, n) {
  const d = DATA[s];
  const pool = n ? (QUIZ[s][n] || []).map((q, k) => ({q, ch: n, k}))
                 : Object.entries(QUIZ[s]).flatMap(([ch, qs]) => qs.map((q, k) => ({q, ch: +ch, k})));
  const want = n ? Math.min(10, pool.length) : 15;
  const SEEN = load("sciSeen", {}), sk = it => `${s}-${it.ch}-${it.k}`;
  let fresh = shuffle(pool.filter(it => !SEEN[sk(it)]));
  if (fresh.length < want) {               /* every question used: start a new cycle */
    const keep = new Set(fresh.map(sk));
    pool.forEach(it => { if (!keep.has(sk(it))) delete SEEN[sk(it)]; });
    fresh = fresh.concat(shuffle(pool.filter(it => !keep.has(sk(it)))));
  }
  const items = fresh.slice(0, want);
  const gx = genQs(s, n, DATA[s].bychapter ? (n ? 10 : 15) : (n ? 3 : 4)); gx.forEach(o => items.push(o));
  shuffle(items);
  items.forEach(it => SEEN[sk(it)] = 1); save("sciSeen", SEEN);
  const left = pool.filter(it => !SEEN[sk(it)]).length;
  QZ = {s, n, i: 0, score: 0, log: [], left, poolSize: pool.length,
    items: items.map(({q, ch}) => ({ch, text: q[0], answer: q[1], expl: q[5], opts: shuffle([q[1], q[2], q[3], q[4]])}))};
  const c = n ? chap(s, n) : null;
  const head = c ? bar(s, c, "quiz", c.title + " — quiz", `${d.name} · Unit ${c.u} · ${QZ.items.length} questions · ${QZ.poolSize ? QZ.poolSize + ' in the bank, new ones each round' : 'fresh numbers every round'}`, "")
    : `<div class="reader-bar"><span class="ch">⚡</span><div class="ttl"><h2>${d.name} mixed quiz</h2><div class="meta">15 random questions from all ${d.ch.length} chapters, plus fresh calculations</div></div>
        <div class="tools"><button class="btn" id="fullBtn" type="button">⤢ Full screen</button><a class="btn" href="#${s}-spec">✓ Spec checklist</a><a class="btn" href="#${s}">✕ Close</a></div></div>`;
  showReader(c ? uColor(s, c.u) : sColor(s), head + `<div class="quiz-wrap"><div class="quiz" id="quiz"></div></div>`);
  wireBar("", "");
  drawQ();
}
function dotsHtml() {
  return `<span class="dots">${QZ.items.map((_, k) => `<i class="${k < QZ.log.length ? (QZ.log[k].ok ? "ok" : "bad") : k === QZ.i ? "now" : ""}"></i>`).join("")}</span>`;
}
function drawQ() {
  const it = QZ.items[QZ.i], d = DATA[QZ.s], c = chap(QZ.s, it.ch);
  $("#quiz").innerHTML = `<div class="qtop"><span>Question ${QZ.i + 1} of ${QZ.items.length}</span>${dotsHtml()}<span class="num">Score ${QZ.score}</span></div>
    <div class="qcard"><div class="from">${QZ.n ? "Chapter " + it.ch : "Ch " + it.ch + (c ? " · " + esc(c.title) : "")}</div><h3>${esc(it.text)}</h3></div>
    <div class="opts">${it.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}"><b>${"ABCD"[k]}</b><span>${esc(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k));
  $("#quiz").querySelector(".opt").focus({preventScroll: true});
}
function answer(k) {
  const it = QZ.items[QZ.i], pick = it.opts[k], ok = pick === it.answer;
  if (ok) QZ.score++;
  QZ.log.push({ok, text: it.text, answer: it.answer, pick});
  document.querySelectorAll(".opt").forEach((b, j) => {
    b.disabled = true;
    if (it.opts[j] === it.answer) b.classList.add("right");
    else if (j === k) b.classList.add("wrong"); else b.classList.add("dim");
  });
  const last = QZ.i === QZ.items.length - 1;
  $("#fb").innerHTML = `<div class="feedback" style="--fc:${ok ? "var(--ok)" : "var(--bad)"}"><strong>${ok ? "✓ Correct!" : "✗ Not quite — the answer is: " + esc(it.answer)}</strong>${esc(it.expl)}</div>
    <div class="qnav" style="margin-top:14px"><button class="btn primary" id="nextBtn" type="button">${last ? "See my score" : "Next question →"}</button></div>`;
  $(".qtop").outerHTML = `<div class="qtop"><span>Question ${QZ.i + 1} of ${QZ.items.length}</span>${dotsHtml()}<span class="num">Score ${QZ.score}</span></div>`;
  const nb = $("#nextBtn"); nb.onclick = () => { if (last) finish(); else { QZ.i++; drawQ(); } };
  nb.focus({preventScroll: true});
  nb.scrollIntoView({behavior: "smooth", block: "nearest"});
}
function finish() {
  const tot = QZ.items.length, pct = Math.round(QZ.score / tot * 100);
  if (QZ.n) { const key = `${QZ.s}-${QZ.n}`; const old = bestOf(QZ.s, QZ.n); if (!old || QZ.score / tot > old.s / old.t) { BEST[key] = {s: QZ.score, t: tot}; save("sciQuizBest", BEST); } }
  const msg = pct === 100 ? "Perfect score! 🎉" : pct >= 80 ? "Great work! 🌟" : pct >= 50 ? "Good effort — nearly there 💪" : "Keep revising — you've got this 📚";
  const again = QZ.n ? `#${QZ.s}-quiz-${QZ.n}` : `#${QZ.s}-quiz`;
  $("#quiz").innerHTML = `<div class="result"><div class="ring" style="--p:${pct}"><div class="num">${QZ.score}/${tot}</div></div><h3>${msg}</h3>
      ${QZ.n ? `<div class="meta-line" style="justify-content:center">${bestBadge(QZ.s, QZ.n)}</div>` : ""}
      <p class="status" style="padding:0">${QZ.poolSize === 0 ? "Every round has fresh numbers." : QZ.left >= (QZ.n ? 5 : 10) ? "Next round uses questions you haven't seen yet." : "You've seen every question in this bank — the next round starts a fresh mix."}</p></div>
    <div class="qnav" style="justify-content:center"><button class="btn primary" id="againBtn" type="button">↻ New questions</button>
      ${QZ.n ? `<a class="btn" href="#${QZ.s}-ch-${QZ.n}">📘 Revise the notes</a>` : ""}<a class="btn" href="#${QZ.s}">Back to ${DATA[QZ.s].name}</a></div>
    <div class="review">${QZ.log.map((l, k) => `<div style="--rc:${l.ok ? "var(--ok)" : "var(--bad)"}"><b>${k + 1}. ${esc(l.text)}</b>${l.ok ? "✓ " + esc(l.answer) : "✗ You chose “" + esc(l.pick) + "” · answer: " + esc(l.answer)}</div>`).join("")}</div>`;
  $("#againBtn").onclick = () => { if (location.hash === again) startQuiz(QZ.s, QZ.n); else location.hash = again; };
  renderList();
}


let EX = null;
function startExam(s, n) {
  const d = DATA[s]; let items = [];
  if (n) items = (EXAM[s][n] || []).map(q => ({...q, ch: n}));
  else Object.keys(EXAM[s]).forEach(k => { const a = shuffle(EXAM[s][k].slice()); items.push(...a.slice(0, 2).map(q => ({...q, ch: +k}))); });
  if (!n) items = shuffle(items).slice(0, 8); else items = shuffle(items);
  EX = {s, n, i: 0, got: 0, tot: 0, items};
  const c = n ? chap(s, n) : null;
  const head = c ? bar(s, c, "exam", c.title + " — exam questions", `${d.name} · ${items.length} written questions · answer, then check it`, "")
    : `<div class="reader-bar"><span class="ch">📝</span><div class="ttl"><h2>${d.name} exam questions</h2><div class="meta">8 written questions from all chapters</div></div><div class="tools"><button class="btn" id="fullBtn" type="button">⤢ Full screen</button><a class="btn" href="#${s}">✕ Close</a></div></div>`;
  showReader(c ? uColor(s, c.u) : sColor(s), head + `<div class="quiz-wrap"><div class="quiz" id="quiz"></div></div>`);
  wireBar("", "");
  drawEx();
}
const EXN = {short: "Short answer", calc: "Calculation", explain: "Explain / describe", extended: "Extended (6 marks)"};
function drawEx() {
  const it = EX.items[EX.i];
  $("#quiz").innerHTML = `<div class="qtop"><span>Question ${EX.i + 1} of ${EX.items.length}</span><span class="dots">${EX.items.map((_, k) => `<i class="${k < EX.i ? "ok" : k === EX.i ? "now" : ""}"></i>`).join("")}</span><span class="num">${EX.got}/${EX.tot} marks</span></div>
    <div class="qcard"><div class="from">Chapter ${it.ch}</div><h3 class="ex-q"><span class="ex-tag">${EXN[it.t] || "Question"}</span><span class="ex-tag">${it.m} mark${it.m > 1 ? "s" : ""}</span><br>${esc(it.q)}</h3>
      <textarea class="ex-ans" id="exAns" placeholder="Write your answer here, as you would in the exam…"></textarea></div>
    <div id="fb"></div><div class="qnav" id="exBtns"><button class="btn primary" id="exAI" type="button">Check my answer</button></div><div class="ex-left" id="exLeft"></div>`;
  const key = checksKey, left = () => Math.max(0, 10 - (+localStorage.getItem(key()) || 0));
  const showLeft = n => { const el = $("#exLeft"); if (el) el.textContent = `Checks left today: ${n}/10`; };
  showLeft(left());
  syncChecks().then(() => showLeft(left()));
  const reveal = (pts, note) => {
    $("#exBtns") && $("#exBtns").remove(); $("#exAns").readOnly = true;
    const marked = Array.isArray(pts);
    $("#fb").innerHTML = `${note || ""}<div class="ex-ms"><h4>Mark scheme${marked ? "" : " (not marked)"}</h4>${it.ms.map((p, k) => `<label><input type="checkbox" disabled ${marked && pts.includes(k) ? "checked" : ""}><span>${esc(p)}</span></label>`).join("")}${marked ? `<div class="ex-sc">Marks: ${Math.min(it.m, pts.length)}/${it.m}</div>` : ""}</div>
      <div class="qnav" style="margin-top:14px"><button class="btn primary" id="exNext" type="button">${EX.i === EX.items.length - 1 ? "See my total" : "Next question →"}</button></div>`;
    $("#exNext").onclick = () => { if (marked) { EX.got += Math.min(it.m, pts.length); EX.tot += it.m; } EX.i++; if (EX.i >= EX.items.length) finishEx(); else drawEx(); };
    $("#exNext").scrollIntoView({behavior: "smooth", block: "nearest"});
  };
  $("#exAI").onclick = async () => {
    const ans = $("#exAns").value.trim();
    if (ans.length < 3) { $("#fb").innerHTML = `<div class="feedback" style="--fc:var(--bad)"><strong>Write your answer first</strong>Your answer is checked as you type it.</div>`; return; }
    if (left() <= 0) { $("#fb").innerHTML = `<div class="feedback" style="--fc:var(--bad)"><strong>No checks left today</strong>You get 10 a day. They reset tomorrow.</div><div class="qnav"><button class="btn" id="exSkip" type="button">Skip and see the mark scheme</button></div>`; $("#exSkip").onclick = () => reveal(null); return; }
    const btn = $("#exAI"); btn.disabled = true; btn.textContent = "Checking…";
    try {
      const token = window.authToken ? await window.authToken() : null;
      const r = await fetch("/api/mark", {signal: AbortSignal.timeout(32000), method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({token, question: it.q, marks: it.m, scheme: it.ms, answer: ans})});
      const j = await r.json();
      if (r.status === 429) localStorage.setItem(key(), "10");
      if (!r.ok) throw new Error(j.error || "failed");
      localStorage.setItem(key(), String(10 - j.remaining));
      reveal(j.points, `<div class="feedback" style="--fc:var(--c, var(--accent));margin-bottom:12px"><strong>Marks: ${j.marks}/${it.m}</strong>${esc(j.feedback)}<br><small>Marks are final and can't be changed.</small></div>`);
    } catch (e) {
      btn.disabled = false; btn.textContent = "Check my answer"; showLeft(left());
      $("#fb").innerHTML = `<div class="feedback" style="--fc:var(--bad)"><strong>Checking isn't available right now</strong>${esc(e.message || "")}</div><div class="qnav"><button class="btn" id="exSkip" type="button">Skip and see the mark scheme</button></div>`;
      $("#exSkip").onclick = () => reveal(null);
    }
  };
}
// Checks used today are counted per account in Firestore; this keeps a local copy per account.
const checksDay = () => Math.floor((Date.now() + 4 * 3600000) / 86400000);
const checksKey = () => "aiMarks-" + ((window.authUser && window.authUser.email) || "guest") + "-" + checksDay();
async function syncChecks() {
  try {
    let t = null;
    for (let k = 0; k < 20 && !t; k++) {   // sign-in may still be loading when the page opens
      if (window.authToken && window.authUser) t = await window.authToken().catch(() => null);
      if (!t) await new Promise(r => setTimeout(r, 300));
    }
    if (!t) return;
    const uid = JSON.parse(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).user_id;
    const r = await fetch(`https://firestore.googleapis.com/v1/projects/studygcse-29350/databases/(default)/documents/checks/${uid}`, {headers: {Authorization: "Bearer " + t}, signal: AbortSignal.timeout(6000)});
    let n = 0;
    if (r.ok) { const f = (await r.json()).fields || {}; if (f.day && +f.day.integerValue === checksDay()) n = +(f.n && f.n.integerValue || 0); }
    else if (r.status !== 404) return;
    localStorage.setItem(checksKey(), String(n));
  } catch (e) {}
}
function finishEx() {
  const pct = EX.tot ? Math.round(EX.got / EX.tot * 100) : 0;
  const msg = pct >= 80 ? "Excellent exam technique! 🌟" : pct >= 50 ? "Good — check the points you missed 💪" : "Revise the notes and try again 📚";
  const again = EX.n ? `#${EX.s}-exam-${EX.n}` : `#${EX.s}-exam`;
  $("#quiz").innerHTML = `<div class="result"><div class="ring" style="--p:${pct}"><div class="num">${EX.got}/${EX.tot}</div></div><h3>${msg}</h3></div>
    <div class="qnav" style="justify-content:center"><button class="btn primary" id="againBtn" type="button">↻ Try again</button>${EX.n ? `<a class="btn" href="#${EX.s}-ch-${EX.n}">📘 Revise the notes</a>` : ""}<a class="btn" href="#${EX.s}">Back to ${DATA[EX.s].name}</a></div>`;
  $("#againBtn").onclick = () => { if (location.hash === again) startExam(EX.s, EX.n); else location.hash = again; };
}

function closeReader() { setFull(false); const r = $("#reader"); r.hidden = true; r.innerHTML = ""; }

function route() {
  const h = location.hash.slice(1);
  page = (h === "quizzes" || h === "support") ? h : null;
  const m = h.match(/^(biology|chemistry|physics|maths|humanbio|cs|geography)(?:-(ch|slides|spec|quiz|exam)(?:-(\d+))?)?$/);
  const ns = m ? m[1] : null;
  if (ns !== subj) { subj = ns; unitFilter = 0; query = ""; }
  if (page) { subj = null; }
  render();
  if (!m || !m[2]) { closeReader(); window.scrollTo({top: 0}); return; }
  const n = m[3] ? +m[3] : 0;
  if (m[2] === "ch" && n) openChapter(subj, n);
  else if (m[2] === "slides" && n) openSlides(subj, n);
  else if (m[2] === "spec" && n) openSpec(subj, n);
  else if (m[2] === "spec") openAllSpec(subj);
  else if (m[2] === "quiz") { startQuiz(subj, n); }
  else if (m[2] === "exam" && EXAM[subj]) startExam(subj, n);
  else closeReader();
}
window.addEventListener("hashchange", route);
route();
</script>
